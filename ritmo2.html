<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ritmo: você toca</title>
<style>
:root{--bg:#0b0a18;--tx:#ece8ff;--mut:#9d96c4;--fc:#a9b8ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(80% 60% at 50% 35%,#1d1640,var(--bg));color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
main{max-width:460px;height:100%;margin:0 auto;padding:18px 16px;display:flex;flex-direction:column}
h1{font-size:19px;margin:0}
p{color:var(--mut);margin:4px 0 0;font-size:14px}
#hud{display:flex;align-items:center;gap:14px;margin-top:20px}
#mult{min-width:86px;text-align:center;font:900 44px/1 system-ui,sans-serif;color:#fff;text-shadow:0 0 10px var(--fc),0 0 26px var(--fc)}
#mult.x1{color:#b9b4e0;text-shadow:none;opacity:.6}
#info{flex:1}
#txt{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;min-height:18px}
#casas{display:flex;gap:4px;margin-top:6px}
#casas i{flex:1;height:12px;border-radius:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:background .15s}
#casas i.on{background:var(--fc);box-shadow:0 0 10px var(--fc)}
#degraus{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
#degraus div{border-radius:10px;padding:7px 6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);text-align:center;transition:all .2s}
#degraus div b{display:block;font-size:18px}
#degraus div small{display:block;font-size:11px;color:var(--mut);line-height:1.25}
#degraus div.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
#degraus div.on b{color:var(--c)}
#area{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
#combo{font:900 60px/1 system-ui,sans-serif;opacity:.9}
#combo small{display:block;text-align:center;font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.1em}
#toca{font-size:13px;color:var(--mut);min-height:18px;text-align:center}
#toca b{color:var(--fc)}
canvas{width:100%;height:auto;aspect-ratio:440/70}
#placar{text-align:center;color:var(--mut);font-size:13px;min-height:18px}
.bts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
button{font:inherit;font-weight:700;background:#2a2450;color:var(--tx);border:0;border-radius:99px;padding:9px 16px;cursor:pointer}
button.g{background:#ffc861;color:#241a00}
</style>
</head>
<body>
<main>
<h1>Ritmo: você toca</h1>
<p>A música do Clássico, como no Guitar Hero: cada arrasto toca o arpejo daquele tempo. No ×1 só o baixo te acompanha; a cada multiplicador a banda ganha uma parte, e no ×4 a música está completa. Perdeu a nota: o arpejo falha e volta ao ×1.</p>
<div id="degraus"></div>
<div id="hud"><div id="mult" class="x1">×1</div><div id="info"><div id="txt">toque em começar</div><div id="casas"><i></i><i></i><i></i></div></div></div>
<div id="area">
  <div id="combo">0<small>COMBO</small></div>
  <div id="toca"></div>
  <canvas id="bar" width="440" height="70"></canvas>
  <div id="placar"></div>
</div>
<div class="bts"><button class="g" id="vai">▶ Começar</button><button id="cal">Calibrar</button></div>
</main>
<script type="module">
// Versão "você toca" do treino de ritmo: a música é a Pulsar (a do Clássico, musica/pulsar.js), tocada pelo mesmo motor
// do jogo (musica/eletronica.js), com as camadas ligadas e desligadas ao vivo (opc.mudo). O arpejo dela NÃO toca
// sozinho: cada arrasto na nota (uma por tempo) toca o pedaço de arpejo daquele tempo (as 4 semicolcheias), com o
// desenho, o timbre e o acorde da própria Pulsar. Perdeu a nota: aquele tempo fica sem arpejo. A banda entra aos poucos,
// presa ao multiplicador, e para no ×4:
//   ×1  baixo (discreto, marca o tempo)   ×2  + bateria   ×3  + acordes de fundo   ×4  + melodia
// O arranjo é fixo, em roda de 16 compassos (8 com o tema "Pulso" e 8 com uma frase sorteada), para ter melodia sempre.
// Mesmas regras do Frenesi de ritmo: 3 acertos por multiplicador; fora da nota ou nota perdida volta ao ×1.
// Calibração gravada em ptui_ritmo_atraso (a mesma do jogo).
import * as PUL from './musica/pulsar.js';
import { sorteio } from './musica/eletronica.js';
const JANELA=.13, VER=1.7, MIN=[0,3,6,9];
const COR=['#a9b8ff','#4fe3ff','#5dffa2','#ffd84a'];
const BANDA=['baixo','+ bateria','+ acordes','+ melodia'];
const mtof=m=>440*Math.pow(2,(m-69)/12);
let atraso=.03; try{ if(localStorage.ptui_ritmo_atraso) atraso=+localStorage.ptui_ritmo_atraso; }catch(e){}
const $=s=>document.querySelector(s);
let ac=null, dest=null, eco=null, rodando=false, calib=null, ult=null, P=60/112/4;
let passos=new Map(), notas=[], combo=0, k=0, maior=0, acertos=0, erros=0, fb=null;
const mudo={arpejo:true, bateria:true, acordes:true, melodia:true};
const camadas=()=>{ mudo.bateria=k<1; mudo.acordes=k<2; mudo.melodia=k<3; dest.gain.setTargetAtTime([1.15,1.3,1.4,1.45][k], ac.currentTime, .3); };

// a roda de compassos: o tema "Pulso" (8) e uma frase sorteada sobre a sequência B (8)
const rnd=sorteio(7);
const RODA=[...PUL.montaParte('A',{tema:PUL.TEMAS[0]},0,rnd), ...PUL.montaParte('B',{seq:PUL.OPCOES.SEQ_B[0], arp:3, mot:PUL.motivo(rnd)},0,rnd)];

function monta(){
  ac=new (window.AudioContext||window.webkitAudioContext)();
  dest=ac.createGain(); dest.gain.value=1.15; dest.connect(ac.destination);
  eco=ac.createDelay(1); eco.delayTime.value=60/112*.75; const fbk=ac.createGain(), lp=ac.createBiquadFilter(), ret=ac.createGain();
  fbk.gain.value=.34; lp.type='lowpass'; lp.frequency.value=2400; ret.gain.value=.45; eco.connect(lp); lp.connect(fbk); fbk.connect(eco); lp.connect(ret); ret.connect(dest);
}
// uma nota do arpejo, como o motor toca (eletronica.js), um pouco mais alta: é o instrumento de quem joga
function notaArp(T,s,B){
  const ch=B.ch, st=s%16; if(!B.arp || st%(B.arpCada||1)) return;
  const kk=(st/(B.arpCada||1))%B.arp.length, idx=B.arp[kk]; let m=ch[idx%4]+12*Math.floor(idx/4); if(B.arpOit) m+=12*B.arpOit;
  const o=ac.createOscillator(), fl=ac.createBiquadFilter(), g=ac.createGain(), pan=ac.createStereoPanner?.();
  o.type=B.arpOnda||'square'; o.frequency.value=mtof(m); fl.frequency.value=(B.arpLp||1500)+800*Math.sin(s/40); fl.Q.value=2;
  const v=(B.arpV||.024)*1.6, d=B.arpDur||.13; g.gain.setValueAtTime(0,0); g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(v,T+.004); g.gain.exponentialRampToValueAtTime(.0001,T+.004+d);
  o.connect(fl); fl.connect(g); let n=g; if(pan){ pan.pan.value=Math.sin(s*.4)*.35; g.connect(pan); n=pan; }
  n.connect(dest); const e=ac.createGain(); e.gain.value=.22; n.connect(e); e.connect(eco); o.start(T); o.stop(T+d+.1);
}

async function comeca(){
  if(!ac) monta(); await ac.resume();
  rodando=true; passos=new Map(); notas=[]; ult=null; combo=0; k=0; acertos=erros=0; camadas();
  PUL.iniciarMusica(ac,dest,{mudo, compasso:n=>RODA[n%RODA.length], aoPasso:(T,s,B)=>{ ult=[T,s]; passos.set(s,B); if(passos.size>80) passos.delete(passos.keys().next().value); }});
  pinta(); texto('arraste quando os traços chegarem no coração'); $('#vai').textContent='■ Parar';
}
function para(){ rodando=false; calib=null; PUL.pararMusica(.6); $('#vai').textContent='▶ Começar'; texto('parado'); pinta(); }
$('#vai').onclick=()=> rodando ? para() : comeca();
const lat=()=>ac?(ac.outputLatency||ac.baseLatency||0):0;
const ouvido=()=>ac.currentTime-lat();
// as notas: uma em cada tempo (passo múltiplo de 4), previstas pelo último passo agendado (o andamento é fixo)
function geraNotas(){
  if(!ult) return; const [T0,s0]=ult, fim=ac.currentTime+VER+.3;
  for(let s=Math.ceil((s0-8)/4)*4; T0+(s-s0)*P<fim; s+=4){ if(s<0 || notas.some(n=>n.s===s)) continue; notas.push({s, T:T0+(s-s0)*P}); }
  notas=notas.filter(n=>n.T>ouvido()-2).sort((a,b)=>a.T-b.T);
}
function arrasto(){
  if(!rodando || !ult) return; const agora=ac.currentTime, t=ouvido()-atraso;
  let m=null, e=9; for(const n of notas) if(!n.ok && !n.perdida && Math.abs(n.T-t)<e){ e=Math.abs(n.T-t); m=n; }
  if(calib){ if(m){ calib.push(t-m.T); m.ok=true; } fb={t:performance.now()/1000,ok:true}; return fimCalib(); }
  if(m && e<=JANELA){ m.ok=true; acertos++; combo++; maior=Math.max(maior,combo);
    const B=passos.get(m.s); if(B) for(let i=0;i<4;i++){ const Ti=m.T+i*P; if(Ti>=agora-.02) notaArp(Math.max(Ti,agora),m.s+i,B); }   // o arpejo daquele tempo
    const k0=k; k=combo>=9?3:combo>=6?2:combo>=3?1:0; if(k!==k0){ camadas(); texto('×'+(k+1)+'! entra '+BANDA[k].replace('+ ','')); } else texto(e<=JANELA*.45?'na nota!':'ok');
    fb={t:performance.now()/1000,ok:true}; }
  else { erros++; quebra(m && t<m.T ? 'cedo demais' : 'atrasou'); }
  pinta();
}
function quebra(msg){ if(combo>0){ combo=0; k=0; camadas(); } fb={t:performance.now()/1000,ok:false}; texto(msg); pinta(); }
function texto(s){ $('#txt').textContent=s; }
function pinta(){
  document.body.style.setProperty('--fc',COR[k]);
  $('#mult').textContent='×'+(k+1); $('#mult').classList.toggle('x1',k===0);
  const f = k===3 ? 3 : combo-MIN[k]; document.querySelectorAll('#casas i').forEach((c,i)=>c.classList.toggle('on',i<f));
  $('#combo').firstChild.textContent=combo;
  document.querySelectorAll('#degraus div').forEach((d,i)=>d.classList.toggle('on',i<=k && rodando));
  $('#toca').innerHTML = rodando ? (calib ? 'calibrando: arraste junto com cada traço' : 'você toca <b>o arpejo</b>') : '';
  $('#placar').textContent = calib ? `calibrando: ${calib.length} de 10` : acertos+erros ? `${acertos} na nota · ${erros} fora · maior combo ${maior} · calibração ${Math.round(atraso*1000)} ms` : '';
}
$('#degraus').innerHTML=COR.map((c,i)=>`<div style="--c:${c}"><b>×${i+1}</b><small>${BANDA[i]}</small></div>`).join('');

// calibração: 10 arrastos junto com os traços (o baixo e a bateria tocam para guiar); o meio-termo do desvio, sem os 2 primeiros
$('#cal').onclick=async()=>{ if(!rodando) await comeca(); calib=[]; combo=0; k=0; mudo.bateria=false; texto('arraste junto com cada batida'); pinta(); };
function fimCalib(){ pinta(); if(calib.length<10) return;
  const v=calib.map(x=>x+atraso).slice(2).sort((a,b)=>a-b); atraso=Math.max(-.2,Math.min(.35,v[Math.floor(v.length/2)]));
  try{ localStorage.ptui_ritmo_atraso=atraso.toFixed(3); }catch(e){}
  calib=null; camadas(); texto(`calibrado: ${Math.round(Math.abs(atraso)*1000)} ms ${atraso>=0?'depois':'antes'} da batida`); pinta(); }

// entrada: arrasto (vale quando o dedo anda uns 18 px, como no jogo) ou setas e espaço
let p0=null;
addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; p0=[e.clientX,e.clientY]; });
addEventListener('pointermove',e=>{ if(p0 && Math.hypot(e.clientX-p0[0],e.clientY-p0[1])>18){ p0=null; arrasto(); } });
addEventListener('pointerup',()=>{ p0=null; });
addEventListener('keydown',e=>{ if(/^Arrow| /.test(e.key)){ e.preventDefault(); if(!e.repeat) arrasto(); } });

// ---------- barras ----------
const cv=$('#bar'), g=cv.getContext('2d'), W=cv.width, H=cv.height;
function quadro(){
  requestAnimationFrame(quadro);
  g.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, meio=W/2-22, agora=performance.now()/1000;
  let pul=0;
  if(rodando && ac && ult){ geraNotas(); const ouv=ouvido();
    if(!calib) for(const n of notas) if(!n.ok && !n.perdida && n.T<ouv-atraso-JANELA){ n.perdida=true; if(combo>0){ erros++; quebra('perdeu a nota'); } }
    const ant=notas.filter(n=>n.T<=ouv).pop(); if(ant) pul=Math.pow(Math.max(0,1-(ouv-ant.T)/(4*P)),4);
    const gr=g.createLinearGradient(0,0,W,0); gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(.5,'rgba(255,255,255,.16)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr; g.fillRect(0,cy-2,W,4);
    for(const n of notas){ if(n.ok||n.perdida) continue; const d=n.T-ouv; if(d<-.05||d>VER) continue; const x=Math.max(0,d)/VER*meio;
      g.globalAlpha=Math.min(1,(1-d/VER)*2.2); g.fillStyle=calib?'#fff':COR[k]; for(const s of [-1,1]) g.fillRect(cx+s*(x+22)-3.5,cy-19,7,38); }
    g.globalAlpha=1; }
  const fa=fb?agora-fb.t:9, acende=fa<.25, treme=fb&&!fb.ok&&acende?Math.sin(fa*80)*5*(1-fa/.25):0, s=1+.22*pul+(acende&&fb.ok?.28*(1-fa/.25):0);
  g.save(); g.translate(cx+treme,cy+2); g.scale(s*1.25,s*1.25);
  g.fillStyle=acende?(fb.ok?'#5dffa2':'#ff5a5a'):'#ff6b8a'; g.shadowColor=g.fillStyle; g.shadowBlur=acende?16:7*pul;
  g.beginPath(); g.moveTo(0,10); g.bezierCurveTo(-24,-7,-11,-24,0,-11); g.bezierCurveTo(11,-24,24,-7,0,10); g.fill(); g.restore();
}
window.__r={ estado:()=>({combo, k, atraso, ouvido:ac?ouvido():0, notas:notas.filter(n=>!n.ok&&!n.perdida).map(n=>n.T), mudo:{...mudo}}) };   // para os testes conferirem
pinta(); quadro();
</script>
</body>
</html>
