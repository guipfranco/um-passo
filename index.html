<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#15121c">
<title>Um Passo (nível teste)</title>
<style>
:root{--n:4;--cell:min(calc(94vw / var(--n) - 2vw),100px);--gap:min(1.6vw,8px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#15121c;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 8px}
.wide{width:calc(var(--n)*var(--cell) + (var(--n) + 1)*var(--gap))}
.hud{display:flex;gap:6px}
.stat{background:#231e2e;border-radius:10px;padding:6px 4px;text-align:center;flex:1;min-width:0}
.stat b{display:block;font-size:19px;white-space:nowrap}
.stat small{opacity:.55;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.mini{display:inline-flex;min-width:26px;height:26px;padding:0 4px;border-radius:6px;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;vertical-align:middle}
#board{position:relative;height:calc(var(--n)*var(--cell) + (var(--n) + 1)*var(--gap));background:#1d1826;border-radius:16px;box-shadow:inset 0 0 0 2px #2e2740}
.cell-bg{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);border-radius:12px;background:#28213a}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .13s ease-out}
.face{position:relative;width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cell)*var(--fs,.44));background:var(--c,#555);color:#fff;text-shadow:0 2px 0 #0004;box-shadow:0 4px 0 #0005}
.face.low{opacity:.45;filter:saturate(.5)}
.face.eq{box-shadow:0 4px 0 #0005,0 0 0 4px #ffd43b}
.face.high::after{content:'▲';position:absolute;top:2px;right:7px;font-size:calc(var(--cell)*.17);color:#fff;text-shadow:none}
.face.player{background:#ffd43b;color:#2a1f2f;text-shadow:none;box-shadow:0 4px 0 #0005,0 0 22px #ffd43bcc}
.face.player::before{content:'★';position:absolute;top:1px;font-size:calc(var(--cell)*.16);color:#8a5a00}
.spawn{animation:spawn .18s ease-out}
@keyframes spawn{from{transform:scale(0)}to{transform:scale(1)}}
.pop{animation:pop .22s ease-out}
@keyframes pop{50%{transform:scale(1.25)}}
.bump{animation:bump .16s ease-out}
@keyframes bump{50%{transform:translate(calc(var(--dx)*10px),calc(var(--dy)*10px))}}
.die{animation:die .16s forwards}
@keyframes die{to{transform:scale(0);opacity:0}}
#msg{min-height:22px;text-align:center;font-size:15px;opacity:.85}
.btns{display:flex;gap:8px;justify-content:center}
button{font:inherit;color:#eee;background:#2c2639;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
button:active{transform:scale(.97)}
#overlay{position:fixed;inset:0;background:#0b0910d0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#overlay.hidden{display:none}
.box{background:#231e2e;border-radius:16px;padding:18px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin:0 0 8px}
.box ul{padding-left:18px;line-height:1.45;font-size:14px}
.primary{background:#ffcf4a;color:#2a1f2f;font-weight:700;width:100%;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="hud wide">
    <div class="stat"><small>Você</small><b id="you">1</b></div>
    <div class="stat"><small>Meta</small><b id="goal"></b></div>
    <div class="stat"><small>Jogadas</small><b id="moves">0</b></div>
    <div class="stat"><small>Próximo</small><b id="next"></b></div>
  </div>
  <div id="board" class="wide"></div>
  <div id="msg" class="wide"></div>
  <div class="btns">
    <button id="btnRules">? Regras</button>
    <button id="btnRestart">↻ Recomeçar</button>
  </div>
</div>
<div id="overlay" class="hidden"><div class="box" id="box"></div></div>

<script>
// ================== CONFIG ==================
const CFG = {
  N: 4,          // tamanho do tabuleiro
  goal: 64,      // valor para vencer o nível
  start: 1,      // seu valor inicial
  initial: 5,    // monstros no começo
  // o que nasce, em relação ao seu valor v: [valor, peso]
  spawnTable: v => [[v/4,1],[v/2,3],[v,4],[v*2,2],[v*4,1]],
};

// inimigos: tons de vermelho, do claro (fraco) ao escuro (forte)
const COLORS=['#ff8a80','#ff6b6b','#f04848','#d93636','#c22a2a','#a81f1f','#8c1717','#701010'];
const color = v => COLORS[Math.min(Math.round(Math.log2(v)), COLORS.length-1)];

// ================== ESTADO ==================
const N = CFG.N;
document.documentElement.style.setProperty('--n', N);
const $ = s => document.querySelector(s);
const board = $('#board');
const els = new Map();
let S, nextId = 1;
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const inside = (x,y) => x>=0 && y>=0 && x<N && y<N;
const pos = (x,y) => `translate(calc(${x}*(var(--cell) + var(--gap)) + var(--gap)), calc(${y}*(var(--cell) + var(--gap)) + var(--gap)))`;

for(let y=0;y<N;y++) for(let x=0;x<N;x++){
  const c=document.createElement('div'); c.className='cell-bg'; c.style.transform=pos(x,y); board.appendChild(c);
}

function newGame(){
  for(const el of els.values()) el.remove();
  els.clear();
  const mid = Math.floor(N/2);
  S = {p:{id:'p', x:mid, y:mid, v:CFG.start}, mons:[], next:null, moves:0, over:false};
  // começa com pelo menos 2 do seu tamanho
  for(let i=0;i<CFG.initial;i++){
    const free = emptyCells(); if(!free.length) break;
    const c = pick(free);
    S.mons.push({id:'m'+(nextId++), x:c.x, y:c.y, v: i<2 ? S.p.v : rollSpawn().v});
  }
  S.next = rollSpawn();
  msg('Arraste: tudo no tabuleiro anda uma casa.');
  render();
}

function emptyCells(){
  const out=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(!entAt(S.p,S.mons,x,y)) out.push({x,y});
  return out;
}

function rollSpawn(){
  const table = CFG.spawnTable(S.p.v).filter(([v])=>v>=1 && Number.isInteger(v));
  let r = Math.random()*table.reduce((a,b)=>a+b[1],0);
  for(const [v,w] of table){ if((r-=w)<0) return {v}; }
  return {v:S.p.v};
}

function entAt(p,mons,x,y){
  if(p.x===x && p.y===y) return p;
  return mons.find(m=>!m.dead && m.x===x && m.y===y);
}

// ================== REGRA DO MOVIMENTO ==================
// Tudo anda uma casa na direção do arrasto. Quem está mais à frente anda primeiro,
// então uma fila inteira desliza junta se houver espaço na ponta.
// Você x monstro (quando um entra no outro):
//   igual  -> some e você DOBRA
//   menor  -> some
//   maior  -> bloqueia
// Monstro x monstro: bloqueia.
function simulate(dx,dy){
  const p = {...S.p};
  const mons = S.mons.map(m=>({...m}));
  const ents = [p, ...mons].sort((a,b)=>(b.x*dx+b.y*dy)-(a.x*dx+a.y*dy));
  const ev = {changed:false, merged:false, eaten:[], blocked:false};
  for(const e of ents){
    if(e.dead) continue;
    const nx=e.x+dx, ny=e.y+dy;
    if(!inside(nx,ny)) continue;
    const t = entAt(p,mons,nx,ny);
    if(!t){ e.x=nx; e.y=ny; ev.changed=true; continue; }
    const isP = e===p, tIsP = t===p;
    if(!isP && !tIsP) continue;           // monstro x monstro
    const mo = isP ? t : e;
    if(mo.v > p.v){ if(isP) ev.blocked=true; continue; }
    if(mo.v === p.v){ p.v *= 2; ev.merged=true; }
    mo.dead = true; ev.eaten.push(mo.id);
    if(isP){ p.x=nx; p.y=ny; }
    ev.changed = true;
  }
  return {p, mons:mons.filter(m=>!m.dead), ev};
}

function move(dx,dy){
  if(S.over || !$('#overlay').classList.contains('hidden')) return;
  const r = simulate(dx,dy);
  if(!r.ev.changed){ anim('p','bump',dx,dy); return; }

  for(const id of r.ev.eaten) killEl(id);
  S.p = r.p; S.mons = r.mons; S.moves++;

  // nasce um monstro na borda oposta ao arrasto
  const edge = emptyCells().filter(c => dx===1 ? c.x===0 : dx===-1 ? c.x===N-1 : dy===1 ? c.y===0 : c.y===N-1);
  if(edge.length){
    const c = pick(edge);
    S.mons.push({id:'m'+(nextId++), x:c.x, y:c.y, v:S.next.v});
    S.next = rollSpawn();
  }
  // nunca deixa faltar alguém do seu tamanho
  if(!S.mons.some(m=>m.v===S.p.v)) S.next = {v:S.p.v};

  if(r.ev.merged){ anim('p','pop'); msg(`Dobrou! Agora você é ${S.p.v}.`); }
  else if(r.ev.eaten.length) msg('Derrotou um menor.');
  else if(r.ev.blocked) msg('Um maior te bloqueou.');
  else msg('');

  render();
  if(S.p.v >= CFG.goal) return end(true);
  if(![[0,1],[0,-1],[1,0],[-1,0]].some(([x,y])=>simulate(x,y).ev.changed)) end(false);
}

function end(won){
  S.over = true;
  const key='umpasso_best_'+CFG.goal;
  let best = +(localStorage[key]||0);
  if(won && (!best || S.moves<best)){ best=S.moves; localStorage[key]=best; }
  setTimeout(()=>{
    showOverlay(won
      ? `<h2>Você chegou a ${S.p.v}!</h2><p>Em <b>${S.moves}</b> jogadas${best?` (recorde: ${best})`:''}.</p><button class="primary" id="again">Jogar de novo</button>`
      : `<h2>Travou</h2><p>Nenhum arrasto mexe mais o tabuleiro. Você chegou a <b>${S.p.v}</b> em ${S.moves} jogadas.</p><button class="primary" id="again">Tentar de novo</button>`);
    $('#again').onclick=()=>{ hideOverlay(); newGame(); };
  }, 350);
}

// ================== DESENHO ==================
function render(){
  const p=S.p;
  drawTile('p', p.x, p.y, p.v, 'player');
  for(const m of S.mons) drawTile(m.id, m.x, m.y, m.v, m.v===p.v ? 'eq' : m.v<p.v ? 'low' : 'high');
  $('#you').textContent = p.v;
  $('#goal').textContent = CFG.goal;
  $('#moves').textContent = S.moves;
  $('#next').innerHTML = `<span class="mini" style="background:${color(S.next.v)}">${S.next.v}</span>`;
}

function drawTile(id,x,y,v,cls){
  let el = els.get(id);
  if(!el){
    el = document.createElement('div'); el.className='tile';
    el.innerHTML = '<div class="face spawn"></div>';
    el.style.transition='none'; el.style.transform=pos(x,y);
    board.appendChild(el); els.set(id,el);
    void el.offsetWidth; el.style.transition='';
    el.firstChild.addEventListener('animationend', e=>{ if(e.target===el.firstChild && e.animationName!=='die') el.firstChild.classList.remove(e.animationName); });
  }
  el.style.transform = pos(x,y);
  el.style.zIndex = id==='p' ? 3 : 1;
  const face = el.firstChild;
  const keep = [...face.classList].filter(c=>['spawn','pop','bump','die'].includes(c));
  face.className = ['face', cls, ...keep].join(' ');
  face.textContent = v;
  face.style.setProperty('--fs', v>=100 ? .3 : v>=10 ? .38 : .44);
  if(id!=='p') face.style.setProperty('--c', color(v));
}

function killEl(id){
  const el = els.get(id); els.delete(id);
  if(el){ el.style.zIndex=0; el.firstChild.classList.add('die'); setTimeout(()=>el.remove(),170); }
}

function anim(id,name,dx=0,dy=0){
  const el = els.get(id); if(!el) return;
  const f = el.firstChild;
  f.style.setProperty('--dx',dx); f.style.setProperty('--dy',dy);
  f.classList.remove(name); void f.offsetWidth; f.classList.add(name);
}

function msg(t){ $('#msg').textContent = t; }
function showOverlay(html){ $('#box').innerHTML = html; $('#overlay').classList.remove('hidden'); }
function hideOverlay(){ $('#overlay').classList.add('hidden'); }

function showRules(){
  showOverlay(`<h2>Um Passo (nível teste)</h2>
  <ul>
    <li>Arraste (ou use setas / WASD): <b>tudo no tabuleiro anda uma casa</b> para aquele lado, se tiver espaço.</li>
    <li>Você é a peça <b>dourada</b> com ★. Os inimigos são <b>vermelhos</b>: quanto mais escuro, mais forte.</li>
    <li>Encostou num <b>igual</b> (contorno dourado): ele some e <b>você dobra</b>.</li>
    <li>Encostou num <b>menor</b> (apagado): ele some.</li>
    <li>Um <b>maior</b> (▲) bloqueia o caminho.</li>
    <li>A cada jogada entra uma peça nova pela borda oposta (veja "Próximo").</li>
    <li>Chegue a <b>${CFG.goal}</b>. Se nada mais se mexer, travou.</li>
  </ul>
  <button class="primary" id="ok">Bora</button>`);
  $('#ok').onclick=()=>{ localStorage.umpasso_seen2=1; hideOverlay(); };
}

// ================== ENTRADA ==================
const KEYS = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown', e=>{
  const k = KEYS[e.key.length===1 ? e.key.toLowerCase() : e.key];
  if(k){ e.preventDefault(); move(...k); }
});
let touch=null;
addEventListener('pointerdown', e=>{
  if(!$('#overlay').classList.contains('hidden') || e.target.closest('button')) return;
  touch={x:e.clientX, y:e.clientY};
});
addEventListener('pointerup', e=>{
  if(!touch) return;
  const dx=e.clientX-touch.x, dy=e.clientY-touch.y; touch=null;
  if(Math.max(Math.abs(dx),Math.abs(dy)) < 22) return;
  if(Math.abs(dx)>Math.abs(dy)) move(Math.sign(dx),0); else move(0,Math.sign(dy));
});
$('#btnRules').onclick = showRules;
$('#btnRestart').onclick = newGame;

newGame();
if(!localStorage.umpasso_seen2) showRules();
</script>
</body>
</html>
