// ---------- como jogar ----------
// três telas: o arrasto (animado), a escada inteira e os dois modos
function cjCasa(c,x,y,pa){ c.beginPath(); c.arc(x,y,pa*.39,0,7); c.fillStyle='rgba(16,12,38,.55)'; c.fill(); c.lineWidth=Math.max(1,pa*.012); c.strokeStyle='rgba(190,170,255,.25)'; c.stroke(); }
const cjEase = k => k<=0?0:k>=1?1:k*k*(3-2*k);
function cjArrasto(c,W,H,u,t){
  const pa=W/4, cy=pa*.5, s=t%3.6, P1=nomeNivelEsp(1), P2=nomeNivelEsp(2), x=i=>(i+.5)*pa, uu=pa*.82;
  const fade = s>3.2 ? 1-(s-3.2)/.4 : s<.15 ? s/.15 : 1;
  for(let i=0;i<4;i++) cjCasa(c,x(i),cy,pa);
  // o dedo: um ponto aceso que corre da direita para a esquerda, em baixo
  if(s>.2 && s<1.15){ const k=cjEase((s-.2)/.8), fx=W*(.88-.76*k), fy=pa*1.12;
    const g=c.createLinearGradient(fx,0,Math.min(W,fx+pa*1.4),0); g.addColorStop(0,'rgba(110,230,255,.8)'); g.addColorStop(1,'rgba(110,230,255,0)');
    c.strokeStyle=g; c.lineWidth=pa*.07; c.lineCap='round'; c.beginPath(); c.moveTo(fx,fy); c.lineTo(Math.min(W*.9,fx+pa*1.4),fy); c.stroke();
    c.fillStyle='#bff4ff'; c.shadowColor='rgba(110,230,255,.95)'; c.shadowBlur=pa*.2; c.beginPath(); c.arc(fx,fy,pa*.08,0,7); c.fill(); c.shadowBlur=0; }
  const k=cjEase((s-.55)/.4);
  if(s<.95){ ESP.drawPeca(c,P1,t,x(1-k),cy,uu,fade); ESP.drawPeca(c,P1,t,x(3-3*k),cy,uu,fade); }
  else{ const p=s<1.3 ? 1+.35*Math.sin(Math.PI*(s-.95)/.35) : 1;
    if(s<1.4){ const r=(s-.95)/.45; c.strokeStyle=`rgba(191,244,255,${(1-r).toFixed(2)})`; c.lineWidth=pa*.04; c.beginPath(); c.arc(x(0),cy,pa*(.2+.3*r),0,7); c.stroke(); }
    ESP.drawPeca(c,P2,t,x(0),cy,uu,fade,false,p); }
  if(s>1.45) ESP.drawPeca(c,P1,t,x(3),cy,uu,fade,false,cjEase((s-1.45)/.3));
}
function cjEscada(c,W,H,u,t){
  const col=6, pa=W/col, ph=pa*1.36; c.textAlign='center'; c.textBaseline='middle';
  ESP.LADDER.forEach((d,i)=>{ const x=(i%col+.5)*pa, y=Math.floor(i/col)*ph+pa*.5;
    ESP.drawPeca(c,d.n,t,x,y,pa*.74,1,true);
    c.font=`800 ${pa*.15}px 'Exo 2',sans-serif`; c.fillStyle='#f2b33d'; c.fillText(String(2**(i+1)),x,y+pa*.5);
    c.font=`700 ${pa*(d.n.length>8?.13:.15)}px 'Exo 2',sans-serif`; c.fillStyle='#f1eefc'; c.fillText(d.n,x,y+pa*.69); });
}

// Estilo Threes: um som de arrasto e um som de fusão diferente para cada nível.
let AC=null, BUS=null, NB=null;
function ctxAudio(){
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); BUS=AC.createGain(); BUS.gain.value=.9; BUS.connect(AC.destination); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function ac(){ return sound ? ctxAudio() : null; }

// Trilha por tela (todas sintetizadas, vindas do Gabinete). TRIM iguala o volume entre elas.
const TRILHA = {menu:'lofi-prorroga', mapa:'armorial', mina:'lofi-espera', fiscal:'lofi-segredo', mercador:'bossa', fim:'sofrencia-lofi'};
const TRIM = {'armorial':.55, 'bossa':.7, 'lofi-prorroga':.95, 'lofi-espera':.95, 'lofi-segredo':1, 'sofrencia-lofi':1.1, 'orbita':1.6, 'estacao':1.55, 'pulsar':1.45};   // as eletrônicas medidas contra o lo-fi

// no espaço (2048 Astros) as trilhas são eletrônicas: Estação no menu e na lista de fases, Órbita na Jornada, Pulsar no Clássico
function qualTrilha(k){
  if(typeof espacoLigado==='function' && espacoLigado()){
    if(k==='menu' && (S?.phase==='lista' || document.getElementById('scrMenu')?.classList.contains('on'))) return 'estacao';   // a troca roda depois que a tela já mudou
    if(k==='mina' && S && (S.missao||S.infinito)) return S.infinito ? 'pulsar' : 'orbita';
  }
  return TRILHA[k];

async function trocaMusica(){
  const want = music && musKey ? qualTrilha(musKey) : null;
  if(want===musName) return;
  if(MUS){ MUS.pararMusica(1.2); MUS=null; musName=null; }
  if(!want) return;
  const c=ctxAudio(); if(!c) return;
  const m = await import(`./musica/${want}.js`);
  musBus = c.createGain(); musBus.gain.value = TRIM[want]||1; musBus.connect(c.destination);

// a música acompanha o dia: a bateria some com o cansaço, e a fita desafina quando acaba a energia
function humor(){
  if(!MUS || musName!=='lofi-espera' || !S) return;
  const r = S.semEnergia ? Math.max(0, 1 - S.tiles.length/(W*H)) : Math.max(0, S.energy)/Math.max(1, S.energyMax);
  MUS.niveis({f:50, o:45, j:18+47*r, c:35+25*r});

function env(g,T,a,v,d){ g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(v,T+a); g.gain.exponentialRampToValueAtTime(.0001,T+a+d); }

  const c=ac(); if(!c) return; const T=c.currentTime+t, o=c.createOscillator(), g=c.createGain();

  env(g,T,a,v,d); let n=o; if(lp){ const fl=c.createBiquadFilter(); fl.frequency.value=lp; o.connect(fl); n=fl; }
  n.connect(g); g.connect(BUS); o.start(T); o.stop(T+a+d+.05);
}
function noise({t=0,a=.002,d=.1,v=.2,type='bandpass',f=1000,to=null,q=1}={}){

  s.buffer=NB; fl.type=type; fl.frequency.setValueAtTime(f,T); if(to) fl.frequency.exponentialRampToValueAtTime(to,T+a+d); fl.Q.value=q;
  env(g,T,a,v,d); s.connect(fl); fl.connect(g); g.connect(BUS); s.start(T,Math.random()*.5); s.stop(T+a+d+.05);

  m.connect(mg); mg.connect(o.frequency); env(g,T,.003,v,d); o.connect(g); g.connect(BUS);

// Aprovados no rascunho som.html (2026-11-09). Cada corpo tem o seu material: as miúdas tilintam, os planetas soam
// como sinos, os gigantes são graves e longos, as estrelas explodem; dentro de cada família a nota sobe.
// Têm eco (sala grande) e um pouco de repetição (delay); a mina continua com os sons dela.
let SALA=null, ECO=null;
function salas(c){
  if(SALA) return;
  SALA=c.createConvolver(); const n=Math.round(c.sampleRate*3.2), b=c.createBuffer(2,n,c.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2); }
  SALA.buffer=b; const rg=c.createGain(); rg.gain.value=.5; SALA.connect(rg); rg.connect(BUS);
  ECO=c.createDelay(1); ECO.delayTime.value=.45; const fb=c.createGain(), lp=c.createBiquadFilter(); fb.gain.value=.36; lp.type='lowpass'; lp.frequency.value=2400;
  ECO.connect(lp); lp.connect(fb); fb.connect(ECO); const dg=c.createGain(); dg.gain.value=.45; lp.connect(dg); dg.connect(BUS);
}
function saidaE(c,g,o){ let n=g; if(o.pan && c.createStereoPanner){ const p=c.createStereoPanner(); p.pan.value=Math.max(-1,Math.min(1,o.pan)); g.connect(p); n=p; }
  n.connect(BUS); if(o.rev){ const s=c.createGain(); s.gain.value=o.rev; n.connect(s); s.connect(SALA); } if(o.dly){ const s=c.createGain(); s.gain.value=o.dly; n.connect(s); s.connect(ECO); } }

  os.type=type; os.frequency.setValueAtTime(f,T); if(to) os.frequency.exponentialRampToValueAtTime(to,T+a+d); if(o.det) os.detune.value=o.det;
  env(g,T,a,v,d); let n=os; if(lp){ const fl=c.createBiquadFilter(); fl.frequency.setValueAtTime(lp,T); if(o.lpTo) fl.frequency.exponentialRampToValueAtTime(o.lpTo,T+a+d); fl.Q.value=q; os.connect(fl); n=fl; }
  n.connect(g); saidaE(c,g,o); os.start(T); os.stop(T+a+d+.1); }

  if(!NB){ NB=c.createBuffer(1,c.sampleRate,c.sampleRate); const d0=NB.getChannelData(0); for(let i=0;i<d0.length;i++) d0[i]=Math.random()*2-1; }
  const T=c.currentTime+(o.t||0), {a=.002,d=.1,v=.1,type='bandpass',f=1000,to=null,q=1}=o, s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain();
  s.buffer=NB; fl.type=type; fl.frequency.setValueAtTime(f,T); if(to) fl.frequency.exponentialRampToValueAtTime(to,T+a+d); fl.Q.value=q;
  env(g,T,a,v,d); s.connect(fl); fl.connect(g); saidaE(c,g,o); s.start(T,Math.random()*.5); s.stop(T+a+d+.1); }
function sinoE(o){ const c=ac(); if(!c) return; salas(c); const T=c.currentTime+(o.t||0), {f=880,d=1,v=.1,ratio=3.5,idx=2}=o, cr=c.createOscillator(), m=c.createOscillator(), mg=c.createGain(), g=c.createGain();
  cr.frequency.value=f; m.frequency.value=f*ratio; mg.gain.setValueAtTime(f*idx,T); mg.gain.exponentialRampToValueAtTime(Math.max(1,f*.01),T+d);
  m.connect(mg); mg.connect(cr.frequency); env(g,T,.003,v,d); cr.connect(g); saidaE(c,g,o); cr.start(T); m.start(T); cr.stop(T+d+.1); m.stop(T+d+.1); }
const PENTA=[0,2,4,7,9];
const notaE=(oit,grau)=>{ const k=((grau%5)+5)%5, o=Math.floor(grau/5); return 293.66*Math.pow(2,oit+o+PENTA[k]/12); };   // pentatônica de Ré
const ladoE=()=>(Math.random()-.5)*.6;

      const g=l-6, f=notaE(0,g+1);
      sinoE({f,d:1.1+g*.12,v:.11,ratio:2,idx:1.1,pan:p,rev:.45,dly:.12}); tomE({f:f/2,a:.01,d:.9+g*.1,v:.09,pan:p,rev:.2});
      if(l>=9) sinoE({t:.06,f:f*1.5,d:1,v:.04,ratio:2,idx:.7,pan:-p,rev:.5});
      if(l===11) [0,2,4].forEach((k,i)=>sinoE({t:.12+i*.07,f:notaE(1,k),d:1.3,v:.035,ratio:2,idx:.6,rev:.6}));
    } else if(l<=15){   // gigantes: graves, largos e longos (Saturno: o anel brilha em volta)
      const g=l-12, f=notaE(-1,g+1);
      tomE({f,a:.02,d:2.2,v:.13,type:'triangle',lp:900,rev:.5}); tomE({f,a:.02,d:2.2,v:.07,type:'sawtooth',lp:700,lpTo:180,rev:.4,det:7});
      sinoE({t:.05,f:f*4,d:1.8,v:.04,ratio:2,idx:.6,rev:.7,dly:.25});
      if(l===14) for(let i=0;i<9;i++) sinoE({t:.1+i*.05,f:notaE(2,i),d:.6,v:.024,ratio:2,idx:.5,pan:-.7+i*.17,rev:.5});
    } else if(l===16){   // Sol: um acorde quente que cresce
      [0,4,7,11,14].forEach((s,i)=>tomE({f:146.83*Math.pow(2,s/12),a:.35,d:2.6,v:.05,type:'triangle',lp:2200,rev:.6,pan:-.4+i*.2}));
      sinoE({t:.3,f:1174.7,d:2,v:.05,ratio:2,idx:.8,rev:.7,dly:.3});
    } else if(l===17){   // Supernova: estrondo e um rastro de faíscas
      tomE({f:90,to:28,d:1.4,v:.26}); ruidoE({f:1400,to:120,d:1.2,v:.2,type:'lowpass',rev:.4});
      for(let i=0;i<14;i++) sinoE({t:.15+i*.06+Math.random()*.04,f:notaE(2,(Math.random()*10)|0),d:.9,v:.03,ratio:2,idx:.7,pan:Math.random()*1.6-.8,rev:.6});
    } else {   // Galáxia: um coro enorme que gira
      [0,7,12,16,19,24].forEach((s,i)=>tomE({f:73.42*Math.pow(2,s/12),a:.8,d:4,v:.045,type:'sawtooth',lp:1400,rev:.7,pan:Math.sin(i)*.7,det:i%2?6:-6}));
      for(let i=0;i<16;i++) sinoE({t:.5+i*.09,f:notaE(1,i),d:1,v:.022,ratio:2,idx:.5,pan:Math.sin(i*.9)*.8,rev:.6});
    } },
  poucos(){ [0,.34].forEach((t,i)=>tomE({t,f:1318.5,d:.55,v:i?.025:.055,rev:.35})); },   // bipe de sonar
  racha(){ ruidoE({f:3200,d:.05,v:.1,type:'highpass'}); sinoE({f:520,ratio:3.73,idx:3,d:.32,v:.06}); tomE({f:150,to:60,d:.1,v:.09}); ruidoE({t:.03,f:800,d:.14,v:.05,q:3}); },
  nebulosa(){ ruidoE({f:2600,to:300,a:.05,d:.75,v:.06,q:.8,rev:.5}); sinoE({t:.1,f:notaE(2,4),d:.6,v:.02,ratio:2,idx:.4,rev:.6}); },
  estrelas(n){ for(let i=0;i<n;i++) sinoE({t:.25+i*.28,f:notaE(2,i*2),d:.9,v:.05,ratio:2,idx:.8,rev:.5,pan:-.3+i*.3}); },
  vitoria(){ for(let i=0;i<8;i++) sinoE({t:i*.075,f:notaE(1,i),d:.7,v:.045,ratio:2,idx:.7,rev:.45,pan:-.5+i*.14});
    [0,4,7,11,14].forEach((s,i)=>tomE({t:.6,f:293.66*Math.pow(2,s/12),a:.08,d:1.8,v:.04,type:'triangle',lp:3000,rev:.6,pan:-.4+i*.2}));
    ruidoE({t:.6,f:5000,to:9000,a:.2,d:1.2,v:.02,type:'highpass',rev:.6}); },
  derrota(){ tomE({f:392,to:98,a:.05,d:1.4,v:.08,type:'triangle',lp:1800,lpTo:200,rev:.4}); tomE({t:.15,f:294,to:73,a:.05,d:1.4,v:.06,type:'triangle',lp:1500,lpTo:150,rev:.4});
    ruidoE({f:700,to:90,d:1.2,v:.03,type:'lowpass'}); },
  botao(){ tomE({f:1100,to:1500,d:.045,v:.04}); },
};
// no espaço (fases da Jornada e Clássico) os sons de sempre viram os do espaço; a mina segue com os dela
const somEsp = () => typeof espacoLigado==='function' && espacoLigado() && typeof S!=='undefined' && !!S && !!(S.missao||S.infinito);
for(const [k,e] of [['arrastar','arrastar'],['fundir','fundir'],['pagou','vitoria'],['naoDeu','derrota']]){ const velho=SFX[k]; SFX[k]=(...a)=>somEsp()?SONS_ESP[e](...a):velho(...a); }
for(const k of ['nasce','poucos','racha','nebulosa','estrelas']) SFX[k]=(...a)=>{ if(somEsp()) SONS_ESP[k](...a); };
SFX.botao=()=>{ if(typeof espTela==='function' && espTela()) SONS_ESP.botao(); };

// ===================== UI =====================
function showOverlay(html){ FORA=null; $('#panel').innerHTML=enrich(html); $('#overlay').classList.remove('hidden'); $('#panel').scrollTop=0; }
// tocar fora da janela fecha a janela, nas que têm um jeito de voltar (pausa, opções, como jogar, informação da fase).
// Quem abre a janela diz o que fazer em FORA; resultados e escolhas sem volta deixam FORA vazio.
// Só vale se o dedo desceu e subiu fora da janela (rolar a janela e soltar fora não fecha).
var FORA=null, desceuFora=false;   // var: showOverlay pode ser chamado antes desta linha rodar
$('#overlay').addEventListener('pointerdown', e=>{ desceuFora = e.target.id==='overlay'; });
// no espaço, os botões das telas fazem um bipe curto
addEventListener('click', e=>{ if(e.target.closest && e.target.closest('.btn,.icon,.mNo')) SFX.botao(); }, true);
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay' && desceuFora && FORA){ const f=FORA; FORA=null; f(); } desceuFora=false; });
function hideOverlay(){ $('#overlay').classList.add('hidden'); $('#panel').innerHTML=''; }

// ===================== ENTRADA =====================
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{ const k=KEYS[e.key.length===1?e.key.toLowerCase():e.key]; if(k){ e.preventDefault(); move(...k); } });
// Arrastar com prévia: as pedrinhas seguem o dedo até onde iriam; só confirma ao soltar.
// Dá para ir e voltar, testar outras direções e desistir (soltando perto do começo).
let touch=null, prev=null;
const PV_MIN=10, CONFIRMA=22;
const cellPx = () => board.querySelector('.slot')?.getBoundingClientRect().width || 80;
function clearPreview(voltar){
  document.querySelectorAll('.tile.willmerge').forEach(el=>{ el.classList.remove('willmerge'); el.firstChild.style.transform=''; });
  if(S && S.tiles) for(const t of S.tiles){ const el=els.get(t.id); if(!el) continue; el.style.transition=''; if(voltar) el.style.transform=pos(t.x,t.y); }
  prev=null;
}
function previewDrag(dx,dy){
  const d=Math.max(Math.abs(dx),Math.abs(dy)), cel=touch?.cel||cellPx();
  if(d<PV_MIN){ if(prev) clearPreview(true); return; }
  const dir = Math.abs(dx)>Math.abs(dy) ? [Math.sign(dx),0] : [0,Math.sign(dy)], key=dir.join();
  if(!prev || prev.key!==key){
    if(prev) clearPreview(true);
    const r=slide(S.tiles,dir[0],dir[1]), tgt={};
    for(const t of r.tiles) tgt[t.id]=[t.x,t.y];
    for(const g of r.gone) tgt[g.id]=[g.x,g.y];
    prev={key, dir, r, tgt};
    for(const o of r.merges) els.get(o.id)?.classList.add('willmerge');
    for(const g of r.gone) els.get(g.id)?.classList.add('willmerge');
  }
  let p=Math.min(1,(d-PV_MIN)/(cel*.9));
  for(const t of S.tiles){
    const el=els.get(t.id); if(!el) continue;
    const [tx,ty]=prev.tgt[t.id]||[t.x,t.y];
    // direção que não mexe nada: só uma resistência leve
    const ox = prev.r.moved ? (tx-t.x)*p : prev.dir[0]*p*.06, oy = prev.r.moved ? (ty-t.y)*p : prev.dir[1]*p*.06;
    el.style.transition='none';
    el.style.transform=`${pos(t.x,t.y)} translate(calc(${ox}*(var(--cell) + var(--gap))), calc(${oy}*(var(--cell) + var(--gap))))`;
  }
  // encosto: quanto mais arrasta, mais as duas se espicham na direção do arrasto
  const h=prev.dir[0]!==0;
  for(const o of [...prev.r.merges,...prev.r.gone]){ const f=els.get(o.id)?.firstChild; if(!f) continue;
    f.style.transformOrigin='50% 75%'; f.style.transform = h ? `scale(${1+.16*p},${1-.1*p})` : `scale(${1-.1*p},${1+.16*p})`; }
}
addEventListener('pointerdown',e=>{ if(overlayOpen()||e.target.closest('button')||!$('#scrGame').classList.contains('on')) return;
  if(document.body.classList.contains('rola') && !e.target.closest('#stage')) return; // fora do tabuleiro, o dedo rola a página
  touch={x:e.clientX,y:e.clientY,cel:cellPx(),hist:[[performance.now(),e.clientX,e.clientY]]}; prev=null; });
addEventListener('pointercancel',()=>{ if(touch){ touch=null; clearPreview(true); } });
addEventListener('pointermove',e=>{
  if(!touch || !S || S.phase!=='mine' || overlayOpen() || coachBlock || S.editando || S.ferrAtiva) return;
  const dx=e.clientX-touch.x, dy=e.clientY-touch.y, agora=performance.now(), hs=touch.hist;
  hs.push([agora,e.clientX,e.clientY]); while(hs.length>2 && agora-hs[0][0]>90) hs.shift();
  const vel=Math.hypot(e.clientX-hs[0][1],e.clientY-hs[0][2])/Math.max(1,agora-hs[0][0]);
  if(Math.max(Math.abs(dx),Math.abs(dy))>=Math.max(CONFIRMA+8,touch.cel*.38) && vel>=.55 && agora-hs[0][0]>=30){ touch=null; confirmaArrasto(dx,dy); return; }   // arrasto rápido: vale já
  previewDrag(dx,dy);
});
function confirmaArrasto(dx,dy){
  clearPreview(false);
  if(Math.abs(dx)>Math.abs(dy)) move(Math.sign(dx),0); else move(0,Math.sign(dy));
  if(S && S.phase==='mine') for(const t of S.tiles){ const el=els.get(t.id); if(el) el.style.transform=pos(t.x,t.y); }
}
addEventListener('pointerup',e=>{
  if(!touch) return; const dx=e.clientX-touch.x, dy=e.clientY-touch.y; touch=null;
  const tinha=!!prev;
  if(S && S.ferrAtiva && S.phase==='mine'){ usarFerramenta(e.clientX,e.clientY); return; }
  if(S && S.editando && S.phase==='mine'){ if(PINCEL.tipo==='mureta'){ labMureta(e.clientX,e.clientY); return; } const c=labCelula(e.clientX,e.clientY); if(c) labPinta(...c); return; }
  if(Math.max(Math.abs(dx),Math.abs(dy))<CONFIRMA){
    clearPreview(true);
    // toque (sem arrastar) numa pedrinha: mostra o que ela é e o que pode cuspir
    const el=!tinha && e.target.closest && e.target.closest('.tile');
    // na Jornada e no Clássico tocar na peça não abre mais a ficha dela (só na Mineração e no Laboratório)
    if(el && S && S.phase==='mine' && !S.missao && !S.infinito){ const t=S.tiles.find(x=>x.id===el.dataset.id); if(t) tileInfo(t); }
    return;
  }
  confirmaArrasto(dx,dy);
});
addEventListener('pointercancel',()=>{ if(touch){ touch=null; clearPreview(true); } });
// Encerrar exige dois toques enquanto ainda há energia (evita toque sem querer)
let endArmed=null;
function resetEnd(){ clearTimeout(endArmed); endArmed=null; $('#btnEnd').textContent=S&&(S.missao||S.infinito)?'Recomeçar':S&&S.semEnergia?'Parar aqui':'Encerrar o dia'; $('#btnEnd').classList.remove('g'); }
$('#btnEnd').onclick=()=>{
  if(coachBlock) return;
  if(S && S.infinito){ if(S.phase==='mine') infinitoJoga(); return; }
  if(S && S.missao){ if(S.phase==='mine') missaoJoga(S.missao); return; }
  if(S.energy<=0 || endArmed){ resetEnd(); endDay(); return; }
  $('#btnEnd').textContent=S.semEnergia?'Confirmar?':`Confirmar? (sobra ${S.energy}⚡)`;
  $('#btnEnd').classList.add('g');
  endArmed=setTimeout(resetEnd,3000);
};
$('#btnSkip').onclick=()=>{ S.skip=true; };
$('#btnFast').onclick=()=>{ S.turbo=true; $('#btnFast').style.display='none'; };
$('#btnSell').onclick=sell;
$('#btnEdit').onclick=()=>labEditar(!S.editando);
$('#btnAssovio').onclick=assoviar;
$('#btnPause').onclick=pauseMenu;
document.querySelectorAll('.musBtn').forEach(b=>{ b.onclick=toggleMusic; b.style.opacity=music?1:.4; });
addEventListener('pointerdown',()=>{ if(AC&&AC.state==='suspended') AC.resume(); else if(!AC&&music){ ctxAudio(); trilha(musKey); } },{capture:true});
$('#mContinue').onclick=loadGame;
$('#mCred').onclick=credits;
$('#mLab').onclick=labPainel;
$('#mCla').onclick=missoesLista;
$('#mEd').onclick=editorLista;
$('#mCat').onclick=()=>catalogo(showMenu);
$('#mNew').onclick=newGameClick;
$('#mTut').onclick=()=>{
  if(localStorage.mina_save){
    showOverlay(`<h2>Fazer o tutorial?</h2><p>A partida salva será perdida.</p><button class="btn" id="btnYes">Fazer o tutorial</button><button class="btn dim" id="btnNo">Voltar</button>`);
    $('#btnYes').onclick=()=>{ hideOverlay(); localStorage.removeItem('mina_save'); startTutorial(); };
    $('#btnNo').onclick=hideOverlay;
  } else startTutorial();
};
// arte do menu e do treinador
$('#logo').innerHTML = [[1,58],[3,84],[5,120],[2,70]].map(([t,s])=>`<svg viewBox="0 0 100 100" style="width:${s}px;height:${s}px">${pedraInner(t)}</svg>`).join('');
$('#coachAv').innerHTML = svgOf(pedraInner(3,{face:['happy','big']}));

if(/[?&]lab\b/.test(location.search)) labPainel(); else showMenu();
</script>
