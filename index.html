<script>
// Atualiza sozinho: se o navegador abriu uma cópia antiga (o GitHub Pages guarda por 10 min),
// busca a versão nova, atualiza o cache e recarrega uma vez.
(async()=>{try{
  const u=location.pathname, k='upd:'+u;
  const [velho,novo]=await Promise.all([fetch(u,{cache:'force-cache'}).then(r=>r.text()), fetch(u,{cache:'reload'}).then(r=>r.text())]);
  if(velho!==novo && !sessionStorage[k]){ sessionStorage[k]=1; location.reload(); }
  else sessionStorage.removeItem(k);
}catch(e){}})();
</script>

const N = 4;
const CFG = {
  energy: 40,                 // arrastos com energia; depois disso só nasce torrão
  torraoCusto: 2,             // cada torrão no tabuleiro no fim do dia custa isso
  days: 5,
  guardaMax: 15,              // energia que sobra fica guardada para o próximo dia de mina (até isso)
  pedraChance: 0.10,
  // calibrada por simulação (bot de canto pegando itens úteis): ~60% da renda mediana até a semana 4,
  // depois a cota passa a crescer mais rápido que a renda e a partida aperta lá pela semana 6 ou 7
  quota: w => [100, 300, 1000, 3000, 7500, 14000, 22000, 32000][w-1] ?? Math.round(32000*Math.pow(1.4,w-8)/100)*100,
  maxNivel: 3,                // itens sobem até o nível 3 (pegar de novo = subir de nível)
};
// preços e custo do torrão crescem com o andar
const precoItem = (i,l) => Math.round(i.preco*(1+l)*Math.pow(3,S.week-1));
const custoTorrao = () => CFG.torraoCusto*S.week*(S.isFiscal&&S.fiscal.id==='rabugento'?2.5:1);
const pularItem = () => 5*Math.pow(3,S.week-1);
const CORO = [0,.05,.08,.1];
function lvDesc(id,L){
  const D = {
    peneira:  ['Cascalho nunca cospe nada: no mínimo, cobre.','Cascalho e Pedra cospem no mínimo cobre.','Cascalho e Pedra cospem no mínimo ferro.'],

    horaextra:[`+$${L} para cada arrasto feito depois de exausta.`],
    adubo:    [`Torrão encostado numa Rocha ou maior rende $${L} por andar em vez de custar.`],
    eco:      [`Pedrinha encostada numa parede cospe como se fosse ${L} ${L>1?'níveis':'nível'} maior.`],
    musgo:    [`+$${2*L} por andar para cada parede com pedrinha encostada.`],
    folego:   [`+${8*L} de energia em todo dia de mina.`],
    picareta: [`+${25*L}% de chance de nascer Pedra (nível 2).`],
    martelo:  [`Cada pedrinha sorteia ${1+L} vezes e cospe a melhor.`],
    cascalheira:[`+$${L} por andar para cada Cascalho no tabuleiro no fim do dia.`],
    pedreira: [`+$${2*L} por andar para cada Pedra no tabuleiro no fim do dia.`],
    rochedo:  [`Rocha e Rocha densa cospem ×${1+L}.`],
    regua:    [`Fileiras de pedrinhas iguais valem +×${String(.25*L).replace('.',',')} a mais cada.`],
  }[id];
  return D[Math.min(L,D.length)-1];
}
// cada semana é um andar mais fundo
const ANDARES = [
  {n:'Barro',     bd:'#e6d3b0', sl:'#dcc7a2'},
  {n:'Granito',   bd:'#dcd5c9', sl:'#cfc6b8'},
  {n:'Basalto',   bd:'#d3cad8', sl:'#c5bacb'},
  {n:'Quartzo',   bd:'#e6d1dc', sl:'#dabfcd'},
  {n:'Obsidiana', bd:'#cdd3dc', sl:'#bec6d1'},
];

  {n:'Torrão'},
  {n:'Cascalho'}, {n:'Pedra'}, {n:'Rocha'}, {n:'Rocha densa'}, {n:'Geodo'}, {n:'Cristalino'}, {n:'Geodo real'},
];
const ORES = [
  {n:'nada',     p:0},
  {n:'cobre',    p:1,  c:'#e07b3c'},

const DROPS = {1:[70,30],2:[40,45,15],3:[15,45,35,5],4:[0,25,45,25,5],5:[0,0,30,45,22,3],6:[0,0,0,40,45,15],7:[0,0,0,10,50,40],8:[0,0,0,0,40,60]};

// itens de equipamento: sem limite, cada um só uma vez
const ITEMS = [
  {id:'peneira',   em:'🧺', nome:'Peneira fina',      est:'miudinha', preco:20, desc:'Cascalho nunca cospe nada: no mínimo, cobre.'},
  {id:'vaquinha',  em:'🐮', nome:'Vaquinha',          est:'miudinha', preco:25, desc:'+$1 para cada pedrinha que cuspir alguma coisa.'},
  {id:'lupa',      em:'🔍', nome:'Lupa de joalheiro', est:'gigante',  preco:30, desc:'A maior pedrinha do dia cospe ×3.'},
  {id:'coroa',     em:'👑', nome:'Coroa',             est:'gigante',  preco:35, desc:'Cresce: +×0,5 no total do dia para cada Geodo ou maior que você formar com ela.'},
  {id:'horaextra', em:'⏰', nome:'Hora extra',        est:'exausta',  preco:20, desc:'+$1 para cada arrasto feito depois de exausta.'},
  {id:'adubo',     em:'🌱', nome:'Adubo',             est:'exausta',  preco:20, desc:'Torrão encostado numa Rocha ou maior rende $1 em vez de custar.'},
  {id:'eco',       em:'🔔', nome:'Eco',               est:'parede',   preco:25, desc:'Pedrinha encostada numa parede cospe como se fosse 1 nível maior.'},
  {id:'musgo',     em:'🍀', nome:'Musgo',             est:'parede',   preco:20, desc:'+$2 para cada parede com pedrinha encostada no fim do dia.'},
  {id:'folego',    em:'💨', nome:'Fôlego',            est:'básico',   preco:25, desc:'+8 de energia em todo dia de mina.'},
  {id:'picareta',  em:'⛏️', nome:'Picareta',          est:'básico',   preco:30, desc:'Nasce Pedra (nível 2) com bem mais frequência.'},

  {id:'cascalheira',em:'🪣', nome:'Cascalheira',      est:'pedras',   preco:20, desc:''},

// caminhos do mapa (from = a partir de qual semana aparece)
const PATHS = {
  comum:          {em:'⛏️', nome:'Veio comum',       desc:'Um dia normal de mina.', mine:true, from:1},
  rico:           {em:'💎', nome:'Veio rico',        desc:'Nasce muito mais Pedra, mas com 10 de energia a menos.', mine:true, energy:-10, pedra:.4, from:1},

};
const FISCAIS = [
  {id:'rabugento', em:'😤', nome:'Fiscal rabugento', desc:'Torrão custa $5 em vez de $2.'},
  {id:'miope',     em:'🧐', nome:'Fiscal míope',     desc:'Cascalho e Pedra cospem nada.'},

// ===================== DESENHO DAS PEDRINHAS (SVG) =====================
const TC = ['#7a5a3c','#e2cfa6','#d39b6a','#c0694a','#7d8aa0','#9a77c9','#5ec4d6','#e06a9a'];
const TD = ['#5e4329','#c9b48a','#b57f52','#9c5136','#5f6b80','#7a59a8','#3e9fb2','#b84a78'];
const INK = '#2e2219';
const MOOD = ['', ['sleep','sleep'], ['dot','o'], ['dot','smile'], ['proud','smile'], ['star','big'], ['star','big'], ['star','big']];
function eyes(cx,cy,mood,s=1,gap=11,lx=0,ly=0){
  const L=cx-gap*s+lx, R=cx+gap*s+lx; cy+=ly;

// ===================== DIA DE MINA =====================
function startDay(p){
  clearBoard();
  S.path=p; S.phase='mine'; S.tired=0; S.next=rollSpawn();
  const base = fiscalHoje('apressado') ? 25 : CFG.energy + (p.energy||0);
  S.energy = base + 8*lvl('folego') + S.saved + S.bonus;
  S.energyMax = S.energy; S.usedSaved = S.saved+S.bonus; S.saved=0; S.bonus=0;
  if(p.narrow){ for(let y=0;y<N;y++) S.walls.push({x:3,y}); for(let x=0;x<3;x++) S.walls.push({x,y:3}); }
  if(p.walls){ const cells=shuffle([...Array(16).keys()].map(i=>({x:i%4,y:i/4|0}))); S.walls.push(...cells.slice(0,p.walls)); }
  S.walls.forEach((w,i)=>w.id='w'+i);
  for(let i=0;i<(p.clods||0);i++) addTile(0);
  if(S.gift){ addTile(5); S.gift=false; }
  addTile(); addTile();
  $('#mineRow').style.display=''; $('#revealRow').style.display='none';
  $('#btnEnd').classList.remove('hot'); resetEnd();
  setBanner(`Andar ${S.week} · dia ${S.day}`, S.isFiscal ? `${S.fiscal.em} ${S.fiscal.nome}` : p.nome + (S.usedSaved?` (+${S.usedSaved} de energia guardada)`:''));
  render();
}

function rollSpawn(){ return Math.random() < CFG.pedraChance + .25*lvl('picareta') + (S.path?.pedra||0) ? 2 : 1; }
function emptyCells(){ const out=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(!tileAt(x,y) && !wallAt(x,y)) out.push({x,y}); return out; }
function addTile(t, dir){
  let free=emptyCells(); if(!free.length) return;
  if(dir && S.char==='passinho'){ const [dx,dy]=dir; const e=free.filter(c=>dx===1?c.x===0:dx===-1?c.x===N-1:dy===1?c.y===0:c.y===N-1); if(e.length) free=e; }
  const c=pick(free);
  if(t===undefined){
    if(S.energy<=0) t=0;                       // exausta: só torrão
    else { t=S.next; S.next=rollSpawn(); }
  }
  S.tiles.push({id:'t'+(nextId++), x:c.x, y:c.y, t});
}

// ===================== 2048 (com paredes) =====================
function slideOne(tiles,dx,dy){
  const ts=tiles.map(t=>({...t,m:false}));
  const grid=Array.from({length:N},()=>Array(N).fill(null));
  for(const w of S.walls) grid[w.y][w.x]={wall:true};
  for(const t of ts) grid[t.y][t.x]=t;
  const idx=[...Array(N).keys()];
  const xs=dx===1?[...idx].reverse():idx, ys=dy===1?[...idx].reverse():idx;
  let moved=false; const merges=[], gone=[];
  for(const y of ys) for(const x of xs){
    const t=grid[y][x]; if(!t||t.wall) continue;
    const nx=x+dx, ny=y+dy; if(!inside(nx,ny)) continue;
    const o=grid[ny][nx];
    if(!o){ grid[y][x]=null; grid[ny][nx]=t; t.x=nx; t.y=ny; moved=true; }
    else if(!o.wall && !o.m && o.t===t.t && t.t>0){ grid[y][x]=null; o.t++; o.m=true; t.x=nx; t.y=ny; gone.push(t); merges.push(o); moved=true; }
  }
  return {tiles:ts.filter(t=>!gone.includes(t)).map(({m,...t})=>t), moved, merges, gone};
}
function slide(tiles,dx,dy){
  if(S.char==='passinho') return slideOne(tiles,dx,dy);
  const ts=tiles.map(t=>({...t,m:false}));
  const grid=Array.from({length:N},()=>Array(N).fill(null));
  for(const w of S.walls) grid[w.y][w.x]={wall:true};
  for(const t of ts) grid[t.y][t.x]=t;
  const idx=[...Array(N).keys()];
  const xs=dx===1?[...idx].reverse():idx, ys=dy===1?[...idx].reverse():idx;
  let moved=false; const merges=[], gone=[];
  for(const y of ys) for(const x of xs){
    const t=grid[y][x]; if(!t||t.wall) continue;
    let cx=x, cy=y, merged=false;
    while(true){
      const nx=cx+dx, ny=cy+dy; if(!inside(nx,ny)) break;
      const o=grid[ny][nx];
      if(!o){ grid[cy][cx]=null; grid[ny][nx]=t; cx=nx; cy=ny; continue; }
      if(!o.wall && !o.m && o.t===t.t && t.t>0){ grid[cy][cx]=null; o.t++; o.m=true; t.x=nx; t.y=ny; gone.push(t); merges.push(o); merged=true; }
      break;
    }
    if(merged){ moved=true; continue; }
    if(cx!==x||cy!==y){ t.x=cx; t.y=cy; moved=true; }
  }
  return {tiles:ts.filter(t=>!gone.includes(t)).map(({m,...t})=>t), moved, merges, gone};
}
const anyMove = () => DIRS.some(([dx,dy])=>slide(S.tiles,dx,dy).moved);

function move(dx,dy){
  if(S.phase!=='mine' || overlayOpen()) return;
  const r=slide(S.tiles,dx,dy);
  if(!r.moved) return;
  for(const g of r.gone){ const el=els.get(g.id); els.delete(g.id); if(el){ el.style.zIndex=0; el.style.transform=pos(g.x,g.y); setTimeout(()=>el.remove(),120); } }
  S.tiles=r.tiles;
  const wasTired = S.energy<=0;
  if(S.energy>0) S.energy--; else S.tired++;
  addTile(undefined,[dx,dy]);
  render();
  SFX.arrastar();
  const tops=r.merges.map(o=>o.t).sort((a,b)=>b-a);
  if(tops.length){ SFX.fundir(tops[0]); if(tops.length>1) setTimeout(()=>SFX.fundir(tops[1]),45); }
  if(S.energy<=0) SFX.torraoCai(); else if(S.energy<=5) SFX.cansado();
  for(const o of r.merges) anim(o.id,'pop');
  if(has('coroa')){ const n=r.merges.filter(o=>o.t>=5).length; if(n){ const g=n*CORO[lvl('coroa')]; S.coroa+=g; renderItems(); fire('coroa','+×'+String(+g.toFixed(2)).replace('.',','),true); } }
  if(!wasTired && S.energy<=0){
    setBanner(null,`Exausta! Agora só vem torrão`);
    $('#btnEnd').classList.add('hot');
  } else if(tops.length && tops[0]>=4) setBanner(null,`${ROCKS[Math.min(tops[0],7)].n}!`);
  if(!anyMove()){ setBanner(null,'não cabe mais nada'); setTimeout(endDay,450); }
}

// ===================== FIM DO DIA: CUSPE + EQUIPAMENTO =====================
function roll(t){
  const once=()=>{ const tb=DROPS[Math.min(t,8)]; let r=Math.random()*100; for(let i=0;i<tb.length;i++){ if((r-=tb[i])<0) return i; } return 0; };
  let b=once(); for(let i=0;i<lvl('martelo');i++) b=Math.max(b,once()); return b;
}
function tag(t, text, cls){ const el=els.get(t.id); if(!el) return; const p=document.createElement('span'); p.className='price '+cls; p.textContent=text; el.appendChild(p); }
const adjWall = t => DIRS.some(([dx,dy])=>wallAt(t.x+dx,t.y+dy));
const adjBig = t => DIRS.some(([dx,dy])=>{ const o=tileAt(t.x+dx,t.y+dy); return o && o.t>=3; });
const fmtMult = m => '×'+(Math.round(m*100)/100).toString().replace('.',',');

// fileiras: 3 ou mais pedrinhas iguais seguidas numa linha ou coluna
function fileiras(){
  const out=[], T=(x,y)=>{ const t=tileAt(x,y); return t&&t.t>0?t:null; };
  for(const horiz of [true,false]) for(let a=0;a<N;a++){
    let run=[];
    for(let b=0;b<=N;b++){
      const t = b<N ? (horiz?T(b,a):T(a,b)) : null;
      if(t && run.length && run[0].t===t.t) run.push(t);
      else { if(run.length>=3) out.push(run); run = t?[t]:[]; }
    }
  }
  return out;
}
function showCalc(){
  const parts=[`<b>$${S.gain}</b>`];
  if(S.mult!==1) parts.push(fmtMult(S.mult).replace('×','× '));
  if(S.cost) parts.push(`<i>-$${S.cost}</i>`);
  $('#calc').innerHTML=parts.join(' ');
}

async function endDay(){
  if(S.phase!=='mine') return;
  S.phase='reveal'; S.skip=false; S.gain=0; S.cost=0; S.mult=1; S.shown=0; S.found=[]; S.clods=0;
  const sobra = Math.max(0,S.energy);
  S.saved = Math.min(CFG.guardaMax, sobra);
  $('#mineRow').style.display='none'; $('#revealRow').style.display='flex';
  $('#btnSkip').style.display=''; $('#btnSell').style.display='none';
  $('#dayTotal').textContent='$0'; $('#dayTotal').classList.remove('neg'); showCalc();
  setBanner(`Fim do dia ${S.day}`, S.saved ? `hora de cuspir! (${S.saved} de energia guardada)` : 'hora de cuspir!');
  render(); SFX.fimDia(); await sleep(700);

  const custo = custoTorrao();
  const maior = [...S.tiles].filter(t=>t.t>0).sort((a,b)=>b.t-a.t)[0];
  let cuspiram=0;
  const order=[...S.tiles].sort((a,b)=>a.t-b.t);
  for(const t of order){
    const face=els.get(t.id)?.firstChild; if(!face) continue;
    face.classList.remove('idle');
    if(t.t===0){
      face.classList.add('wob'); await sleep(200);
      face.classList.remove('wob'); face.classList.add('crumble'); SFX.esfarelar(); S.clods++;
      if(has('adubo') && adjBig(t)){ const v=lvl('adubo')*S.week; S.gain+=v; tag(t,'+$'+v,''); fire('adubo','+$'+v); }
      else { S.cost+=custo; tag(t,`-$${custo}`,'neg'); }
      showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost); await sleep(220);
      continue;
    }
    face.innerHTML=svgOf(pedraInner(t.t,{face:['squeeze','puff'],blushBig:true}));
    face.classList.add('wob');
    await sleep(t.t>=5?850:t.t>=3?420:240);
    face.classList.remove('wob');
    let nivel=t.t;
    if(has('eco') && adjWall(t)){ nivel+=lvl('eco'); fire('eco','+'+lvl('eco')+' nível'); }
    let o=roll(nivel);
    { const L=lvl('peneira'); if(L && (t.t===1 || (t.t===2&&L>=2))){ const min=L>=3?2:1; if(o<min){ o=min; fire('peneira',ORES[min].n+'!'); } } }
    if(fiscalHoje('miope') && t.t<=2) o=0;
    t.ore=o; S.found.push(o);
    const ore=ORES[o];
    let val=ore.p;
    if(has('rochedo') && (t.t===3||t.t===4) && val>0){ val*=1+lvl('rochedo'); fire('rochedo','×'+(1+lvl('rochedo')),true); }
    if(has('lupa') && t===maior && val>0){ val*=1+lvl('lupa'); fire('lupa','×'+(1+lvl('lupa')),true); }
    if(o>0) cuspiram++;
    const body=`<g transform="translate(36 66) scale(.72) translate(-50 -58)">${pedraInner(t.t,o?{face:['happy','open']}:{face:['dot','wavy'],sweat:true})}</g>`;
    const spat=`<g class="spat">${o?gemSvg(70,34,ore.c,1.25):clodSvg(70,36,1.15)}</g>`;
    face.innerHTML=svgOf(body+spat);
    SFX.cuspe();
    S.gain+=val; showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost);
    tag(t, o?`$${val}`:'nada', o?'':'zero');
    if(!S.skip){
      if(o>=1 && o<=2) SFX.comum(o);
      if(o>=3){
        shake(o-2); sparks(t, ore.c); popup(ore.n.toUpperCase()+'!', '+$'+val, ore.c); SFX.raro(o);
        await sleep(o>=4?1000:650);
      } else await sleep(160);
    }
  }
  // bônus do equipamento, um de cada vez
  const bonus = [];
  if(has('vaquinha') && cuspiram) bonus.push(['vaquinha', cuspiram*lvl('vaquinha')]);
  if(has('horaextra') && S.tired) bonus.push(['horaextra', S.tired*lvl('horaextra')]);
  if(has('musgo')){ const n=S.walls.filter(w=>DIRS.some(([dx,dy])=>{ const o=tileAt(w.x+dx,w.y+dy); return o && o.t>0; })).length; if(n) bonus.push(['musgo', 2*n*lvl('musgo')*S.week]); }
  if(has('cascalheira')){ const n=S.tiles.filter(t=>t.t===1).length; if(n) bonus.push(['cascalheira', n*lvl('cascalheira')*S.week]); }
  if(has('pedreira')){ const n=S.tiles.filter(t=>t.t===2).length; if(n) bonus.push(['pedreira', 2*n*lvl('pedreira')*S.week]); }
  for(const [id,v] of bonus){ await sleep(380); S.gain+=v; fire(id,'+$'+v); showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost); }
  // multiplicadores
  if(!fiscalHoje('paoduro')){
    for(const ln of fileiras()){
      await sleep(350);
      const g=(ln.length>=4?.5:.25)+.25*lvl('regua');
      S.mult+=g;
      ln.forEach(t=>els.get(t.id)?.classList.add('line'));
      popup(`Fileira de ${ROCKS[ln[0].t].n}!`, '+'+fmtMult(g), '#6aa84f');
      if(has('regua')) fire('regua','+'+fmtMult(.25*lvl('regua')),true);
      SFX.raro(3); showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost);
      await sleep(650);
    }
    const mults=[];
    if(S.path.narrow) mults.push([null,2]);
    if(has('coroa') && S.coroa) mults.push(['coroa', 1+S.coroa]);
    for(const [id,m] of mults){ await sleep(450); S.mult*=m; if(id) fire(id,fmtMult(m),true); else popup('×2','galeria estreita','#7a59a8'); SFX.raro(3); showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost); }
  }
  S.dayTotal = Math.round(S.gain*S.mult) - S.cost;
  S.skip=true; countTo(S.dayTotal); S.skip=false;
  setBanner(`Fim do dia ${S.day}`, S.dayTotal>0 ? `rendeu ${fmt(S.dayTotal)}` : S.dayTotal<0 ? 'a terra deu prejuízo...' : 'dia fraco...');
  $('#btnSkip').style.display='none'; $('#btnSell').style.display='';
  $('#btnSell').textContent = S.dayTotal>=0 ? `Vender ${fmt(S.dayTotal)}` : `Pagar a limpeza (${fmt(S.dayTotal)})`;
}
const fmt = v => (v<0?'-$':'$')+Math.abs(v);

function sell(){
  S.money=Math.max(0,S.money+S.dayTotal); render();
  if(S.dayTotal>0) SFX.venda(); else SFX.esfarelar();
  if(S.isFiscal) return weekEnd();
  itemPick(S.path.picks||3, nextDay, 'Escolha um item');
}

function itemCard(it, extra='', L=1){
  const up = L>1 ? ` <span class="est" style="background:#c48a1e">nível ${L}</span>` : '';
  return `<span class="em">${it.em}</span><div><b>${it.nome}</b><span>${lvDesc(it.id,L)}</span><span class="est" style="background:${EST_COR[it.est]}">${it.est}</span>${up}</div>${extra}`;
}
function itemPick(n, then, title){
  const pool = shuffle(ITEMS.filter(i=>lvl(i.id)<CFG.maxNivel)).slice(0,n);
  if(!pool.length){ return then(); }
  showOverlay(`<h2>${title}</h2><div class="cards">${pool.map(i=>`<button class="card" data-pick="${i.id}">${itemCard(i,'',lvl(i.id)+1)}</button>`).join('')}</div>
    <button class="btn dim" id="btnPass">Pular (+$${pularItem()})</button>`);
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ S.lv[b.dataset.pick]=lvl(b.dataset.pick)+1; SFX.comprar(); hideOverlay(); renderItems(); then(); });
  $('#btnPass').onclick=()=>{ S.money+=pularItem(); hideOverlay(); render(); then(); };
}
let shopStock=[];
function showMerchant(first=true){
  if(first) shopStock = shuffle(ITEMS.filter(i=>lvl(i.id)<CFG.maxNivel)).slice(0,4).map(i=>i.id);
  const stock = shopStock.filter(id=>lvl(id)<CFG.maxNivel).map(item);
  showOverlay(`<h2>Mercador</h2><p>Você tem <b style="color:#c48a1e">$${S.money}</b>. Cota da semana: <b style="color:#c0603f">$${CFG.quota(S.week)}</b>.</p>
    <div class="cards">${stock.map(i=>`<button class="card" data-buy="${i.id}" ${S.money<precoItem(i,lvl(i.id))?'disabled':''}>${itemCard(i,`<span class="pr">$${precoItem(i,lvl(i.id))}</span>`,lvl(i.id)+1)}</button>`).join('') || '<p>Acabou o estoque.</p>'}</div>
    <button class="btn b" id="btnLeave">Seguir viagem</button>`);
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{ const i=item(b.dataset.buy), pr=precoItem(i,lvl(i.id)); if(S.money<pr) return; S.money-=pr; S.lv[i.id]=lvl(i.id)+1; SFX.comprar(); render(); renderItems(); showMerchant(false); });
  $('#btnLeave').onclick=()=>{ hideOverlay(); nextDay(); };
}
function showItemInfo(id){
  if(S.phase==='reveal' || overlayOpen()) return;
  const i=item(id);
  showOverlay(`<div class="cards"><div class="card" style="cursor:default">${itemCard(i,'',lvl(id))}</div></div>${id==='coroa'?`<p>Agora: ${fmtMult(1+S.coroa)}</p>`:''}<button class="btn b" id="btnOk">Ok</button>`);
  $('#btnOk').onclick=hideOverlay;
}
function fire(id, text, isMult){
  const c=document.querySelector(`.chip[data-item="${id}"]`); if(!c) return;
  c.classList.remove('fire'); void c.offsetWidth; c.classList.add('fire');
  const f=document.createElement('span'); f.className='chipfloat'+(isMult?' mult':''); f.textContent=text; c.appendChild(f); setTimeout(()=>f.remove(),1100);
  SFX.item(isMult);
}

// ===================== SEMANA =====================
function weekEnd(){
  const q=CFG.quota(S.week), paid=S.money>=q;
  if(paid){
    S.money-=q; SFX.pagou();
    showOverlay(`<h2 style="color:#6aa84f">Cota paga!</h2><p>Você pagou $${q} e sobrou $${S.money}.</p>
      <p>Prêmio: a próxima semana começa com um <b style="color:#7a59a8">Geodo</b>, e você escolhe um item extra.</p>
      <p>Próximo andar: <b>${ANDARES[S.week%ANDARES.length].n}</b> · cota <b style="color:#c0603f">$${CFG.quota(S.week+1)}</b></p>
      <button class="btn b" id="btnWeek">Descer</button>`);
    $('#btnWeek').onclick=()=>{ hideOverlay(); S.week++; S.gift=true; itemPick(4, startWeek, 'Item de presente'); };
  } else {
    SFX.naoDeu();
    showOverlay(`<h2 style="color:#c0603f">Não deu...</h2><p>Faltaram $${q-S.money} para a cota de $${q}.</p>
      <p>Você perde o dinheiro guardado e repete o andar ${S.week}. Os itens continuam com você.</p>
      <button class="btn b" id="btnWeek">Tentar de novo</button>`);
    S.money=0;
    $('#btnWeek').onclick=()=>{ hideOverlay(); startWeek(); };
  }
}

// ===================== TELA =====================
function lookOf(t){
  if(t.t===0) return [0,0];
  for(const [dx,dy] of DIRS) if(S.tiles.some(o=>o.x===t.x+dx&&o.y===t.y+dy&&o.t===t.t)) return [dx,dy];
  return [0,0];
}
function wallInner(){
  return `<rect x="6" y="6" width="88" height="88" rx="16" fill="#6b625a" stroke="${INK}" stroke-width="2.4"/>
    <rect x="12" y="10" width="76" height="12" rx="6" fill="#80776e"/>
    <path d="M6 44 h28 l8 10 h52 M52 6 v22 l-8 12 M28 94 v-22 l10 -10 M72 54 v40" stroke="#4e4740" stroke-width="2.6" fill="none" stroke-linejoin="round"/>`;
}
function renderItems(){
  $('#items').innerHTML = Object.keys(S.lv).map(id=>{ const i=item(id), L=lvl(id); const badge = id==='coroa'&&S.coroa ? fmtMult(1+S.coroa) : L>1 ? 'nv '+L : ''; return `<button class="chip" data-item="${id}" style="--ec:${EST_COR[i.est]}" title="${i.nome}">${i.em}${badge?`<span class="lv">${badge}</span>`:''}</button>`; }).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>showItemInfo(c.dataset.item));
}
function render(){
  for(const w of S.walls){
    if(!els.has(w.id)){ const el=document.createElement('div'); el.className='tile'; el.style.transform=pos(w.x,w.y); el.innerHTML=`<div class="face">${svgOf(wallInner())}</div>`; board.appendChild(el); els.set(w.id,el); }
  }
  for(const t of S.tiles){
    let el=els.get(t.id);
    if(!el){
      el=document.createElement('div'); el.className='tile';
      el.innerHTML='<div class="face idle spawn"></div>';
      el.style.transition='none'; el.style.transform=pos(t.x,t.y);
      board.appendChild(el); els.set(t.id,el);
      void el.offsetWidth; el.style.transition='';
      el.firstChild.addEventListener('animationend',e=>{ if(e.target===el.firstChild && e.animationName!=='crumble') el.firstChild.classList.remove(e.animationName); });
    }
    el.style.transform=pos(t.x,t.y);
    if(S.phase==='mine'){
      const look=lookOf(t), key=t.t+':'+look;
      if(el.dataset.key!==key){ el.dataset.key=key; el.firstChild.innerHTML=svgOf(t.t===0?torraoInner():pedraInner(t.t,{look})); }
    }
  }
  if(S.phase==='mine'){ const on=new Set(fileiras().flat().map(t=>t.id)); for(const t of S.tiles) els.get(t.id)?.classList.toggle('line',on.has(t.id)); }
  const q=CFG.quota(S.week);
  $('#hQuota').textContent='$'+q;
  $('#hQuotaDay').textContent=S.day===CFG.days?'cota hoje!':`cota em ${CFG.days-S.day+1} dias`;
  $('#hMoney').textContent='$'+S.money;
  $('#hEnergy').textContent=S.phase==='map' ? '·' : S.energy;
  $('#hEnergyMax').textContent=S.phase==='map' ? (S.saved+S.bonus?`+${S.saved+S.bonus} guardada`:'energia') : S.energy>0?`de ${S.energyMax}`:'exausta!';
  $('#enIc').classList.toggle('zero',S.phase==='mine'&&S.energy<=0);
  const nt=S.energy<=1?0:S.next;
  $('#nextMini').innerHTML=S.phase==='mine'?svgOf(nt===0?torraoInner():pedraInner(nt)):'';
  renderItems();
}

function setBanner(title,sub){ if(title!==null) $('#bTitle').textContent=title; $('#bSub').textContent=sub||''; }
function anim(id,name){ const el=els.get(id); if(!el) return; const f=el.firstChild; f.classList.remove(name); void f.offsetWidth; f.classList.add(name); }
function shake(level){ const c='shake'+Math.min(level,3); stage.classList.remove('shake1','shake2','shake3'); void stage.offsetWidth; stage.classList.add(c); }
function popup(big,small,cor){ const p=document.createElement('div'); p.className='popup'; p.style.setProperty('--pc',cor); p.innerHTML=`${big}<small>${small}</small>`; stage.appendChild(p); setTimeout(()=>p.remove(),1000); }
function sparks(t,cor){
  const cx=`calc(${t.x}*(var(--cell) + var(--gap)) + var(--gap) + var(--cell)*.7)`, cy=`calc(${t.y}*(var(--cell) + var(--gap)) + var(--gap) + var(--cell)*.35)`;
  for(let i=0;i<18;i++){
    const s=document.createElement('i'); s.className='spark'; s.style.background=cor; s.style.left=cx; s.style.top=cy;
    const a=Math.random()*6.28, d=40+Math.random()*90;
    s.animate([{transform:'translate(-4px,-4px)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(200deg)`,opacity:0}],{duration:700,easing:'cubic-bezier(.2,.8,.3,1)'});
    stage.appendChild(s); setTimeout(()=>s.remove(),700);
  }
}
let countTimer=null;
function countTo(v){
  const el=$('#dayTotal'); clearInterval(countTimer);
  el.classList.toggle('neg',v<0);
  let cur=S.shown??0; S.shown=v;
  if(S.skip){ el.textContent=fmt(v); return; }
  const dir=v>=cur?1:-1;
  countTimer=setInterval(()=>{ const step=Math.max(1,Math.ceil(Math.abs(v-cur)/6)); cur+=dir*step; if(dir>0?cur>=v:cur<=v){ cur=v; clearInterval(countTimer); } el.textContent=fmt(cur); },30);
}

// ===================== SOM =====================
// Estilo Threes: um som de arrasto e um som de fusão diferente para cada nível.
let AC=null, BUS=null, NB=null;
function ac(){
  if(!sound) return null;
  try{
    if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); BUS=AC.createGain(); BUS.gain.value=.9; BUS.connect(AC.destination); }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function env(g,T,a,v,d){ g.gain.setValueAtTime(.0001,T); g.gain.exponentialRampToValueAtTime(v,T+a); g.gain.exponentialRampToValueAtTime(.0001,T+a+d); }
function tone({f=440,to=null,type='sine',t=0,a=.005,d=.15,v=.2,lp=null}={}){
  const c=ac(); if(!c) return; const T=c.currentTime+t, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,T); if(to) o.frequency.exponentialRampToValueAtTime(to,T+a+d);
  env(g,T,a,v,d); let n=o; if(lp){ const fl=c.createBiquadFilter(); fl.frequency.value=lp; o.connect(fl); n=fl; }
  n.connect(g); g.connect(BUS); o.start(T); o.stop(T+a+d+.05);
}
function noise({t=0,a=.002,d=.1,v=.2,type='bandpass',f=1000,to=null,q=1}={}){
  const c=ac(); if(!c) return;
  if(!NB){ NB=c.createBuffer(1,c.sampleRate,c.sampleRate); const d0=NB.getChannelData(0); for(let i=0;i<d0.length;i++) d0[i]=Math.random()*2-1; }
  const T=c.currentTime+t, s=c.createBufferSource(), fl=c.createBiquadFilter(), g=c.createGain();
  s.buffer=NB; fl.type=type; fl.frequency.setValueAtTime(f,T); if(to) fl.frequency.exponentialRampToValueAtTime(to,T+a+d); fl.Q.value=q;
  env(g,T,a,v,d); s.connect(fl); fl.connect(g); g.connect(BUS); s.start(T,Math.random()*.5); s.stop(T+a+d+.05);
}
function bell({f=880,t=0,d=1,v=.1,ratio=3.5,idx=2}={}){
  const c=ac(); if(!c) return; const T=c.currentTime+t, o=c.createOscillator(), m=c.createOscillator(), mg=c.createGain(), g=c.createGain();
  o.frequency.value=f; m.frequency.value=f*ratio; mg.gain.setValueAtTime(f*idx,T); mg.gain.exponentialRampToValueAtTime(1,T+d);
  m.connect(mg); mg.connect(o.frequency); env(g,T,.003,v,d); o.connect(g); g.connect(BUS);
  o.start(T); m.start(T); o.stop(T+d+.1); m.stop(T+d+.1);
}
const ESCALA=[0,2,4,7,9,12,14,16,19];
const SFX = {
  arrastar(){ const f=900+Math.random()*400; noise({f,to:f*2,d:.07,v:.045,q:.9}); },
  fundir(l){
    const f=392*Math.pow(2,ESCALA[Math.min(l,9)-1]/12);
    tone({f,d:.22,v:.17}); tone({f:f*2,d:.1,v:.05,type:'triangle'}); tone({f:f*4,d:.035,v:.04});
    if(l>=3) tone({f:f*.5,d:.25,v:.08});
    if(l>=4) bell({f:f*2,t:.02,d:.7,v:.06,idx:1.6});
    if(l>=5) [1.25,1.5,2].forEach((m,i)=>bell({f:f*2*m,t:.08+i*.06,d:.5,v:.045,idx:1.2}));
    if(l>=6){ tone({f:f*.25,to:f*.5,a:.05,d:.5,v:.1}); [1,1.5,2,3].forEach((m,i)=>bell({f:f*4*m,t:.25+i*.05,d:.6,v:.03,idx:.8})); }
  },
  cansado(){ tone({f:70,to:50,d:.12,v:.28}); tone({f:65,to:45,t:.18,d:.14,v:.22}); },
  torraoCai(){ tone({f:110,to:60,t:.05,d:.12,v:.22}); noise({t:.05,f:400,d:.1,v:.08,type:'lowpass'}); },
  esfarelar(){ for(let i=0;i<6;i++) noise({t:Math.random()*.12,f:500+Math.random()*900,d:.05,v:.08,type:'lowpass'}); tone({f:90,to:50,d:.12,v:.12}); },
  fimDia(){ [1568,1319,1175,1047,880,784].forEach((f,i)=>bell({f,t:i*.14,d:.7,v:.06,ratio:5,idx:.8})); },
  cuspe(){ tone({f:300,to:900,d:.07,v:.14,type:'triangle'}); noise({f:2500,to:5000,d:.06,v:.06,q:2}); tone({f:520,to:180,t:.1,d:.06,v:.07}); },
  comum(o){ const b=o===1?988:1175; tone({f:b,t:.05,d:.06,v:.06,type:'square',lp:4000}); tone({f:b*1.335,t:.11,d:.18,v:.06,type:'square',lp:4000}); },
  raro(o){ const l=o-2, n=5+l*4; for(let i=0;i<n;i++) bell({f:1047*Math.pow(2,ESCALA[(n-i)%9]/12),t:.05+i*.055,d:.6,v:.05,idx:1.2}); tone({f:131*Math.pow(2,l/3),to:262*Math.pow(2,l/3),t:.05,d:.35,v:.1}); },
  venda(){ for(let i=0;i<10;i++){ const t=i*.06+Math.random()*.03; tone({f:1975+Math.random()*300,t,d:.05,v:.045,type:'square',lp:5000}); noise({t,f:7000,d:.03,v:.025,type:'highpass'}); } },
  comprar(){ tone({f:520,to:180,d:.06,v:.08}); bell({f:1568,t:.05,d:.5,v:.07,idx:1}); },
  pagou(){ [523,659,784,1047].forEach((f,i)=>tone({f,t:i*.09,d:.2,v:.07,type:'square',lp:3500})); [523,659,784].forEach(f=>tone({f,t:.4,d:.9,v:.05,type:'triangle'})); for(let i=0;i<8;i++) bell({f:2093*Math.pow(2,ESCALA[i%6]/12),t:.4+i*.05,d:.4,v:.035,idx:1}); },
  item(m){ if(m){ tone({f:330,to:660,d:.12,v:.1,type:'triangle'}); bell({f:1319,t:.06,d:.4,v:.06,idx:1}); } else { tone({f:880,to:1320,d:.06,v:.07,type:'triangle'}); } },
  naoDeu(){ [392,370,349,330].forEach((f,i)=>tone({f,to:i===3?260:null,t:i*.3,a:.02,d:i===3?.8:.26,v:.08,type:'sawtooth',lp:900})); },
};

// ===================== UI =====================
function showOverlay(html){ $('#panel').innerHTML=html; $('#overlay').classList.remove('hidden'); }
function hideOverlay(){ $('#overlay').classList.add('hidden'); }
function showHelp(){
  showOverlay(`<h2>A mina das pedrinhas</h2><ul>
    <li><b>De manhã</b> escolha por onde cavar. Cada caminho muda o dia.</li>
    <li><b>Arraste</b>: com o Rola, tudo desliza até bater; com o Passinho, tudo anda uma casa. Duas iguais viram uma maior. Paredes não se mexem.</li>
    <li><b>Fileira</b>: 3 ou 4 pedrinhas iguais seguidas numa linha ou coluna, no fim do dia, somam multiplicador (contorno verde).</li>
    <li>Cada arrasto gasta 1 de energia. <b>Exausta, só nasce torrão</b>: não junta com nada e custa $${CFG.torraoCusto} no fim do dia. Energia que sobra fica <b>guardada</b> para o próximo dia (até ${CFG.guardaMax}).</li>
    <li>No fim do dia cada pedrinha <b>cospe</b> o que tem dentro, e os seus <b>itens</b> somam e multiplicam.</li>
    <li>Depois de minerar você ganha <b>1 item de 3</b>. Sem limite de itens.</li>
    <li>No dia ${CFG.days}, o <b>fiscal</b> cobra a cota. Pagou: desce um andar e ganha item. Não pagou: perde o dinheiro e repete o andar.</li>
  </ul><button class="btn b" id="ok">Bora</button>`);
  $('#ok').onclick=()=>{ localStorage.mina_seen3=1; hideOverlay(); if(!S.char) chooseChar(); else if(S.phase==='map') morning(); };
}

// ===================== ENTRADA =====================
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{ const k=KEYS[e.key.length===1?e.key.toLowerCase():e.key]; if(k){ e.preventDefault(); move(...k); } });
let touch=null;
addEventListener('pointerdown',e=>{ if(overlayOpen()||e.target.closest('button')) return; touch={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup',e=>{
  if(!touch) return; const dx=e.clientX-touch.x, dy=e.clientY-touch.y; touch=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22) return;
  if(Math.abs(dx)>Math.abs(dy)) move(Math.sign(dx),0); else move(0,Math.sign(dy));
});
// Encerrar exige dois toques enquanto ainda há energia (evita toque sem querer)
let endArmed=null;
function resetEnd(){ clearTimeout(endArmed); endArmed=null; $('#btnEnd').textContent='Encerrar o dia'; $('#btnEnd').classList.remove('g'); }
$('#btnEnd').onclick=()=>{
  if(S.energy<=0 || endArmed){ resetEnd(); endDay(); return; }
  $('#btnEnd').textContent=`Confirmar? (sobra ${S.energy}⚡)`;
  $('#btnEnd').classList.add('g');
  endArmed=setTimeout(resetEnd,3000);
};
$('#btnSkip').onclick=()=>{ S.skip=true; };
$('#btnSell').onclick=sell;
$('#btnHelp').onclick=showHelp;
$('#btnSound').onclick=()=>{ sound=!sound; localStorage.mina_sound=sound?'1':'0'; $('#btnSound').style.opacity=sound?1:.4; };
$('#btnSound').style.opacity=sound?1:.4;

newGame();
if(!localStorage.mina_seen3) showHelp();
</script>
