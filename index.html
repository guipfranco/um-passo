<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f2a2a">
<title>Mina (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
<style>
:root{--cell:min(20vw,80px);--gap:min(2.4vw,10px);--ink:#0c1416}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#0f2a2a;color:#fff;font-family:'Jersey 10',monospace;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;overflow:hidden}
.swirl{position:fixed;inset:-50%;background:conic-gradient(from 0deg at 40% 45%,#123a36,#0d2424,#1b4a3e,#0b1f22,#123a36);animation:spin 40s linear infinite;z-index:0}
@keyframes spin{to{transform:rotate(360deg)}}
.crt{position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000022 2px 4px),radial-gradient(ellipse at center,#0000 55%,#00000080 100%)}
#app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 8px;min-height:100vh}
.wide{width:min(94vw,380px)}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.box{background:#1c2a2e;border-radius:8px;padding:4px;box-shadow:0 0 0 3px var(--ink),0 5px 0 var(--ink);text-align:center}
.box small{display:block;font-size:17px;letter-spacing:1px;color:#c9d6d6;line-height:1}
.box b{display:block;border-radius:6px;font-size:32px;line-height:1.05;font-weight:400;box-shadow:inset 0 -4px 0 #0004;transition:background .2s}
.box em{display:block;font-style:normal;font-size:15px;color:#9fbcbc;line-height:1.1}
.red b{background:#fe5f55}.gold b{background:#e0a92b}.blue b{background:#009dff}
.blue.low b{background:#fe5f55;animation:blink .8s infinite}
@keyframes blink{50%{filter:brightness(1.3)}}
.banner{font-size:28px;letter-spacing:2px;text-align:center;line-height:.95;text-shadow:3px 3px 0 var(--ink)}
.banner span{display:block;font-size:19px;color:#9fe0c8;letter-spacing:1px;min-height:19px}
.stage{position:relative}
#board{position:relative;width:calc(4*var(--cell) + 5*var(--gap));height:calc(4*var(--cell) + 5*var(--gap));background:#0c1416aa;border-radius:12px;box-shadow:0 0 0 3px var(--ink)}
.slot{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);border-radius:8px;background:#ffffff0a;box-shadow:inset 0 0 0 2px #ffffff12}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .11s ease-out}
.face{width:100%;height:100%;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:calc(var(--cell)*.2);box-shadow:0 0 0 3px var(--ink),0 6px 0 var(--ink);background:var(--rc);color:#fff;text-shadow:2px 2px 0 #0008;rotate:var(--rot,0deg)}
.face .pp{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;justify-content:center;max-width:80%}
.face .pp i{width:calc(var(--cell)*.09);height:calc(var(--cell)*.09);background:#fff;border-radius:2px;box-shadow:0 2px 0 #0006}
.face.ore{border-radius:50%;color:#1a1a1a;text-shadow:none;font-size:calc(var(--cell)*.27)}
.face.ore small{font-size:calc(var(--cell)*.2)}
.o0{background:#3c4648 !important;color:#8b9a9c !important;border-radius:8px !important}
.o1{background:radial-gradient(circle at 35% 30%,#ffb27a,#d4652a) !important}
.o2{background:radial-gradient(circle at 35% 30%,#f2f5f8,#98a2ac) !important}
.o3{background:radial-gradient(circle at 35% 30%,#fff,#c3ccd6) !important;box-shadow:0 0 0 3px var(--ink),0 6px 0 var(--ink),0 0 18px #fff8 !important}
.o4{background:radial-gradient(circle at 35% 30%,#fff3a8,#f0b21c) !important;box-shadow:0 0 0 3px var(--ink),0 6px 0 var(--ink),0 0 26px #ffcf3a !important}
.o5{background:radial-gradient(circle at 35% 30%,#effdff,#33c3ec) !important;box-shadow:0 0 0 3px var(--ink),0 6px 0 var(--ink),0 0 30px #6fe3ff !important}
.spawn{animation:spawn .16s ease-out}
@keyframes spawn{from{scale:0}to{scale:1}}
.pop{animation:pop .2s ease-out}
@keyframes pop{0%{scale:1}50%{scale:1.2}100%{scale:1}}
.wob{animation:wob .16s infinite}
@keyframes wob{0%{transform:rotate(-6deg) scale(1.06)}50%{transform:rotate(6deg) scale(1.1)}100%{transform:rotate(-6deg) scale(1.06)}}
.crack{animation:crack .3s ease-out}
@keyframes crack{0%{scale:1.35}100%{scale:1}}
.shake1{animation:sh1 .2s}.shake2{animation:sh2 .3s}.shake3{animation:sh3 .5s}
@keyframes sh1{25%{transform:translate(-3px,1px)}75%{transform:translate(3px,-1px)}}
@keyframes sh2{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes sh3{10%{transform:translate(-9px,4px) rotate(-1.5deg)}30%{transform:translate(9px,-4px) rotate(1.5deg)}50%{transform:translate(-7px,3px) rotate(-1deg)}70%{transform:translate(5px,-2px)}90%{transform:translate(-2px,1px)}}
.popup{position:absolute;left:50%;top:44%;z-index:5;pointer-events:none;text-align:center;white-space:nowrap;font-size:64px;line-height:.85;color:var(--pc,#ffcf3a);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);animation:popup 1s forwards}
.popup small{display:block;font-size:34px;color:#fff}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-50%) rotate(-7deg) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1.15)}30%,75%{opacity:1;transform:translate(-50%,-50%) rotate(-7deg) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) rotate(-7deg)}}
.spark{position:absolute;width:8px;height:8px;box-shadow:0 0 0 2px var(--ink);z-index:4;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.next{display:flex;align-items:center;gap:8px;font-size:20px;color:#c9d6d6}
.next .mini{width:44px;height:44px;border-radius:6px;background:var(--rc);box-shadow:0 0 0 3px var(--ink),0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:2px}
.next .mini i{width:5px;height:5px;background:#fff;border-radius:1px}
.total{display:flex;justify-content:space-between;align-items:center;background:#1c2a2e;border-radius:8px;padding:2px 14px;box-shadow:0 0 0 3px var(--ink),0 5px 0 var(--ink);font-size:24px}
.total b{font-size:44px;color:#ffcf3a;font-weight:400}
.btn{font:400 28px 'Jersey 10';letter-spacing:1px;border:0;border-radius:8px;padding:4px 20px;color:#fff;background:#fe5f55;box-shadow:0 0 0 3px var(--ink),0 6px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 3px var(--ink),0 3px 0 var(--ink)}
.btn.g{background:#e0a92b}.btn.b{background:#009dff}.btn.dim{background:#3c4648}
.btn:disabled{opacity:.4}
.icon{flex:none;font:400 22px 'Jersey 10';background:#1c2a2e;color:#c9d6d6;border:0;border-radius:6px;width:34px;height:34px;box-shadow:0 0 0 3px var(--ink)}
#overlay{position:fixed;inset:0;z-index:35;background:#06100fd8;display:flex;align-items:center;justify-content:center;padding:14px}
#overlay.hidden{display:none}
.panel{width:min(94vw,380px);max-height:92vh;overflow:auto;background:#1c2a2e;border-radius:10px;padding:14px;box-shadow:0 0 0 3px var(--ink),0 8px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.panel h2{font-weight:400;font-size:40px;text-align:center;line-height:.9;text-shadow:3px 3px 0 var(--ink)}
.panel p{font-size:21px;color:#c9d6d6;text-align:center;line-height:1.05}
.panel ul{font-size:20px;color:#c9d6d6;line-height:1.1;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.panel ul b{color:#fff;font-weight:400}
.item{display:flex;align-items:center;gap:10px;background:#0c1416;border-radius:8px;padding:8px 10px}
.item .tx{flex:1;font-size:18px;color:#9fbcbc;line-height:1}
.item .tx b{display:block;font-weight:400;font-size:24px;color:#fff}
.item .btn{font-size:24px;padding:2px 12px;white-space:nowrap}
.sum{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.sum span{font-size:19px;background:#0c1416;border-radius:6px;padding:2px 8px;color:#c9d6d6}
</style>
</head>
<body>
<div class="swirl"></div>
<div id="app">
  <div class="hud wide">
    <div class="box red"><small>COTA</small><b id="hQuota"></b><em id="hQuotaDay"></em></div>
    <div class="box gold"><small>DINHEIRO</small><b id="hMoney"></b><em>&nbsp;</em></div>
    <div class="box blue" id="hEnergyBox"><small>ENERGIA</small><b id="hEnergy"></b><em id="hEnergyMax"></em></div>
  </div>
  <div class="row wide"><button class="icon" id="btnHelp">?</button><div class="banner" style="flex:1"><div id="bTitle"></div><span id="bSub"></span></div><button class="icon" id="btnSound">♪</button></div>
  <div class="stage" id="stage"><div id="board"></div></div>
  <div class="row wide" id="mineRow">
    <div class="next">PRÓXIMA <div class="mini" id="nextMini"></div></div>
    <button class="btn" id="btnEnd">ENCERRAR DIA</button>
  </div>
  <div class="wide" id="revealRow" style="display:none;flex-direction:column;gap:12px">
    <div class="total"><span>TOTAL DO DIA</span><b id="dayTotal">$0</b></div>
    <div class="row"><button class="btn dim" id="btnSkip" style="flex:1">PULAR</button><button class="btn g" id="btnSell" style="flex:2;display:none">VENDER</button></div>
  </div>
</div>
<div class="crt"></div>
<div id="overlay" class="hidden"><div class="panel" id="panel"></div></div>

<script>
// ===================== CONFIG =====================
const N = 4;
const CFG = {
  energy: 40,                 // arrastos por dia
  days: 5,                    // dias por semana
  quota: w => [60, 110, 180, 270, 400][w-1] ?? Math.round(400*Math.pow(1.5,w-5)/10)*10,
  pedraChance: 0.10,          // chance base de nascer Pedra em vez de Cascalho
};
// rochas por nível (2048: dois iguais viram o próximo)
const ROCKS = [null,
  {n:'Cascalho',    c:'#5e5650'},
  {n:'Pedra',       c:'#6f8291'},
  {n:'Rocha',       c:'#9a7a58'},
  {n:'Rocha densa', c:'#56597a'},
  {n:'Geodo',       c:'#7a5aa0'},
  {n:'Cristalino',  c:'#2f8fb0'},
  {n:'Geodo real',  c:'#b0306a'},
];
const ORES = [
  {n:'nada',     p:0,  cls:'o0'},
  {n:'cobre',    p:1,  cls:'o1'},
  {n:'ferro',    p:3,  cls:'o2'},
  {n:'prata',    p:8,  cls:'o3', cor:'#ffffff'},
  {n:'ouro',     p:20, cls:'o4', cor:'#ffcf3a'},
  {n:'diamante', p:60, cls:'o5', cor:'#6fe3ff'},
];
// chance (%) de cada minério [nada, cobre, ferro, prata, ouro, diamante] por nível de rocha
const DROPS = {
  1:[70,30],
  2:[40,45,15],
  3:[15,45,35,5],
  4:[0,25,45,25,5],
  5:[0,0,30,45,22,3],
  6:[0,0,0,40,45,15],
  7:[0,0,0,10,50,40],
};
const SHOP = [
  {id:'folego',   nome:'Fôlego',   desc:'+5 de energia por dia, para sempre.', preco:l=>[25,40,60,90][l], max:4},
  {id:'picareta', nome:'Picareta', desc:'Nasce Pedra (nível 2) com mais frequência: +25% por nível.', preco:l=>[35,70][l], max:2},
  {id:'martelo',  nome:'Martelo',  desc:'Cada rocha sorteia o minério duas vezes e fica com o melhor.', preco:()=>60, max:1},
];

// ===================== ESTADO =====================
const $ = s => document.querySelector(s);
const board = $('#board'), stage = $('#stage');
const els = new Map();
let S, nextId = 1, sound = localStorage.mina_sound !== '0';
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const inside = (x,y) => x>=0 && y>=0 && x<N && y<N;
const pos = (x,y) => `translate(calc(${x}*(var(--cell) + var(--gap)) + var(--gap)), calc(${y}*(var(--cell) + var(--gap)) + var(--gap)))`;
const overlayOpen = () => !$('#overlay').classList.contains('hidden');
const maxEnergy = () => CFG.energy + 5*S.upg.folego;

for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const c=document.createElement('div'); c.className='slot'; c.style.transform=pos(x,y); board.appendChild(c); }

function newGame(){
  S = {week:1, day:1, money:0, upg:{folego:0, picareta:0, martelo:0}, gift:false};
  startDay();
}

function startDay(){
  for(const el of els.values()) el.remove(); els.clear();
  S.tiles = []; S.energy = maxEnergy(); S.phase = 'mine'; S.next = rollSpawn();
  if(S.gift){ addTile(5); S.gift=false; }
  addTile(); addTile();
  $('#mineRow').style.display=''; $('#revealRow').style.display='none';
  setBanner(`SEMANA ${S.week} · DIA ${S.day}/${CFG.days}`, S.day===1 ? 'funda as rochas antes de cansar' : '');
  render();
}

function rollSpawn(){ return Math.random() < CFG.pedraChance + 0.25*S.upg.picareta ? 2 : 1; }

function emptyCells(){
  const out=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(!S.tiles.some(t=>t.x===x&&t.y===y)) out.push({x,y});
  return out;
}
function addTile(t){
  const free = emptyCells(); if(!free.length) return;
  const c = pick(free);
  if(t===undefined){ t = S.next; S.next = rollSpawn(); }
  S.tiles.push({id:'t'+(nextId++), x:c.x, y:c.y, t, rot:(Math.random()-.5)*5});
}

// ===================== 2048 =====================
function slide(tiles,dx,dy){
  const ts = tiles.map(t=>({...t, m:false}));
  const grid = Array.from({length:N},()=>Array(N).fill(null));
  for(const t of ts) grid[t.y][t.x]=t;
  const idx=[...Array(N).keys()];
  const xs = dx===1 ? [...idx].reverse() : idx, ys = dy===1 ? [...idx].reverse() : idx;
  let moved=false; const merges=[], gone=[];
  for(const y of ys) for(const x of xs){
    const t=grid[y][x]; if(!t) continue;
    let cx=x, cy=y, merged=false;
    while(true){
      const nx=cx+dx, ny=cy+dy; if(!inside(nx,ny)) break;
      const o=grid[ny][nx];
      if(!o){ grid[cy][cx]=null; grid[ny][nx]=t; cx=nx; cy=ny; continue; }
      if(!o.m && o.t===t.t){ grid[cy][cx]=null; o.t++; o.m=true; t.x=nx; t.y=ny; gone.push(t); merges.push(o); merged=true; }
      break;
    }
    if(merged){ moved=true; continue; }
    if(cx!==x||cy!==y){ t.x=cx; t.y=cy; moved=true; }
  }
  return {tiles:ts.filter(t=>!gone.includes(t)).map(({m,...t})=>t), moved, merges, gone};
}
const anyMove = () => [[0,1],[0,-1],[1,0],[-1,0]].some(([dx,dy])=>slide(S.tiles,dx,dy).moved);

function move(dx,dy){
  if(S.phase!=='mine' || overlayOpen()) return;
  const r = slide(S.tiles,dx,dy);
  if(!r.moved) return;
  for(const g of r.gone){ const el=els.get(g.id); els.delete(g.id); if(el){ el.style.zIndex=0; el.style.transform=pos(g.x,g.y); setTimeout(()=>el.remove(),120); } }
  S.tiles = r.tiles; S.energy--;
  addTile();
  render();
  for(const o of r.merges){ anim(o.id,'pop'); beep(300+o.t*90,.06,'square',.05); }
  if(r.merges.some(o=>o.t>=4)) setBanner(null, `${ROCKS[Math.max(...r.merges.map(o=>o.t))].n}!`);
  if(S.energy<=0){ setBanner(null,'você está exausto'); return setTimeout(endDay,400); }
  if(!anyMove()){ setBanner(null,'sem espaço para cavar'); return setTimeout(endDay,400); }
}

// ===================== FIM DO DIA: REVELAÇÃO =====================
const sleep = ms => new Promise(r=>setTimeout(r, S.skip ? 0 : ms));
function roll(t){
  const once = () => { const tb=DROPS[Math.min(t,7)]; let r=Math.random()*100; for(let i=0;i<tb.length;i++){ if((r-=tb[i])<0) return i; } return 0; };
  return S.upg.martelo ? Math.max(once(),once()) : once();
}

async function endDay(){
  if(S.phase!=='mine') return;
  S.phase='reveal'; S.skip=false; S.dayTotal=0; S.found=[];
  $('#mineRow').style.display='none'; $('#revealRow').style.display='flex';
  $('#btnSkip').style.display=''; $('#btnSell').style.display='none';
  $('#dayTotal').textContent='$0';
  setBanner(`FIM DO DIA ${S.day}`, 'quebrando as rochas...');
  render();
  const order = [...S.tiles].sort((a,b)=>a.t-b.t);
  let i=0;
  for(const t of order){
    const face = els.get(t.id)?.firstChild; if(!face) continue;
    face.classList.add('wob');
    await sleep(t.t>=5 ? 900 : t.t>=3 ? 450 : 220);
    face.classList.remove('wob');
    const o = roll(t.t); t.ore=o; S.found.push(o);
    const ore = ORES[o];
    face.className = 'face ore crack ' + ore.cls;
    face.innerHTML = o ? `${ore.n}<small>$${ore.p}</small>` : 'nada';
    countTo(S.dayTotal += ore.p);
    if(!S.skip){
      beep(260*Math.pow(1.06,i), .07, 'triangle', .06);
      if(o>=3){
        shake(o-2); sparks(t, ore.cor);
        popup(ore.n.toUpperCase()+'!', '+$'+ore.p, ore.cor);
        chord(o);
        await sleep(o>=4 ? 1000 : 650);
      } else await sleep(140);
    }
    i++;
  }
  $('#dayTotal').textContent = '$'+S.dayTotal;
  setBanner(`FIM DO DIA ${S.day}`, S.dayTotal ? `rendeu $${S.dayTotal}` : 'dia fraco...');
  $('#btnSkip').style.display='none'; $('#btnSell').style.display='';
  $('#btnSell').textContent = `VENDER $${S.dayTotal}`;
}

function sell(){
  S.money += S.dayTotal; render();
  beep(880,.08,'square',.05); setTimeout(()=>beep(1320,.12,'square',.05),80);
  showShop();
}

// ===================== LOJA E SEMANA =====================
function showShop(){
  const counts = S.found.reduce((a,o)=>(a[o]=(a[o]||0)+1,a),{});
  const sum = Object.keys(counts).sort((a,b)=>b-a).map(o=>`<span>${counts[o]}× ${ORES[o].n}</span>`).join('');
  const lastDay = S.day===CFG.days;
  const html = `<h2>LOJA</h2>
    <div class="sum">${sum||'<span>nada hoje</span>'}</div>
    <p>Dinheiro: <b style="color:#ffcf3a">$${S.money}</b> · cota da semana: <b style="color:#fe5f55">$${CFG.quota(S.week)}</b></p>
    ${SHOP.map(it=>{const l=S.upg[it.id], max=l>=it.max, pr=max?0:it.preco(l);
      return `<div class="item"><div class="tx"><b>${it.nome}${l?` (nível ${l})`:''}</b>${it.desc}</div>
      <button class="btn g" data-buy="${it.id}" ${max||S.money<pr?'disabled':''}>${max?'MÁX':'$'+pr}</button></div>`;}).join('')}
    <button class="btn b" id="btnSleep">${lastDay?'FIM DA SEMANA':'DORMIR'}</button>`;
  showOverlay(html);
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const it=SHOP.find(x=>x.id===b.dataset.buy), pr=it.preco(S.upg[it.id]);
    if(S.money<pr) return;
    S.money-=pr; S.upg[it.id]++; beep(660,.08,'square',.05); render(); showShop();
  });
  $('#btnSleep').onclick = () => { hideOverlay(); if(lastDay) weekEnd(); else { S.day++; startDay(); } };
}

function weekEnd(){
  const q = CFG.quota(S.week), paid = S.money >= q;
  let html;
  if(paid){
    S.money -= q;
    html = `<h2 style="color:#9fe0c8">COTA PAGA!</h2><p>Você pagou $${q} e sobrou $${S.money}.</p>
      <p>Presente: a próxima semana começa com um <b style="color:#c79cff">Geodo</b> no tabuleiro.</p>
      <p>Cota da semana ${S.week+1}: <b style="color:#fe5f55">$${CFG.quota(S.week+1)}</b></p>`;
    S.week++; S.gift = true;
    chord(4);
  } else {
    html = `<h2 style="color:#fe5f55">NÃO DEU</h2><p>Faltaram $${q-S.money} para a cota de $${q}.</p>
      <p>Você perde o dinheiro guardado e repete a semana ${S.week}. Suas melhorias continuam.</p>`;
    S.money = 0;
    beep(200,.3,'sawtooth',.06);
  }
  S.day = 1;
  showOverlay(html + `<button class="btn b" id="btnWeek">COMEÇAR SEMANA ${S.week}</button>`);
  $('#btnWeek').onclick = () => { hideOverlay(); startDay(); };
}

// ===================== DESENHO =====================
function render(){
  for(const t of S.tiles){
    let el = els.get(t.id);
    if(!el){
      el=document.createElement('div'); el.className='tile';
      el.innerHTML='<div class="face spawn"></div>';
      el.style.transition='none'; el.style.transform=pos(t.x,t.y);
      board.appendChild(el); els.set(t.id,el);
      void el.offsetWidth; el.style.transition='';
      el.firstChild.addEventListener('animationend', e=>{ if(e.target===el.firstChild) el.firstChild.classList.remove(e.animationName); });
    }
    el.style.transform = pos(t.x,t.y);
    const f = el.firstChild;
    if(S.phase==='mine' || t.ore===undefined){
      f.style.setProperty('--rc', ROCKS[Math.min(t.t,7)].c);
      f.style.setProperty('--rot', t.rot+'deg');
      f.innerHTML = `${ROCKS[Math.min(t.t,7)].n}<span class="pp">${'<i></i>'.repeat(t.t)}</span>`;
    }
  }
  const q=CFG.quota(S.week);
  $('#hQuota').textContent = '$'+q;
  $('#hQuotaDay').textContent = S.day===CFG.days ? 'hoje!' : `em ${CFG.days-S.day+1} dias`;
  $('#hMoney').textContent = '$'+S.money;
  $('#hEnergy').textContent = S.energy;
  $('#hEnergyMax').textContent = 'de '+maxEnergy();
  $('#hEnergyBox').classList.toggle('low', S.phase==='mine' && S.energy<=5);
  const nx = ROCKS[S.next];
  $('#nextMini').style.setProperty('--rc', nx.c);
  $('#nextMini').innerHTML = '<i></i>'.repeat(S.next);
}

function setBanner(title, sub){ if(title!==null) $('#bTitle').textContent=title; $('#bSub').textContent=sub||''; }
function anim(id,name){ const el=els.get(id); if(!el) return; const f=el.firstChild; f.classList.remove(name); void f.offsetWidth; f.classList.add(name); }
function shake(level){ const c='shake'+Math.min(level,3); stage.classList.remove('shake1','shake2','shake3'); void stage.offsetWidth; stage.classList.add(c); }
function popup(big, small, cor){
  const p=document.createElement('div'); p.className='popup'; p.style.setProperty('--pc',cor);
  p.innerHTML=`${big}<small>${small}</small>`; stage.appendChild(p); setTimeout(()=>p.remove(),1000);
}
function sparks(t, cor){
  const cx = `calc(${t.x}*(var(--cell) + var(--gap)) + var(--gap) + var(--cell)/2)`, cy = `calc(${t.y}*(var(--cell) + var(--gap)) + var(--gap) + var(--cell)/2)`;
  for(let i=0;i<18;i++){
    const s=document.createElement('i'); s.className='spark'; s.style.background=cor; s.style.left=cx; s.style.top=cy;
    const a=Math.random()*6.28, d=40+Math.random()*90;
    s.animate([{transform:'translate(-4px,-4px)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(200deg)`,opacity:0}],{duration:700,easing:'cubic-bezier(.2,.8,.3,1)'});
    stage.appendChild(s); setTimeout(()=>s.remove(),700);
  }
}
let countTimer=null;
function countTo(v){
  const el=$('#dayTotal'); let cur=+el.textContent.slice(1)||0;
  clearInterval(countTimer);
  if(S.skip){ el.textContent='$'+v; return; }
  countTimer=setInterval(()=>{ cur+=Math.max(1,Math.ceil((v-cur)/6)); if(cur>=v){cur=v; clearInterval(countTimer);} el.textContent='$'+cur; },30);
}

// ===================== SOM =====================
let AC=null;
function beep(freq,dur,type='square',vol=.05){
  if(!sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function chord(level){ const base=[0,0,0,523,659,784][level]||523; [1,1.25,1.5,2].forEach((m,i)=>setTimeout(()=>beep(base*m,.18,'square',.05),i*70)); }

function hideOverlay(){ $('#overlay').classList.add('hidden'); }

    <li><b>Arraste</b>: as rochas deslizam até bater. Duas iguais se fundem numa rocha melhor (Cascalho, Pedra, Rocha, Rocha densa, Geodo...).</li>

    <li>No <b>fim do dia</b> as rochas quebram e revelam o minério. Rocha melhor tem mais chance de minério bom.</li>
    <li>Venda, compre melhorias e durma.</li>
    <li>No fim do dia ${CFG.days}, paga a <b>cota</b>. Pagou: ganha um Geodo. Não pagou: perde o dinheiro e repete a semana, mas mantém as melhorias.</li>
  </ul><button class="btn b" id="ok">BORA</button>`);
  $('#ok').onclick=()=>{ localStorage.mina_seen=1; hideOverlay(); };
}

// ===================== ENTRADA =====================
const KEYS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{ const k=KEYS[e.key.length===1?e.key.toLowerCase():e.key]; if(k){ e.preventDefault(); move(...k); } });
let touch=null;
addEventListener('pointerdown',e=>{ if(overlayOpen()||e.target.closest('button')) return; touch={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup',e=>{
  if(!touch) return; const dx=e.clientX-touch.x, dy=e.clientY-touch.y; touch=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<22) return;
  if(Math.abs(dx)>Math.abs(dy)) move(Math.sign(dx),0); else move(0,Math.sign(dy));
});
$('#btnEnd').onclick = endDay;
$('#btnSkip').onclick = () => { S.skip = true; };
$('#btnSell').onclick = sell;
$('#btnHelp').onclick = showHelp;
$('#btnSound').onclick = () => { sound=!sound; localStorage.mina_sound=sound?'1':'0'; $('#btnSound').style.opacity=sound?1:.4; };
$('#btnSound').style.opacity = sound?1:.4;

newGame();
if(!localStorage.mina_seen) showHelp();
</script>
