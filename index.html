<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#15121c">
<title>Um Passo (luta teste)</title>
<style>
:root{--n:3;--cell:min(calc(80vw / var(--n) - 2vw),104px);--gap:min(1.8vw,9px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#15121c;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#app{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 8px}
.panel{width:min(92vw,380px);background:#231e2e;border-radius:14px;padding:10px 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-weight:700}
.bar{position:relative;height:16px;background:#15121c;border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width .25s}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;font-weight:700}
#enemy .bar i{background:#e04848}
#me .bar i{background:#4fb36b}
#enemyPanel{position:relative}
#enemyPanel.hit{animation:hit .25s}
@keyframes hit{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#intent{font-size:14px;color:#ffb36b}
#intent.soon{color:#ff6b6b;font-weight:700}
.float{position:absolute;right:16px;top:4px;font-weight:900;font-size:26px;color:#ffd43b;pointer-events:none;animation:float .8s forwards;text-shadow:0 2px 0 #0008}
@keyframes float{to{transform:translateY(-30px);opacity:0}}
#board{position:relative;width:calc(var(--n)*var(--cell) + (var(--n) + 1)*var(--gap));height:calc(var(--n)*var(--cell) + (var(--n) + 1)*var(--gap));background:#1d1826;border-radius:16px;box-shadow:inset 0 0 0 2px #2e2740}
body.hurt #board{animation:hurtflash .35s}
@keyframes hurtflash{0%{box-shadow:inset 0 0 0 4px #ff4d6d,0 0 34px #ff4d6d90}100%{box-shadow:inset 0 0 0 2px #2e2740}}
.cell-bg{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);border-radius:12px;background:#28213a}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .12s ease-out}
.face{position:relative;width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cell)*var(--fs,.44));background:var(--c,#555);color:#fff;text-shadow:0 2px 0 #0004;box-shadow:0 4px 0 #0005}
.spawn{animation:spawn .16s ease-out}
@keyframes spawn{from{transform:scale(0)}to{transform:scale(1)}}
.pop{animation:pop .2s ease-out}
@keyframes pop{50%{transform:scale(1.2)}}
.bump{animation:bump .16s ease-out}
@keyframes bump{50%{transform:translate(calc(var(--dx)*8px),calc(var(--dy)*8px))}}
.die{animation:die .16s forwards}
@keyframes die{to{transform:scale(0);opacity:0}}
.mini{display:inline-flex;min-width:24px;height:24px;padding:0 4px;border-radius:6px;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;vertical-align:middle}
#deck{font-size:13px;opacity:.8}
#msg{min-height:22px;text-align:center;font-size:15px;opacity:.85}
.btns{display:flex;gap:8px;justify-content:center}
button{font:inherit;color:#eee;background:#2c2639;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
button:active{transform:scale(.97)}
#overlay{position:fixed;inset:0;background:#0b0910d0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#overlay.hidden{display:none}
.box{background:#231e2e;border-radius:16px;padding:18px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin:0 0 8px}
.box ul{padding-left:18px;line-height:1.45;font-size:14px}
.primary{background:#ffcf4a;color:#2a1f2f;font-weight:700;width:100%;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="panel" id="enemyPanel">
    <div class="row"><span class="name" id="ename"></span><span id="intent"></span></div>
    <div class="bar" id="enemy"><i></i><span></span></div>
  </div>
  <div id="board"></div>
  <div class="panel" id="mePanel">
    <div class="row"><span class="name">Você</span><span id="deck"></span></div>
    <div class="bar" id="me"><i></i><span></span></div>
  </div>
  <div id="msg"></div>
  <div class="btns">
    <button id="btnRules">? Regras</button>
    <button id="btnRestart">↻ Recomeçar</button>
  </div>
</div>
<div id="overlay" class="hidden"><div class="box" id="box"></div></div>

<script>
// ================== CONFIG ==================
const CFG = {
  N: 3,                                  // tamanho do tabuleiro
  playerHp: 20,
  deck: [2,2,2,2,2,2,4,4],               // baralho inicial: as peças que entram no tabuleiro
  enemy: {nome:'Gosma', hp:120, dano:3, cada:3}, // ataca 'dano' a cada 'cada' jogadas
  stuckClear: 2,                         // encurralado: apaga as N menores peças
};

const COLORS=['#3d5a80','#4a6fa5','#3fb8af','#4fb36b','#8fb84a','#d6ad32','#ed8a63','#e85d75','#c86cd8','#8a6ce0','#5b7be0','#2c9fc9'];
const color = v => COLORS[Math.min(Math.round(Math.log2(v))-1, COLORS.length-1)];

// ================== ESTADO ==================
const N = CFG.N;
document.documentElement.style.setProperty('--n', N);
const $ = s => document.querySelector(s);
const board = $('#board');
const els = new Map();
let S, nextId = 1;
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const inside = (x,y) => x>=0 && y>=0 && x<N && y<N;
const pos = (x,y) => `translate(calc(${x}*(var(--cell) + var(--gap)) + var(--gap)), calc(${y}*(var(--cell) + var(--gap)) + var(--gap)))`;
const overlayOpen = () => !$('#overlay').classList.contains('hidden');

for(let y=0;y<N;y++) for(let x=0;x<N;x++){
  const c=document.createElement('div'); c.className='cell-bg'; c.style.transform=pos(x,y); board.appendChild(c);
}

function newFight(){
  for(const el of els.values()) el.remove(); els.clear();
  const E = CFG.enemy;
  S = {tiles:[], hp:CFG.playerHp, ehp:E.hp, countdown:E.cada, draw:shuffle(CFG.deck), moves:0, dealt:0, over:false};
  addTile(); addTile();
  msg('Funda peças para atacar. Peça maior, golpe maior.');
  render();
}

// ---------- baralho ----------
function drawCard(){
  if(!S.draw.length) S.draw = shuffle(CFG.deck);   // acabou: embaralha de novo
  return S.draw.shift();
}
function peekCard(){ return S.draw.length ? S.draw[0] : null; }

function emptyCells(){
  const out=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(!S.tiles.some(t=>t.x===x&&t.y===y)) out.push({x,y});
  return out;
}
function addTile(){
  const free = emptyCells(); if(!free.length) return;
  const c = pick(free);
  S.tiles.push({id:'t'+(nextId++), x:c.x, y:c.y, v:drawCard()});
}

// ================== REGRA DO 2048 ==================
function slide(tiles,dx,dy){
  const ts = tiles.map(t=>({...t, m:false}));
  const grid = Array.from({length:N},()=>Array(N).fill(null));
  for(const t of ts) grid[t.y][t.x]=t;
  const idx = [...Array(N).keys()];
  const xs = dx===1 ? [...idx].reverse() : idx;
  const ys = dy===1 ? [...idx].reverse() : idx;
  let moved=false; const merges=[]; const gone=[];
  for(const y of ys) for(const x of xs){
    const t = grid[y][x]; if(!t) continue;
    let cx=x, cy=y, merged=false;
    while(true){
      const nx=cx+dx, ny=cy+dy;
      if(!inside(nx,ny)) break;
      const o = grid[ny][nx];
      if(!o){ grid[cy][cx]=null; grid[ny][nx]=t; cx=nx; cy=ny; continue; }
      if(!o.m && o.v===t.v){
        grid[cy][cx]=null; o.v*=2; o.m=true;
        t.x=nx; t.y=ny; gone.push(t); merges.push(o); merged=true;
      }
      break;
    }
    if(merged){ moved=true; continue; }
    if(cx!==x || cy!==y){ t.x=cx; t.y=cy; moved=true; }
  }
  return {tiles: ts.filter(t=>!gone.includes(t)), moved, merges, gone};
}
const anyMove = () => [[0,1],[0,-1],[1,0],[-1,0]].some(([dx,dy])=>slide(S.tiles,dx,dy).moved);

// ================== TURNO ==================
function move(dx,dy){
  if(S.over || overlayOpen()) return;
  const r = slide(S.tiles,dx,dy);
  if(!r.moved){ for(const t of S.tiles) anim(t.id,'bump',dx,dy); return; }

  for(const g of r.gone){ const el=els.get(g.id); els.delete(g.id); if(el){ el.style.zIndex=0; el.style.transform=pos(g.x,g.y); setTimeout(()=>el.remove(),130); } }
  S.tiles = r.tiles.map(({m,...t})=>t);
  S.moves++;

  // ataque: cada fusão causa dano igual ao valor da peça que nasceu
  const dmg = r.merges.reduce((a,o)=>a+o.v, 0);
  if(dmg) hitEnemy(dmg, r.merges.length);
  else msg('');

  addTile();
  render();
  for(const o of r.merges) anim(o.id,'pop');
  if(S.ehp<=0) return end(true);

  enemyTurn();
  if(S.hp<=0) return end(false);

  // encurralado: o inimigo ataca e as menores peças somem
  if(!anyMove()){
    hurt(CFG.enemy.dano, 'Encurralado! Você levou um golpe e perdeu as menores peças.');
    const low = [...S.tiles].sort((a,b)=>a.v-b.v).slice(0,CFG.stuckClear);
    for(const t of low){ const el=els.get(t.id); els.delete(t.id); if(el){ el.firstChild.classList.add('die'); setTimeout(()=>el.remove(),170); } }
    S.tiles = S.tiles.filter(t=>!low.includes(t));
    render();
    if(S.hp<=0) return end(false);
  }
}

function hitEnemy(dmg, n){
  S.ehp = Math.max(0, S.ehp-dmg); S.dealt += dmg;
  msg(n>1 ? `Combo de ${n} fusões: ${dmg} de dano!` : `${dmg} de dano!`);
  const p=$('#enemyPanel'); p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit');
  const f=document.createElement('div'); f.className='float'; f.textContent='-'+dmg; p.appendChild(f); setTimeout(()=>f.remove(),800);
}

function enemyTurn(){
  if(--S.countdown > 0) return;
  S.countdown = CFG.enemy.cada;
  hurt(CFG.enemy.dano, `${CFG.enemy.nome} te acertou: -${CFG.enemy.dano}.`);
}

function hurt(n, text){
  S.hp = Math.max(0, S.hp-n); msg(text);
  document.body.classList.remove('hurt'); void document.body.offsetWidth; document.body.classList.add('hurt');
  render();
}

function end(won){
  S.over = true;
  setTimeout(()=>{
    showOverlay(won
      ? `<h2>Venceu a ${CFG.enemy.nome}!</h2><p>Em ${S.moves} jogadas, com ${S.hp} de vida sobrando.</p><button class="primary" id="again">Lutar de novo</button>`
      : `<h2>Derrota</h2><p>A ${CFG.enemy.nome} ficou com ${S.ehp} de vida. Você causou ${S.dealt} de dano em ${S.moves} jogadas.</p><button class="primary" id="again">Tentar de novo</button>`);
    $('#again').onclick=()=>{ hideOverlay(); newFight(); };
  }, 400);
}

// ================== DESENHO ==================
function setBar(sel, v, max){ $(sel+' i').style.width = (100*v/max)+'%'; $(sel+' span').textContent = `${v} / ${max}`; }

function render(){
  for(const t of S.tiles){
    let el = els.get(t.id);
    if(!el){
      el = document.createElement('div'); el.className='tile';
      el.innerHTML = '<div class="face spawn"></div>';
      el.style.transition='none'; el.style.transform=pos(t.x,t.y);
      board.appendChild(el); els.set(t.id,el);
      void el.offsetWidth; el.style.transition='';
      el.firstChild.addEventListener('animationend', e=>{ if(e.target===el.firstChild && e.animationName!=='die') el.firstChild.classList.remove(e.animationName); });
    }
    el.style.transform = pos(t.x,t.y);
    el.style.zIndex = 1;
    const face = el.firstChild;
    face.textContent = t.v;
    face.style.setProperty('--fs', t.v>=1000 ? .27 : t.v>=100 ? .33 : .44);
    face.style.setProperty('--c', color(t.v));
  }
  const E=CFG.enemy;
  $('#ename').textContent = E.nome;
  setBar('#enemy', S.ehp, E.hp);
  setBar('#me', S.hp, CFG.playerHp);
  $('#intent').textContent = S.countdown===1 ? `⚔ ${E.dano} na próxima jogada!` : `⚔ ${E.dano} em ${S.countdown} jogadas`;
  $('#intent').classList.toggle('soon', S.countdown===1);
  const nx = peekCard();
  $('#deck').innerHTML = `Próxima: ${nx ? `<span class="mini" style="background:${color(nx)}">${nx}</span>` : 'embaralhando'} · baralho ${S.draw.length}/${CFG.deck.length}`;
}

function anim(id,name,dx=0,dy=0){
  const el = els.get(id); if(!el) return;
  const f = el.firstChild;
  f.style.setProperty('--dx',dx); f.style.setProperty('--dy',dy);
  f.classList.remove(name); void f.offsetWidth; f.classList.add(name);
}

function msg(t){ $('#msg').textContent = t; }
function showOverlay(html){ $('#box').innerHTML = html; $('#overlay').classList.remove('hidden'); }
function hideOverlay(){ $('#overlay').classList.add('hidden'); }

function showRules(){
  const counts = CFG.deck.reduce((a,v)=>(a[v]=(a[v]||0)+1,a),{});
  showOverlay(`<h2>Um Passo (luta teste)</h2>
  <ul>
    <li>Arraste: tudo desliza até bater. Dois iguais se fundem e dobram, como no 2048.</li>
    <li><b>Cada fusão é um ataque</b>: causa dano igual ao valor da peça que nasceu. Um 16 tira 16. Várias fusões no mesmo arrasto somam.</li>
    <li>As peças novas saem do seu <b>baralho</b> (${Object.entries(counts).map(([v,c])=>`${c}× ${v}`).join(', ')}). Quando acaba, ele é embaralhado de novo.</li>
    <li>O inimigo avisa quando vai atacar (⚔ em cima).</li>
    <li>Se nenhum arrasto for possível, você está <b>encurralado</b>: leva um golpe e perde as ${CFG.stuckClear} menores peças.</li>
  </ul>
  <button class="primary" id="ok">Bora</button>`);
  $('#ok').onclick=()=>{ localStorage.umpasso_seen4=1; hideOverlay(); };
}

// ================== ENTRADA ==================
const KEYS = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown', e=>{
  const k = KEYS[e.key.length===1 ? e.key.toLowerCase() : e.key];
  if(k){ e.preventDefault(); move(...k); }
});
let touch=null;
addEventListener('pointerdown', e=>{
  if(overlayOpen() || e.target.closest('button')) return;
  touch={x:e.clientX, y:e.clientY};
});
addEventListener('pointerup', e=>{
  if(!touch) return;
  const dx=e.clientX-touch.x, dy=e.clientY-touch.y; touch=null;
  if(Math.max(Math.abs(dx),Math.abs(dy)) < 22) return;
  if(Math.abs(dx)>Math.abs(dy)) move(Math.sign(dx),0); else move(0,Math.sign(dy));
});
$('#btnRules').onclick = showRules;
$('#btnRestart').onclick = newFight;

newFight();
if(!localStorage.umpasso_seen4) showRules();
</script>
</body>
</html>
