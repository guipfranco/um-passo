<script>
// Atualiza sozinho: se o navegador abriu uma cópia antiga (o GitHub Pages guarda por 10 min),
// busca a versão nova, atualiza o cache e recarrega uma vez.
// Aberto direto do disco (testes, calibragem) não precisa: e a recarga no meio de um teste o quebraria.
(async()=>{try{
  if(location.protocol==='file:') return;
  const u=location.pathname, k='upd:'+u;
  const [velho,novo]=await Promise.all([fetch(u,{cache:'force-cache'}).then(r=>r.text()), fetch(u,{cache:'reload'}).then(r=>r.text())]);
  if(velho!==novo && !sessionStorage[k]){ sessionStorage[k]=1; location.reload(); }
  else sessionStorage.removeItem(k);
}catch(e){}})();
</script>

function setupBoard(w,h=w){

// O tabuleiro fica do maior tamanho que deixa a tela do jogo inteira à vista. Se nem com a casa mínima couber
// (tabuleiro muito alto, ou o editor aberto em tela pequena), a página passa a rolar: arrasta-se fora do tabuleiro.
const CEL_MIN_JOGO=14, CEL_MIN_EDITOR=26;
const vaoDe = c => Math.max(2,Math.round(c*.11));
const ladoDe = (n,c) => n*c + (n+1)*vaoDe(c);
const fimDoJogo = () => $('#scrGame').getBoundingClientRect().bottom + scrollY + 12;
function encaixa(redimensiona=true){
  document.body.classList.remove('rola'); $('#stage').style.marginTop='';
  document.body.classList.toggle('editando', !!S?.editando && $('#scrGame').classList.contains('on'));
  if(!$('#scrGame').classList.contains('on')) return;
  if(redimensiona){
    const resto = fimDoJogo() - board.getBoundingClientRect().height;
    const largMax = Math.min(innerWidth,440)-20, altMax = innerHeight - resto - 2;
    const min = S?.editando ? CEL_MIN_EDITOR : CEL_MIN_JOGO;
    let c = 84;
    while(c>min && (ladoDe(W,c)>largMax || ladoDe(H,c)>altMax)) c--;
    while(c>10 && ladoDe(W,c)>largMax) c--;
    board.style.setProperty('--cell', c+'px'); board.style.setProperty('--gap', vaoDe(c)+'px');
  }
  // no espaço (Jornada e Clássico) o tabuleiro fica no meio do que sobra embaixo do HUD, sem o vazio no pé da tela
  if(document.body.classList.contains('espaco') && document.body.classList.contains('modoCla')){
    const sobra = innerHeight - fimDoJogo(); if(sobra>8) $('#stage').style.marginTop = Math.floor(sobra/2)+'px'; }
  document.body.classList.toggle('rola', fimDoJogo() > innerHeight+1);
  if(!$('#coach').classList.contains('hidden')) placeCoach();
  desenhaCenario();
}

// ===================== ÍCONES NO TEXTO =====================
// Todo texto que cita uma pedrinha, o torrão, um minério ou a parede ganha o desenho ao lado.
const icoSvg = inner => `<svg class="ico" viewBox="0 0 100 100">${inner}</svg>`;
const icoRock = t => icoSvg(t===0 ? torraoInner() : pedraInner(t));
const icoOre  = o => icoSvg(oreSvg(o,50,52,2.6));
let GLOSS=null, GLOSS_RE=null, GLOSS_T=null, GLOSS_M=null;   // GLOSS_T: palavra -> nível da pedrinha (para pintar o nome); GLOSS_M: mina ou espaço
function gloss(){
  const modo = espFig() ? 'e' : 'm';
  if(GLOSS && GLOSS_M===modo) return;
  GLOSS={}; GLOSS_T={}; GLOSS_M=modo;
  // no espaço os nomes são os dos corpos celestes; o ícone (o planeta) é gerado só quando aparece num texto
  if(modo==='e') ESP.LADDER.forEach((d,i)=>{ for(const w of [d.n, plural(d.n)]){ GLOSS[w]=''; GLOSS_T[w]=i+1; } });
  else ROCKS.forEach((r,t)=>{ if(t>0) for(const w of [r.n, plural(r.n)]){ GLOSS[w]=icoRock(t); GLOSS_T[w]=t; } });
  for(const w of ['torrão','torrões','Torrão','Torrões']){ GLOSS[w]=icoRock(0); GLOSS_T[w]=0; }
  ORES.forEach((o,i)=>{ if(i){ GLOSS[o.n]=icoOre(i); GLOSS[o.n[0].toUpperCase()+o.n.slice(1)]=icoOre(i); } });
  for(const w of ['parede','paredes','Parede','Paredes']) GLOSS[w]=icoSvg(wallInner());
  for(const w of ['mureta','muretas','Mureta','Muretas']) GLOSS[w]=icoSvg('<rect x="42" y="8" width="16" height="84" rx="8" fill="#6b625a" stroke="'+INK+'" stroke-width="3"/>');
  const keys=Object.keys(GLOSS).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  GLOSS_RE=new RegExp(`(^|[^A-Za-zÀ-ÿ])(${keys.join('|')})(?![A-Za-zÀ-ÿ])`,'g');
}
// nome sem ícone (para títulos que já mostram o desenho grande): um caractere invisível quebra a busca
const noIco = w => w[0]+'⁠'+w.slice(1);
function enrich(html){
  gloss();
  return String(html).split(/(<[^>]+>)/).map(p=>p.startsWith('<')?p:p.replace(GLOSS_RE,(m,pre,w)=>pre+(w in GLOSS_T ? nomePedra(w,GLOSS_T[w]) : GLOSS[w]+w))).join('');
}
// nome de pedrinha no texto: ícone + nome em negrito, na cor da pedrinha, com um rótulo suave atrás
function nomePedra(w,t){
  if(GLOSS_M==='e') return `<span class="nomeP" style="--c:${corNivel(t)};--f:${corNivel(t)}">${icoPlaneta(t)}<b>${noIco(w)}</b></span>`;
  return `<span class="nomeP" style="--c:${rd(t)};--f:${rc(t)}">${GLOSS[w]}<b>${noIco(w)}</b></span>`;
}

// o que cada pedrinha pode cuspir
function dropsHtml(t){

}
function pedraCard(t){

// ===================== MAPA DA SEMANA =====================
// 3 trilhas paralelas, 4 dias e o fiscal no topo. Cada lugar liga ao da mesma trilha no dia seguinte e,
// às vezes, ao da trilha vizinha: escolher um caminho importa, mas nem sempre é para sempre.
const LANES = 3;
const PESO = {caverna:2.6, comum:4, rico:2.2, galeria:2.2, corredor:2, estreita:1.6, desmoronamento:1.6, fogueira:1.3, avalanche:1.8, cores:1.8, salao:1.6};
const COR_NO = {comum:'#a0785a', rico:'#3e9fb2', galeria:'#6b625a', corredor:'#8a6a3a', estreita:'#7a59a8', desmoronamento:'#c0603f', fogueira:'#e0882a', fiscal:'#b8432f', entrada:'#5a4636', avalanche:'#8f5b34', cores:'#4f9a6a', salao:'#3e6f9f', caverna:'#6b5a8a'};
const giSvg = k => `<svg class="gi" viewBox="0 0 512 512">${(GI[k]||[]).map(d=>`<path d="${d}"/>`).join('')}</svg>`;
const disc = (k, cor, cls='disc') => `<span class="${cls}" style="--nc:${cor||COR_NO[k]||'#a0785a'}">${giSvg(k)}</span>`;
function gerarMapa(){
  const avail = Object.keys(PATHS).filter(k=>PATHS[k].from<=S.week && !PATHS[k].lab);
  const sorteia = evitar => {
    let ks = avail.filter(k=>!evitar.includes(k)); if(!ks.length) ks = avail;
    let r = Math.random()*ks.reduce((a,k)=>a+(PESO[k]||1),0);
    for(const k of ks){ if((r-=(PESO[k]||1))<0) return k; }
    return ks[0];
  };
  const tipos = [];
  for(let d=0; d<CFG.days-1; d++){ const row=[]; for(let l=0;l<LANES;l++) row.push(sorteia([...row, d?tipos[d-1][l]:null].filter(Boolean))); tipos.push(row); }
  const liga = [];
  for(let d=0; d<CFG.days-2; d++){
    const e = [...Array(LANES).keys()].map(l=>[l,l]);
    for(let l=0;l<LANES-1;l++) if(Math.random()<.38) e.push(Math.random()<.5?[l,l+1]:[l+1,l]);
    liga.push(e);
  }
  const forma = tipos.map(row=>row.map(k=>k==='caverna' ? pick(formasJogo()).id : null));
  return {tipos, liga, forma};
}

// ===================== DIA DE MINA =====================
function startDay(p, tutorial=false){
  clearBoard(); show('scrGame');
  S.path=p; S.phase='mine'; trilha(S.isFiscal?'fiscal':'mina'); S.tired=0; S.next=rollSpawn();
  const base = fiscalHoje('apressado') ? 25 : CFG.energy + (p.energy||0);
  const am = S.amanha||{}; S.amanha={}; S.pa = am.pa ? 3 : 0;
  S.semEnergia = !!p.semEnergia;
  const forma = p.forma || (p.caverna ? pick(formasJogo()) : null);
  S.forma = forma;
  setupBoard(forma ? fw(forma) : (p.w||p.n||4), forma ? fh(forma) : (p.h||p.n||4));
  if(S.semEnergia){ S.energy=999; S.energyMax=999; S.usedSaved=0; if(am.cafe) S.bonus+=10; }
  else {
    S.energy = tutorial ? 10 : base + 5*(S.up.folego||0) + S.saved + S.bonus + (am.cafe?10:0);
    S.energyMax = S.energy; S.usedSaved = tutorial ? 0 : S.saved+S.bonus; S.saved=0; S.bonus=0;
  }
  S.assovios = S.up.assovio||0; assovioBtn();
  $('#btnEdit').style.display = S.lab ? '' : 'none'; S.editando=false; $('#labTools').classList.add('hidden');
  humor();
  if(forma){
    forma.mapa.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch==='#') S.walls.push({x,y,v:true}); else if(ch==='B') S.walls.push({x,y});
      else if(ch==='L'||ch==='2'||ch==='3') S.walls.push({x,y,lixo:true,hp:ch==='L'?1:+ch}); }));   // lixo espacial: racha com junção ao lado
    S.edges = (forma.muretas||[]).map(([d,x,y])=>({d,x,y}));
  }
  if(p.walls){ const cells=shuffle([...Array(W*H).keys()].map(i=>({x:i%W,y:i/W|0})).filter(c=>!wallAt(c.x,c.y))); S.walls.push(...cells.slice(0,p.walls)); }
  if(p.lixos){ const cells=shuffle([...Array(W*H).keys()].map(i=>({x:i%W,y:i/W|0})).filter(c=>!wallAt(c.x,c.y))); S.walls.push(...cells.slice(0,p.lixos).map(c=>({...c,lixo:true,hp:1}))); }
  S.walls.forEach((w,i)=>w.id='w'+i);
  if(p.edges){
    const all=[]; for(let y=0;y<H;y++) for(let x=0;x<W-1;x++) all.push({d:'v',x,y}); for(let y=0;y<H-1;y++) for(let x=0;x<W;x++) all.push({d:'h',x,y});
    S.edges = [...S.edges, ...shuffle(all.filter(e=>!wallAt(e.x,e.y) && !(e.d==='v'?wallAt(e.x+1,e.y):wallAt(e.x,e.y+1)) && !edgeBetween(e.x,e.y,e.d==='v'?e.x+1:e.x,e.d==='v'?e.y:e.y+1))).slice(0,p.edges)];
  }
  S.edges.forEach((e,i)=>e.id='e'+i);
  if(tutorial){
    S.tiles.push({id:'t'+(nextId++),x:0,y:1,t:1},{id:'t'+(nextId++),x:3,y:1,t:1}); S.next=1;
  } else {
    for(let i=0;i<(p.clods||0);i++) addTile(0);
    if(S.gift){ addTile(5); S.gift=false; }
    if(am.sorte) addTile(3);
    if(forma?.pecas?.length){ for(const [x,y,t,cc,k] of forma.pecas){ if(tileAt(x,y)||wallAt(x,y)) continue; const tl={id:'t'+(nextId++),x,y,t}; if(cc!=null) tl.c=cc; if(k) tl.k=k; S.tiles.push(tl); } }
    else { addTile(); addTile(); }
  }
  $('#mineRow').style.display=''; $('#revealRow').style.display='none';
  $('#btnEnd').classList.remove('hot'); resetEnd();
  setBanner(`Andar ${S.week} · dia ${S.day}`, S.isFiscal ? S.fiscal.nome : p.nome + (forma?`: ${forma.nome}`:'') + (S.usedSaved?` (+${S.usedSaved}⚡)`:''));
  render(); encaixa();
  if(tutorial) coach('Arraste <b>para o lado</b> para juntar as iguais. ↔', null, null, '#board');
}

function rollSpawn(){ return Math.random() < CFG.pedraChance + .12*(S.up?.picareta||0) + (S.path?.pedra||0) ? 2 : 1; }
function emptyCells(){ const out=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(!tileAt(x,y) && !wallAt(x,y)) out.push({x,y}); return out; }
function addTile(t, dir){
  let free=emptyCells(); if(!free.length) return;
  if(dir && S.char==='passinho'){ const [dx,dy]=dir; const e=free.filter(c=>dx===1?c.x===0:dx===-1?c.x===W-1:dy===1?c.y===0:c.y===H-1); if(e.length) free=e; }
  const c=pick(free);
  if(t===undefined){
    if((S.energy<=0 && !S.missao) || (S.path?.torrao && Math.random()<S.path.torrao)) t=0;   // exausta (ou avalanche): torrão
    else { t=S.next; S.next=rollSpawn(); }
  }
  const tile={id:'t'+(nextId++), x:c.x, y:c.y, t};
  if(S.path?.picareta && t>0) tile.k = Math.random()<.5 ? 'p' : 'r';
  if(t>0 && tile.k!=='p' && Math.random() < (S.path?.rara ?? RARA)) tile.r=1;
  if(S.path?.cores && t>0) tile.c = Math.random()<.08 ? 2 : (Math.random()<.5 ? 0 : 1);
  S.tiles.push(tile);
}

// ===================== MOVIMENTO (2048 ou Threes, com paredes) =====================
function slideOne(tiles,dx,dy){
  const ts=tiles.map(t=>({...t,m:false}));
  const grid=Array.from({length:H},()=>Array(W).fill(null));
  for(const w of S.walls) grid[w.y][w.x]={wall:true};
  for(const t of ts) grid[t.y][t.x]=t;
  const ix=[...Array(W).keys()], iy=[...Array(H).keys()];
  const xs=dx===1?[...ix].reverse():ix, ys=dy===1?[...iy].reverse():iy;
  let moved=false; const merges=[], gone=[], breaks=[];
  for(const y of ys) for(const x of xs){
    const t=grid[y][x]; if(!t||t.wall||t.presa) continue;
    const nx=x+dx, ny=y+dy; if(!inside(nx,ny) || edgeBetween(x,y,nx,ny)) continue;
    const o=grid[ny][nx];
    if(!o){ grid[y][x]=null; grid[ny][nx]=t; t.x=nx; t.y=ny; moved=true; }
    else if(!o.wall && !o.m && o.t===t.t && t.t>0 && corOk(o,t)){
      grid[y][x]=null; t.x=nx; t.y=ny; moved=true;
      if(o.k && t.k && o.k!==t.k){ grid[ny][nx]=null; gone.push(t,o); breaks.push({x:nx,y:ny,t:o.t,r:o.r||t.r}); }
      else { o.t++; o.c=corJunta(o,t); if(t.r) o.r=1; o.m=true; if(o.presa){ o.presa=0; o.solta=1; } gone.push(t); merges.push(o); }
    }
  }
  return {tiles:ts.filter(t=>!gone.includes(t)).map(({m,...t})=>t), moved, merges, gone, breaks};
}
function slide(tiles,dx,dy){
  if(S.char==='passinho') return slideOne(tiles,dx,dy);
  const ts=tiles.map(t=>({...t,m:false}));
  const grid=Array.from({length:H},()=>Array(W).fill(null));
  for(const w of S.walls) grid[w.y][w.x]={wall:true};
  for(const t of ts) grid[t.y][t.x]=t;
  const ix=[...Array(W).keys()], iy=[...Array(H).keys()];
  const xs=dx===1?[...ix].reverse():ix, ys=dy===1?[...iy].reverse():iy;
  let moved=false; const merges=[], gone=[], breaks=[];
  for(const y of ys) for(const x of xs){
    const t=grid[y][x]; if(!t||t.wall||t.presa) continue;
    let cx=x, cy=y, merged=false;
    while(true){
      const nx=cx+dx, ny=cy+dy; if(!inside(nx,ny) || edgeBetween(cx,cy,nx,ny)) break;
      const o=grid[ny][nx];
      if(!o){ grid[cy][cx]=null; grid[ny][nx]=t; cx=nx; cy=ny; continue; }
      if(!o.wall && !o.m && o.t===t.t && t.t>0 && corOk(o,t)){
        grid[cy][cx]=null; t.x=nx; t.y=ny; merged=true;
        if(o.k && t.k && o.k!==t.k){ grid[ny][nx]=null; gone.push(t,o); breaks.push({x:nx,y:ny,t:o.t,r:o.r||t.r}); }
        else { o.t++; o.c=corJunta(o,t); if(t.r) o.r=1; o.m=true; if(o.presa){ o.presa=0; o.solta=1; } gone.push(t); merges.push(o); }
      }
      break;
    }
    if(merged){ moved=true; continue; }
    if(cx!==x||cy!==y){ t.x=cx; t.y=cy; moved=true; }
  }
  return {tiles:ts.filter(t=>!gone.includes(t)).map(({m,...t})=>t), moved, merges, gone, breaks};
}
const anyMove = () => DIRS.some(([dx,dy])=>slide(S.tiles,dx,dy).moved);

function move(dx,dy){
  if(!S || S.phase!=='mine' || overlayOpen() || coachBlock || S.editando || S.ferrAtiva || !$('#scrGame').classList.contains('on')) return;
  if(S.tut===1 && dy!==0){ coach('Para o <b>lado</b>! ↔', null, null, '#board'); return; }
  if(S.missao && !S.semEnergia && S.energy<=0) return; // acabaram os arrastos: a fase já vai terminar
  const r=slide(S.tiles,dx,dy);
  if(!r.moved) return;
  S.undoSnap = foto();
  for(const g of r.gone){ const el=els.get(g.id); els.delete(g.id); if(el){ el.style.zIndex=0; el.style.transform=pos(g.x,g.y); setTimeout(()=>el.remove(),120); } }
  for(const b of r.breaks) quebrar(b);
  S.tiles=r.tiles;
  if(S.missao||S.infinito){ contaMissao(r); const rc=recolheCarro(); if(rc){ const el=els.get(rc.id); els.delete(rc.id); if(el){ el.style.transform=pos(rc.x,rc.y); el.classList.add('recolhe'); setTimeout(()=>el.remove(),350); } } }
  const wasTired = S.energy<=0;
  S.moves=(S.moves||0)+1;
  if(!S.semEnergia){ if(S.energy>0) S.energy--; else S.tired++; }
  humor();
  for(let i=0;i<(S.path.spawns??1);i++) addTile(undefined,[dx,dy]);
  if((S.path.spawns??1)>0) SFX.nasce();
  render();
  if(espFig()) espJogada(dx,dy,r.merges);   // fundo e malha reagem ao arrasto
  if(S.missao||S.infinito) flutuaPontos(r);
  SFX.arrastar();
  const tops=r.merges.map(o=>o.t).sort((a,b)=>b-a);
  if(tops.length){ SFX.fundir(tops[0]); if(tops.length>1) setTimeout(()=>SFX.fundir(tops[1]),45); S.stats.maxT=Math.max(S.stats.maxT,tops[0]); }
  if(S.missao||S.infinito){ if(S.missao && !S.semEnergia && [5,3,1].includes(S.energy)) SFX.poucos(); }   // sonar quando sobram poucos arrastos
  else if(S.energy<=0) SFX.torraoCai(); else if(S.energy<=5) SFX.cansado();
  for(const o of r.merges) anim(o.id,'pop');
  if(has('coroa')){ const n=r.merges.filter(o=>o.t>=5).length; if(n){ const g=n*CORO[lvl('coroa')]; S.coroa+=g; renderItems(); fire('coroa','+×'+String(+g.toFixed(2)).replace('.',','),true); } }
  if(!wasTired && S.energy<=0 && !S.missao){
    setBanner(null,`Exausta! Só vem torrão`);
    $('#btnEnd').classList.add('hot');
  } else if(tops.length && tops[0]>=4) setBanner(null,`${rockName(tops[0])}!`);
  // tutorial
  if(S.tut===1 && tops.length){
    S.tut=2;
    const nova = els.get(r.merges[0].id);
    setTimeout(()=>coach('Juntou! Quanto <b>maior</b>, melhor o que ela guarda.', 'Entendi', ()=>{
      coach('Cada arrasto gasta <b>1 de energia</b>.', 'Bora', ()=>{
        S.tut=3; coach('Junte até a energia acabar!', null, null, pillOf('#hEnergy'));
      }, pillOf('#hEnergy'));
    }, nova), 350);
  } else if(S.tut===3 && S.energy<=0){
    S.tut=4; coach('Sem energia, só vem <b>torrão</b> 😠: toque para <b>encerrar o dia</b>.', null, null, '#btnEnd');
  }
  if(S.missao){ checaMissao(); return; }
  if(S.infinito){ checaInfinito(); return; }
  if(!anyMove()){ setBanner(null,'não cabe mais nada'); setTimeout(endDay,450); }
}

// picareta encontrou a rocha do mesmo nível: extrai o minério na hora
function quebrar(b){
  const o=roll(b.t, b.r), ore=ORES[o], val=Math.round(ore.p*(1+.15*(S.up.balanca||0))*bonusNivel(b.t));
  S.extra=(S.extra||0)+val;
  const el=document.createElement('div'); el.className='tile'; el.style.transform=pos(b.x,b.y); el.style.zIndex=5;
  el.innerHTML=`<div class="face"><svg viewBox="0 0 100 100"><g class="spat">${oreSvg(o,50,50,1.6)}</g></svg></div><span class="price ${o?'':'zero'}">${o?'$'+val:'nada'}</span>`;
  board.appendChild(el); setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity=0; setTimeout(()=>el.remove(),400); }, 750);
  SFX.cuspe(); if(o>=1&&o<=3) SFX.comum(o>=3?2:1); if(o>=4){ SFX.raro(Math.min(6,o-1)); sparks(b,ore.c); shake(Math.min(3,o-3)); }
  setBanner(null, `extraído hoje: $${S.extra}`);
}

// Assovio: nasce uma pedrinha sem arrastar (passa a vez)
function assovioBtn(){
  const b=$('#btnAssovio'); if(!b) return;
  b.style.display = S && S.phase==='mine' && (S.up.assovio||0)>0 ? '' : 'none';
  b.textContent = `Assovio (${S.assovios>90?'∞':S.assovios})`; b.disabled = !S.assovios;
}
function assoviar(){
  if(!S || S.phase!=='mine' || overlayOpen() || coachBlock || S.editando || !S.assovios || !emptyCells().length) return;
  S.undoSnap = foto();
  if(S.assovios<90) S.assovios--;
  S.moves=(S.moves||0)+1;
  if(!S.semEnergia){ if(S.energy>0) S.energy--; else S.tired++; }
  humor(); addTile(); render(); assovioBtn();
  tone({f:880,to:1320,d:.12,v:.08,type:'triangle'}); tone({f:1320,to:1760,t:.13,d:.14,v:.07,type:'triangle'});

// no laboratório, por combinação (fase, formato, energia, personagem e ajustes); no jogo, por caminho e formato.
const RECS = () => JSON.parse(localStorage.mina_recordes||'{}');
const chaveLab = () => 'lab|'+JSON.stringify({f:LAB.fase, e:LAB.energia, c:LAB.char, ...LAB.cfg, i:LAB.itens, u:LAB.ups});
function chaveJogo(k, forma){ return 'jogo|'+k+(forma?':'+forma:''); }
function chaveFase(){
  if(S.lab) return chaveLab();
  return chaveJogo(S.isFiscal ? 'fiscal' : (S.hist[S.day]||'?'), S.forma?.id);
}
function nomeLab(){
  const pre=presetDe(LAB.fase), g=LAB.cfg;
  const ajust = Object.keys(pre).some(k=>k!=='forma' && g[k]!==pre[k]) || g.ferr || (g.rara!=null && g.rara!==RARA);
  const nItens = Object.values(LAB.itens).filter(Boolean).length + Object.values(LAB.ups).filter(Boolean).length;
  const fm = g.forma ? acharForma(g.forma)?.nome : null;
  return `${PATHS[LAB.fase].nome}${fm?' · '+fm:''} · ${LAB.energia?'com':'sem'} energia · ${CHARS[LAB.char].nome}${ajust?' · ajustada':''}${nItens?` · ${nItens} itens`:''}`;
}
function nomeFase(){
  if(S.lab) return nomeLab();
  if(S.isFiscal) return 'Dia do fiscal';
  const k=S.hist[S.day]; return (PATHS[k]?.nome||k) + (S.forma?': '+S.forma.nome:'');
}
function recordeFim(){
  if(S.tut) return;
  if(S.missao) return;
  const k=chaveFase(), r=RECS(), ant=r[k];
  const novo = S.dayTotal>0 && (!ant || S.dayTotal>ant.total);
  if(novo){ r[k]={total:S.dayTotal, arrastos:S.moves||0, char:S.char, nome:nomeFase(), quando:Date.now()}; localStorage.mina_recordes=JSON.stringify(r); }
  $('#recLine').innerHTML = novo ? (ant ? `<b>Novo recorde!</b> antes: $${ant.total}` : '<b>Primeiro recorde desta fase!</b>') : ant ? `Recorde: $${ant.total}` : '';
  if(novo && ant){ popup('RECORDE!', '$'+S.dayTotal, '#f2b33d'); SFX.pagou(); }
}
const recTxt = e => e ? `Recorde: <b>$${e.total}</b> · ${e.arrastos} arrastos · ${CHARS[e.char]?.nome||''}` : 'Sem recorde ainda.';

// ===================== FERRAMENTAS =====================
const cp = a => a.map(o=>({...o}));
function foto(){ return {tiles:cp(S.tiles), walls:cp(S.walls), edges:cp(S.edges), energy:S.energy, tired:S.tired, moves:S.moves, extra:S.extra, coroa:S.coroa, assovios:S.assovios}; }
function redesenhaTudo(){ for(const el of els.values()) el.remove(); els.clear(); render(); }
function ferrBar(){
  const bar=$('#ferrBar'); if(!bar) return;
  if(!S || S.phase!=='mine' || S.editando){ bar.innerHTML=''; return; }
  bar.innerHTML = FERRAMENTAS.filter(f=>(S.ferr[f.id]||0)>0).map(f=>{ const n=S.ferr[f.id]; return `<button class="fb ${S.ferrAtiva===f.id?'on':''}" data-ferr="${f.id}" ${f.id==='desfazer'&&!S.undoSnap?'disabled':''}>${f.em} ${f.nome} <small>${n>90?'∞':n}</small></button>`; }).join('');
  bar.querySelectorAll('[data-ferr]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ferr;
    if(id==='desfazer') return desfazer();
    S.ferrAtiva = S.ferrAtiva===id ? null : id; S.luvaSel=null;
    document.querySelectorAll('.tile.sel').forEach(el=>el.classList.remove('sel'));
    setBanner(null, S.ferrAtiva ? FERRAMENTAS.find(f=>f.id===id).dica : '');
    ferrBar();
  });
}
function gasta(id){ if((S.ferr[id]||0)<90) S.ferr[id]--; S.ferrAtiva=null; S.luvaSel=null; setBanner(null,''); SFX.item(false); }
function desfazer(){
  if(!S.undoSnap || !(S.ferr.desfazer>0)) return;
  Object.assign(S, S.undoSnap); S.undoSnap=null; gasta('desfazer');
  humor(); redesenhaTudo(); assovioBtn();
}
function usarFerramenta(cx,cy){
  const c=labCelula(cx,cy), id=S.ferrAtiva; if(!c) return;
  const [x,y]=c, t=tileAt(x,y), w=S.walls.find(v=>v.x===x&&v.y===y);
  const tira = (arr,o) => { els.get(o.id)?.remove(); els.delete(o.id); return arr.filter(v=>v!==o); };
  if(id==='picao'){
    if(w && !w.v){ S.walls=tira(S.walls,w); gasta(id); }
    else {
      const r=board.getBoundingClientRect(), cel=cellPx(), gap=(r.width-W*cel)/(W+1);
      const fx=(cx-r.left-gap/2)/(cel+gap)-x, fy=(cy-r.top-gap/2)/(cel+gap)-y;
      const lados=[[fx,'v',x-1,y],[1-fx,'v',x,y],[fy,'h',x,y-1],[1-fy,'h',x,y]].sort((a,b)=>a[0]-b[0]);
      const e=lados.map(([,d,ex,ey])=>S.edges.find(q=>q.d===d&&q.x===ex&&q.y===ey)).find(Boolean);
      if(e){ S.edges=tira(S.edges,e); gasta(id); }
    }
  } else if(id==='escavar'){
    if(w && w.v){ S.walls=S.walls.filter(v=>v!==w); gasta(id); }
  } else if(id==='dinamite'){
    if(t){ const el=els.get(t.id); els.delete(t.id); if(el){ el.firstChild.classList.add('crumble'); setTimeout(()=>el.remove(),450); } S.tiles=S.tiles.filter(v=>v!==t); SFX.esfarelar(); shake(1); gasta(id); }
  } else if(id==='luva'){
    if(t){ S.luvaSel=t.id; document.querySelectorAll('.tile.sel').forEach(el=>el.classList.remove('sel')); els.get(t.id)?.classList.add('sel'); return; }
    const sel=S.tiles.find(v=>v.id===S.luvaSel);
    if(sel && !w){ els.get(sel.id)?.classList.remove('sel'); sel.x=x; sel.y=y; gasta(id); }
  }
  render();
}

// ===================== FIM DO DIA: CUSPE + EQUIPAMENTO =====================
function roll(t, rara){
  const nv=Math.min(t+(rara?2:0),14);
  const once=()=>{ const tb=DROPS[nv]; let r=Math.random()*100; for(let i=0;i<tb.length;i++){ if((r-=tb[i])<0) return i; } return 0; };
  let b=once(); for(let i=0;i<(S.up.martelo||0);i++) b=Math.max(b,once()); return b;
}
function tag(t, text, cls){ const el=els.get(t.id); if(!el) return; const p=document.createElement('span'); p.className='price '+cls; p.textContent=text; el.appendChild(p); }
const adjWall = t => DIRS.some(([dx,dy])=>wallAt(t.x+dx,t.y+dy) || edgeBetween(t.x,t.y,t.x+dx,t.y+dy));
const adjBig = t => DIRS.some(([dx,dy])=>{ const o=tileAt(t.x+dx,t.y+dy); return o && o.t>=3; });
const fmtMult = m => '×'+(Math.round(m*100)/100).toString().replace('.',',');

// fileiras (só com a Régua): 3 ou mais pedrinhas iguais seguidas numa linha ou coluna
function fileiras(){
  const out=[], T=(x,y)=>{ const t=tileAt(x,y); return t&&t.t>0?t:null; };
  for(const horiz of [true,false]) for(let a=0;a<(horiz?H:W);a++){
    let run=[]; const L=horiz?W:H;
    for(let b=0;b<=L;b++){
      const t = b<L ? (horiz?T(b,a):T(a,b)) : null;
      if(t && run.length && run[0].t===t.t) run.push(t);
      else { if(run.length>=3) out.push(run); run = t?[t]:[]; }
    }
  }
  return out;
}
function showCalc(){
  const parts=[`<b>$${S.gain}</b>`];
  if(S.mult!==1) parts.push(fmtMult(S.mult).replace('×','× '));
  if(S.cost) parts.push(`<i>-$${S.cost}</i>`);
  $('#calc').innerHTML=parts.join(' ');
}

async function endDay(){
  if(S.phase!=='mine') return;
  if(S.tut===4 || S.tut===3){ S.tut=5; hideCoach(); }
  $('#btnAssovio').style.display='none';
  S.ferrAtiva=null; S.undoSnap=null;
  S.turbo=false; $('#btnFast').style.display='';
  S.phase='reveal'; S.skip=false; S.gain=S.extra||0; S.cost=0; S.mult=1; S.shown=0; S.found=[]; S.clods=0;
  const sobra = Math.max(0,S.energy);
  if(!S.semEnergia && !S.missao) S.saved = S.tut ? 0 : Math.min(CFG.guardaMax, sobra);
  $('#mineRow').style.display='none'; $('#revealRow').style.display='flex';
  $('#btnSkip').style.display=''; $('#btnSell').style.display='none'; requestAnimationFrame(mostraFim);
  $('#dayTotal').textContent='$0'; $('#dayTotal').classList.remove('neg'); showCalc(); $('#recLine').textContent='';
  setBanner(S.missao?`Fase ${S.missao}`:`Fim do dia ${S.day}`, S.saved ? `hora de cuspir! (+${S.saved}⚡ guardada)` : 'hora de cuspir!');
  render(); SFX.fimDia(); abaixar(true); await sleep(700);

  const custo = S.semEnergia ? 0 : custoTorrao();
  const maior = [...S.tiles].filter(t=>t.t>0).sort((a,b)=>b.t-a.t)[0];
  let cuspiram=0;
  const order=[...S.tiles].sort((a,b)=>a.t-b.t);
  const vel = Math.max(.2, Math.min(1, 10/Math.max(1,order.length)));
  const sl = ms => sleep(ms*vel*(S.turbo?.25:1));
  for(const t of order){
    const face=els.get(t.id)?.firstChild; if(!face) continue;
    face.classList.remove('idle');
    if(S.path.picareta && t.t>0){ face.classList.add('crumble'); tag(t,'nada','zero'); await sl(90); continue; }
    if(t.t===0){
      face.classList.add('wob'); await sl(200);
      face.classList.remove('wob'); face.classList.add('crumble'); SFX.esfarelar(); S.clods++;
      if(has('adubo') && adjBig(t)){ const v=lvl('adubo')*S.week; S.gain+=v; tag(t,'+$'+v,''); fire('adubo','+$'+v); }
      else if(!custo){ }
      else if(S.pa>0){ S.pa--; tag(t,'pá','zero'); }
      else { S.cost+=custo; tag(t,`-$${custo}`,'neg'); }
      showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost); await sl(220);
      continue;
    }
    face.innerHTML=svgOf(pedraInner(t.t,{face:['squeeze','puff'],blushBig:true}));
    face.classList.add('wob');
    await sl(t.t>=5?850:t.t>=3?420:240);
    face.classList.remove('wob');
    let nivel=t.t;
    if(has('eco') && adjWall(t)){ nivel+=lvl('eco'); fire('eco','+'+lvl('eco')+' nível'); }
    let o=roll(nivel, t.r);
    { const L=lvl('peneira'); if(L && (t.t===1 || (t.t===2&&L>=2))){ const min=L>=3?3:2; if(o<min){ o=min; fire('peneira',ORES[min].n+'!'); } } }
    if(fiscalHoje('miope') && t.t<=2) o=0;
    t.ore=o; S.found.push(o);
    const ore=ORES[o];
    let val=Math.round(ore.p*(1+.15*(S.up.balanca||0))*bonusNivel(t.t));
    if(has('rochedo') && (t.t===3||t.t===4) && val>0){ val*=1+lvl('rochedo'); fire('rochedo','×'+(1+lvl('rochedo')),true); }
    if(has('lupa') && t===maior && val>0){ val*=1+lvl('lupa'); fire('lupa','×'+(1+lvl('lupa')),true); }
    if(o>0) cuspiram++;
    const body=`<g transform="translate(36 66) scale(.72) translate(-50 -58)">${pedraInner(t.t,o?{face:['happy','open']}:{face:['dot','wavy'],sweat:true})}</g>`;
    const spat=`<g class="spat">${oreSvg(o,70,34,1.25)}</g>`;
    face.innerHTML=svgOf(body+spat);
    SFX.cuspe();
    S.gain+=val; showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost);
    tag(t, o?`$${val}`:'nada', o?'':'zero');
    if(!S.skip){
      if(o>=1 && o<=3) SFX.comum(o>=3?2:1);
      if(o>=4){
        shake(Math.min(3,o-3)); sparks(t, ore.c); popup(ore.n.toUpperCase()+'!', '+$'+val, ore.c); SFX.raro(Math.min(6,o-1));
        await sl(o>=5?1000:650);
      } else await sl(160);
    }
  }
  // bônus do equipamento, um de cada vez
  const bonus = [];
  if(has('vaquinha') && cuspiram) bonus.push(['vaquinha', cuspiram*lvl('vaquinha')]);
  if(has('horaextra') && S.tired) bonus.push(['horaextra', S.tired*lvl('horaextra')]);
  if(has('musgo')){ const occ=(x,y)=>{ const o=tileAt(x,y); return o && o.t>0; };
    const n=S.walls.filter(w=>DIRS.some(([dx,dy])=>occ(w.x+dx,w.y+dy))).length + S.edges.filter(e=>occ(e.x,e.y)||(e.d==='v'?occ(e.x+1,e.y):occ(e.x,e.y+1))).length;
    if(n) bonus.push(['musgo', 2*n*lvl('musgo')*S.week]); }
  if(has('cascalheira')){ const n=S.tiles.filter(t=>t.t===1).length; if(n) bonus.push(['cascalheira', n*lvl('cascalheira')*S.week]); }
  if(has('pedreira')){ const n=S.tiles.filter(t=>t.t===2).length; if(n) bonus.push(['pedreira', 2*n*lvl('pedreira')*S.week]); }
  for(const [id,v] of bonus){ await sl(380); S.gain+=v; fire(id,'+$'+v); showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost); }
  // multiplicadores
  if(!fiscalHoje('paoduro')){
    if(has('regua')) for(const ln of fileiras()){
      await sl(350);
      const g=(ln.length>=4?.5:.25)*lvl('regua');
      S.mult+=g;
      ln.forEach(t=>els.get(t.id)?.classList.add('line'));
      popup(`Fileira de ${ROCKS[ln[0].t].n}!`, '+'+fmtMult(g), '#6aa84f');
      fire('regua','+'+fmtMult(g),true);
      showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost);
      await sl(650);
    }
    const mults=[];
    if(S.path.narrow) mults.push([null,2]);
    if(has('coroa') && S.coroa) mults.push(['coroa', 1+S.coroa]);
    for(const [id,m] of mults){ await sl(450); S.mult*=m; if(id) fire(id,fmtMult(m),true); else popup('×2','galeria estreita','#7a59a8'); SFX.raro(3); showCalc(); countTo(Math.round(S.gain*S.mult)-S.cost); }
  }
  S.dayTotal = Math.round(S.gain*S.mult) - S.cost;
  S.skip=true; countTo(S.dayTotal); S.skip=false;
  setBanner(S.missao?`Fase ${S.missao}`:`Fim do dia ${S.day}`, S.dayTotal>0 ? `rendeu ${fmt(S.dayTotal)}` : S.dayTotal<0 ? 'a terra deu prejuízo...' : 'dia fraco...');
  $('#btnSkip').style.display='none'; $('#btnFast').style.display='none'; $('#btnSell').style.display='';
  mostraFim();
  $('#btnSell').textContent = S.dayTotal>=0 ? `Vender ${fmt(S.dayTotal)}` : `Pagar a limpeza (${fmt(S.dayTotal)})`;
  recordeFim();
  if(S.tut===5) coach('<b>Ptui!</b> Pedrinha cospe minério, torrão custa.', 'Legal!', ()=>{
    coach('Toque em <b>Vender</b> para embolsar!', null, null, '#revealRow');
  }, '#board');
}
const fmt = v => (v<0?'-$':'$')+Math.abs(v);

function sell(){
  abaixar(false);
  S.money=Math.max(0,S.money+S.dayTotal); S.stats.days++; S.stats.best=Math.max(S.stats.best,S.dayTotal); render();
  if(S.dayTotal>0) SFX.venda(); else SFX.esfarelar();

function itemCard(it, extra='', L=1){
  const up = L>1 ? ` <span class="est" style="background:#c48a1e">nível ${L}</span>` : '';

function itemPick(n, then, title){
  const pool = shuffle(ITEMS.filter(i=>lvl(i.id)<CFG.maxNivel)).slice(0,n);

  document.querySelectorAll('[data-fer]').forEach(b=>b.onclick=()=>{ const f=FERRAMENTAS.find(x=>x.id===b.dataset.fer), pr=preco(f.preco); if(S.money<pr) return; S.money-=pr; S.ferr[f.id]=(S.ferr[f.id]||0)+1; again(); });

  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{ const i=item(b.dataset.buy), pr=precoItem(i,lvl(i.id)); if(S.money<pr) return; S.money-=pr; S.lv[i.id]=lvl(i.id)+1; again(); });

function weekEnd(){
  const q=CFG.quota(S.week), paid=S.money>=q;
  if(paid){
    S.money-=q; S.fails=0; SFX.pagou();
    localStorage.mina_best = Math.max(+(localStorage.mina_best||0), S.week+1);
    showOverlay(`<div class="bigEm">🎉</div><h2 style="color:#6aa84f">Cota paga!</h2><p>Pagou $${q}, sobrou $${S.money}.</p>

// desenho pequeno de um formato (casas, buracos, blocos e muretas)
function formaSvg(f, px=120){
  const w=fw(f), h=fh(f), u=100/Math.max(w,h), ox=(100-w*u)/2, oy=(100-h*u)/2; let g='';
  f.mapa.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if(ch==='#') return;
    g+=`<rect x="${ox+x*u+u*.08}" y="${oy+y*u+u*.08}" width="${u*.84}" height="${u*.84}" rx="${u*.2}" fill="${ch==='B'?'#6b625a':'#dcc7a2'}" stroke="#2e2219" stroke-width="${ch==='B'?1.4:0}"/>`;
  }));
  for(const [d,x,y] of (f.muretas||[])) g += d==='v' ? `<rect x="${ox+(x+1)*u-2}" y="${oy+y*u+u*.1}" width="4" height="${u*.8}" rx="2" fill="#f2b33d"/>` : `<rect x="${ox+x*u+u*.1}" y="${oy+(y+1)*u-2}" width="${u*.76}" height="4" rx="2" fill="#f2b33d"/>`;
  return `<svg class="formaSvg" viewBox="-3 -3 106 106" style="width:${px}px;height:${px}px"><rect x="-3" y="-3" width="106" height="106" rx="12" fill="#3a2c22"/>${g}</svg>`;
}

// constrói do zero: tela toda de buraco, pincel "Casa"
function labConstruir(){
  labEnche(true); for(const t of S.tiles){ els.get(t.id)?.remove(); els.delete(t.id); } S.tiles=[];
  PINCEL.tipo='casa'; labEditar(true);
  setBanner('Construtor', 'pinte as casas que existem');
}
function labEnche(buraco){
  for(const w of S.walls){ els.get(w.id)?.remove(); els.delete(w.id); }
  for(const e of S.edges){ els.get(e.id)?.remove(); els.delete(e.id); }
  S.walls=[]; S.edges=[];
  if(buraco){ for(const t of S.tiles){ els.get(t.id)?.remove(); els.delete(t.id); } S.tiles=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++) S.walls.push({x,y,v:true,id:'w'+(nextId++)}); }
  render();
}
function labPinta(x,y){
  const velho=tileAt(x,y); if(velho){ S.tiles=S.tiles.filter(t=>t!==velho); els.get(velho.id)?.remove(); els.delete(velho.id); }
  const w=S.walls.find(v=>v.x===x&&v.y===y); if(w){ S.walls=S.walls.filter(v=>v!==w); els.get(w.id)?.remove(); els.delete(w.id); }
  if(PINCEL.tipo==='casa'){ render(); return; }
  if(PINCEL.tipo==='parede') S.walls.push({x,y,id:'w'+(nextId++)});
  else if(PINCEL.tipo==='buraco') S.walls.push({x,y,v:true,id:'w'+(nextId++)});
  else if(PINCEL.tipo==='torrao') S.tiles.push({id:'t'+(nextId++),x,y,t:0});
  else if(PINCEL.tipo!=='apagar'){ const t={id:'t'+(nextId++),x,y,t:PINCEL.t}; if(PINCEL.c!=null) t.c=PINCEL.c; if(PINCEL.tipo==='pick') t.k='p'; else if(S.path?.picareta) t.k='r'; S.tiles.push(t); }
  render();
}
// formato atual do tabuleiro do laboratório, no mesmo jeito dos FORMAS
function formaAtual(){
  const aberta=(x,y)=>!S.walls.some(v=>v.v&&v.x===x&&v.y===y);
  const xs=[],ys=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(aberta(x,y)){ xs.push(x); ys.push(y); }
  if(!xs.length) return null;
  // recorta no menor retângulo que contém as casas
  const x0=Math.min(...xs), y0=Math.min(...ys), w=Math.max(...xs)-x0+1, h=Math.max(...ys)-y0+1;
  const mapa=[...Array(h).keys()].map(y=>[...Array(w).keys()].map(x=>{ const X=x+x0, Y=y+y0; const w=S.walls.find(v=>v.x===X&&v.y===Y); return w?(w.v?'#':w.lixo?(w.hp>1?String(w.hp):'L'):'B'):'.'; }).join(''));
  const muretas=S.edges.map(e=>[e.d,e.x-x0,e.y-y0]).filter(([d,x,y])=>x>=0&&y>=0&&x<w&&y<h);
  const pecas=S.tiles.map(t=>[t.x-x0,t.y-y0,t.t,t.c??null,t.k||null]).filter(([x,y])=>x>=0&&y>=0&&x<w&&y<h);
  return {mapa, muretas, pecas};
}
// mureta: acha a borda mais perto do toque e liga/desliga
function labMureta(cx,cy){
  const r=board.getBoundingClientRect(), cel=cellPx(), gap=(r.width-W*cel)/(W+1);
  const fx=(cx-r.left-gap/2)/(cel+gap), fy=(cy-r.top-gap/2)/(cel+gap), x=Math.floor(fx), y=Math.floor(fy), ox=fx-x, oy=fy-y;
  const lados=[[ox,'v',x-1,y],[1-ox,'v',x,y],[oy,'h',x,y-1],[1-oy,'h',x,y]].sort((a,b)=>a[0]-b[0]);
  const [,d,ex,ey]=lados[0];
  if(d==='v' && (ex<0||ex>=W-1||ey<0||ey>=H)) return; if(d==='h' && (ey<0||ey>=H-1||ex<0||ex>=W)) return;
  const ja=S.edges.find(e=>e.d===d&&e.x===ex&&e.y===ey);
  if(ja){ S.edges=S.edges.filter(e=>e!==ja); els.get(ja.id)?.remove(); els.delete(ja.id); }
  else S.edges.push({d,x:ex,y:ey,id:'e'+(nextId++)});
  render();
}
function labCelula(cx,cy){
  const r=board.getBoundingClientRect(), cel=cellPx(), gap=(r.width-W*cel)/(W+1);
  const x=Math.floor((cx-r.left-gap/2)/(cel+gap)), y=Math.floor((cy-r.top-gap/2)/(cel+gap));
  return inside(x,y) ? [x,y] : null;
}

let coachBlock=false, coachTarget=null, coachTimer=null;
// alvo: seletor ou elemento que o balão explica ('top' = sem alvo, no alto)
function coach(html, okLabel, onOk, target){
  coachTarget = target==='top' ? 'top' : typeof target==='string' ? $(target) : (target||null);
  $('#coachText').innerHTML=enrich(html);
  const b=$('#coachOk');
  if(okLabel){ b.style.display=''; b.textContent=okLabel; coachBlock=true; b.onclick=()=>{ hideCoach(); onOk&&onOk(); }; }
  else { b.style.display='none'; coachBlock=false; }
  $('#spot').classList.toggle('dim', !!okLabel);
  if(coachTarget && coachTarget!=='top' && coachTarget.scrollIntoView) coachTarget.scrollIntoView({block:'center'});
  $('#coach').classList.remove('hidden');
  placeCoach(); clearInterval(coachTimer); coachTimer=setInterval(placeCoach,250);
}
function placeCoach(){
  const c=$('#coach'), sp=$('#spot'), t=coachTarget;
  if(c.classList.contains('hidden')){ sp.classList.add('hidden'); return; }
  c.style.top=''; c.style.bottom=''; c.dataset.arrow='';
  if(t==='top'){ sp.classList.add('hidden'); c.style.top='12px'; c.style.bottom='auto'; return; }
  if(!t || !t.isConnected){ sp.classList.add('hidden'); c.style.bottom='12px'; return; }
  const r=t.getBoundingClientRect(), pad=6;
  sp.classList.remove('hidden');
  Object.assign(sp.style,{left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+2*pad)+'px', height:(r.height+2*pad)+'px'});
  const h=c.offsetHeight, below=r.bottom+pad+14, above=r.top-pad-14-h;
  if(below+h < innerHeight-8){ c.style.top=below+'px'; c.style.bottom='auto'; c.dataset.arrow='up'; }
  else if(above>8){ c.style.top=above+'px'; c.style.bottom='auto'; c.dataset.arrow='down'; }
  else c.style.bottom='12px';
  const cl=c.getBoundingClientRect().left;
  c.style.setProperty('--ax', Math.min(Math.max(r.left+r.width/2-cl, 26), c.offsetWidth-26)+'px');
}
addEventListener('resize', placeCoach);

// ===================== CLÁSSICO (FASES COM MISSÃO) =====================
// Mundos e fases em missoes.js; arrastos e estrelas calibrados em missoes_calib.js (python testes/calibrar.py).
// Cada fase tem uma ou mais metas e um limite de arrastos, e acaba quando todas as metas são cumpridas.
// Estrelas pelos arrastos que sobram; pontos como no 2048 (juntar soma o valor da pedrinha nova).
// Peças do Clássico: casa marcada (S.alvos), casa de terra (S.terra), pedrinha presa (tile.presa), carrinho (S.carro).
// Guardado em mina_missoes: {n: {e: estrelas, t: pontos, pm: medalha do Passinho}}; fase em andamento em mina_cla_save.
if(localStorage.ptui_jornada!=='2'){
  for(const k of ['mina_missoes','mina_cla_save','ptui_partidas']) if(localStorage[k]!=null){ localStorage[k+'_v1']=localStorage[k]; localStorage.removeItem(k); }
  localStorage.ptui_jornada='2';
}
const MISS = () => JSON.parse(localStorage.mina_missoes||'{}');
const liberada = n => n===1 || (MISS()[n-1]?.e||0) > 0;
const mundoDe = m => MUNDOS[m.g];
const faseDe = m => m.fase || (m.forma||m.mapa ? 'caverna' : mundoDe(m).fase);
const charDe = m => m.char || mundoDe(m).char || 'rola';
const objsDe = m => m.objs || [m.obj];
const metasDe = m => objsDe(m).filter(o=>!o.proibido);
// nome da cor concordando com a peça (Asteroide roxo, Rocha roxa)
const corNome = (c,t) => { const fem = t==null || artigo(rockName(t))==='uma'; return [fem?'roxa':'roxo','verde',fem?'mista':'misto'][c]; };
const artigo = nome => { const w=nome.split(' ')[0]; if(/^(Cometa|Planeta)$/.test(w)) return 'um'; if(/is$/.test(w)) return 'uns'; return /a$/.test(w) ? 'uma' : 'um'; };
// só as palavras antes de "de" vão para o plural (Rochas de gelo); ão vira ões
const plural = nome => { let para=false; return nome.split(' ').map(w=>{ if(para) return w; if(w==='de'){ para=true; return w; } return /ão$/.test(w)?w.slice(0,-2)+'ões':/[aeiouáéíóú]$/i.test(w)?w+'s':/r$/.test(w)?w+'es':/l$/.test(w)?w.slice(0,-1)+'is':w; }).join(' '); };
const qtd = (n,t) => n===1 ? `${artigo(rockName(t))} ${rockName(t)}` : `${n} ${plural(rockName(t))}`;
const estrelasHtml = (e, cls='estr') => `<span class="${cls}">${[1,2,3].map(i=>`<i class="${i<=e?'on':''}">★</i>`).join('')}</span>`;
const VAL = t => t>0 ? 2**t : 0;   // Cascalho 2, Pedra 4, Rocha 8, Rocha densa 16... (Rubi real = 2048)
const figSvg = (inner,cls='') => `<svg class="${cls}" viewBox="0 0 100 100">${inner}</svg>`;
const pedraCor = (t,c) => pedraInner(t, c!=null ? {cor:c} : {});
const listaE = a => a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' e '+a[a.length-1];

// ---------- metas ----------
function objetivoTxt(o){
  if(espFig()){ const e=objetivoEsp(o); if(e) return e; }
  if(o.forme) return `Forme ${qtd(o.n,o.forme)}`;
  if(o.cor!=null) return `Forme ${qtd(o.n,o.t)} ${corNome(o.cor,o.t)}${o.n>1?'s':''}`;
  if(o.pontos) return `Faça ${o.pontos} pontos`;
  if(o.quebre) return o.quebre<=1 ? `Quebre ${o.n} pedrinha${o.n>1?'s':''} com a picareta` : `Quebre ${qtd(o.n,o.quebre)} com a picareta`;
  if(o.seq) return `Forme, nessa ordem: ${listaE(o.seq.map(t=>rockName(t)))}`;
  if(o.combo) return `Faça duas junções num arrasto só, ${o.combo} ${o.combo>1?'vezes':'vez'}`;
  if(o.leve) return (o.n||1)>1 ? `Leve ${artigo(rockName(o.leve))} ${rockName(o.leve)} até cada casa marcada` : `Leve ${artigo(rockName(o.leve))} ${rockName(o.leve)} até a casa marcada`;
  if(o.alvo) return (o.n||1)>1 ? `Forme ${artigo(rockName(o.alvo))} ${rockName(o.alvo)} em cada casa marcada` : `Forme ${artigo(rockName(o.alvo))} ${rockName(o.alvo)} na casa marcada`;
  if(o.rache) return o.rache>1 ? `Rache ${o.rache} lixos espaciais` : 'Rache o lixo espacial';
  if(o.terra) return `Limpe a terra das ${o.terra} casas`;
  if(o.solte) return (o.n||1)>1 ? `Solte as ${o.n} ${plural(rockName(o.solte))} presas` : `Solte ${artigo(rockName(o.solte))==='uma'?'a':'o'} ${rockName(o.solte)} pres${artigo(rockName(o.solte))==='uma'?'a':'o'}`;
  if(o.carrinho) return `Coloque ${qtd(o.n,o.carrinho)} no carrinho`;
  if(o.proibido) return `sem formar ${artigo(rockName(o.proibido))} ${rockName(o.proibido)}`;
  return '';
}
const objetivosTxt = m => { const ms=metasDe(m).map(objetivoTxt), r=objsDe(m).find(o=>o.proibido); return listaE(ms)+(r?', '+objetivoTxt(r):''); };
// quanto de cada meta já foi feito
function progObj(o){
  if(o.forme) return {at:S.feitas?.[o.forme]||0, alvo:o.n};
  if(o.cor!=null) return {at:S.coresF?.[o.t+':'+o.cor]||0, alvo:o.n};
  if(o.pontos) return {at:S.pontos||0, alvo:o.pontos};
  if(o.quebre) return {at:(S.quebras||[]).filter(t=>t>=o.quebre).length, alvo:o.n};
  if(o.seq) return {at:S.seqI||0, alvo:o.seq.length};
  if(o.combo) return {at:S.combos||0, alvo:o.combo};
  if(o.alvo) return {at:(S.alvos||[]).filter(a=>a.ok&&!a.leve).length, alvo:(S.alvos||[]).filter(a=>!a.leve).length||o.n||1};
  if(o.leve) return {at:(S.alvos||[]).filter(a=>a.ok&&a.leve).length, alvo:(S.alvos||[]).filter(a=>a.leve).length||o.n||1};
  if(o.rache) return {at:S.rachados||0, alvo:o.rache};
  if(o.terra) return {at:(S.terraTot||0)-(S.terra?.size||0), alvo:S.terraTot||o.terra};
  if(o.solte) return {at:S.soltas||0, alvo:S.presasTot||o.n||1};
  if(o.carrinho) return {at:S.carro?.n||0, alvo:o.n};
  return {at:0, alvo:0};
}
const metaFeita = o => { const p=progObj(o); return p.at>=p.alvo; };
const cumpriu = m => metasDe(m).every(metaFeita);
const violou = m => objsDe(m).find(o=>o.proibido && (S.maxForm||0)>=o.proibido);
// fase livre (sem limite de arrastos): as estrelas vêm dos arrastos usados; tetoEst = máximo de arrastos para ★★ e para ★★★
const tetoEst = m => [m.arrastos-m.estrelas[0], m.arrastos-m.estrelas[1]];
const estrelasPor = (m,sobra,usados) => m.livre ? 1 + (usados<=tetoEst(m)[0]) + (usados<=tetoEst(m)[1]) : 1 + (sobra>=m.estrelas[0]) + (sobra>=m.estrelas[1]);
const arrastosTxt = m => m.livre ? 'sem limite de arrastos' : `${m.arrastos||'?'} arrastos`;
const metasEstTxt = (m,e=1) => m.livre ? `${e<2?`★★ em até ${tetoEst(m)[0]} arrastos · `:''}★★★ em até ${tetoEst(m)[1]}`
                                     : `${e<2?`★★ sobrando ${m.estrelas[0]} arrastos · `:''}★★★ sobrando ${m.estrelas[1]}`;

// conta o que as metas pedem e os pontos, a cada arrasto (sem mexer na tela: o robô de calibrar usa)
// lixo espacial: bloco fixo; cada junção numa casa vizinha tira 1 de vida; sem vida, ele some e a casa fica livre
function rachaLixo(r){
  if(!S.walls.some(w=>w.hp)) return;
  let bateu=0; for(const o of r.merges) for(const w of S.walls) if(w.hp>0 && Math.abs(w.x-o.x)+Math.abs(w.y-o.y)===1){ w.hp--; bateu++; }
  if(bateu) SFX.racha();
  const foram=S.walls.filter(w=>w.lixo && w.hp<=0); if(!foram.length) return;
  S.walls=S.walls.filter(w=>!(w.lixo && w.hp<=0)); S.rachados=(S.rachados||0)+foram.length;
  for(const w of foram){ const el=els.get(w.id); if(el){ els.delete(w.id); el.classList.add('some'); setTimeout(()=>el.remove(),300); } }
}
function contaMissao(r){
  rachaLixo(r); const neb=S.terra?.size||0;
  for(const o of r.merges){
    S.feitas[o.t]=(S.feitas[o.t]||0)+1; if(o.c!=null) S.coresF[o.t+':'+o.c]=(S.coresF[o.t+':'+o.c]||0)+1;
    if(o.k!=='p') S.pontos+=VAL(o.t);
    S.maxForm=Math.max(S.maxForm||0,o.t);
    if(S.seqAlvo && S.seqI<S.seqAlvo.length && o.t>=S.seqAlvo[S.seqI]) S.seqI++;
    const a=(S.alvos||[]).find(a=>!a.ok && !a.leve && a.x===o.x && a.y===o.y && o.t>=a.t); if(a) a.ok=true;
    S.terra?.delete(o.x+','+o.y);
    if(o.solta){ S.soltas=(S.soltas||0)+1; delete o.solta; }
  }
  if((S.terra?.size||0)<neb) SFX.nebulosa();
  // casa de levar: vale só se exatamente a peça pedida CHEGAR andando. Junção em cima da casa não conta, nem quando a
  // peça formada ali fica parada nos arrastos seguintes (a.ocup lembra quem já estava na casa)
  { const juntou=new Set(r.merges.map(o=>o.id));
    for(const a of S.alvos||[]) if(a.leve && !a.ok){ const q=S.tiles.find(t=>t.x===a.x && t.y===a.y && t.k!=='p');
      if(q && q.t===a.t && !juntou.has(q.id) && q.id!==a.ocup) a.ok=true; a.ocup = q ? q.id : null; } }
  espDescobre(r);
  if(r.merges.length>=2) S.combos=(S.combos||0)+1;
  for(const b of r.breaks){ S.quebras.push(b.t); S.pontos+=2*VAL(b.t); }
}
// carrinho: pedrinha do tamanho pedido (ou maior) parada nele é recolhida
function recolheCarro(){
  const c=S.carro; if(!c) return null;
  const t=S.tiles.find(t=>t.x===c.x && t.y===c.y && t.t>=c.t && t.k!=='p' && !t.presa);
  if(!t) return null;
  S.tiles=S.tiles.filter(x=>x!==t); c.n++; return t;
}
function flutuaPontos(r){
  const f=(x,y,v)=>{ const el=document.createElement('div'); el.className='flut'; el.textContent='+'+v; el.style.transform=pos(x,y); board.appendChild(el); setTimeout(()=>el.remove(),950); };
  for(const o of r.merges) if(o.k!=='p') f(o.x,o.y,VAL(o.t));
  for(const b of r.breaks) f(b.x,b.y,2*VAL(b.t));
}
// depois de cada arrasto: cumpriu, formou o proibido, acabaram os arrastos ou travou
function checaMissao(){
  const m=MISSOES[S.missao-1];
  const est=S, acaba=(ok,txt,motivo)=>{ S.phase='fimM'; localStorage.removeItem('mina_cla_save'); anotaPartida(ok, motivo); setBanner(null,txt); if(ok) SFX.pagou();
    setTimeout(()=>{ if(S===est && S.phase==='fimM') missaoResultado(ok,motivo); }, ok?800:650); };   // só se ainda estiver nessa fase
  const v=violou(m); if(v) return acaba(false,'não podia!',`Você formou ${artigo(rockName(v.proibido))} ${rockName(v.proibido)}.`);
  if(cumpriu(m)) return acaba(true,'missão cumprida!');
  if(S.energy<=0) return acaba(false,'acabaram os arrastos','Acabaram os arrastos.');
  if(!anyMove()) return acaba(false,'não cabe mais nada','Não cabia mais nada no tabuleiro.');
  salvaFase();
}

// ---------- partidas anotadas no próprio aparelho (nada sai dele): Laboratório > Dados das partidas ----------
// cada fim de fase: [fase, venceu (1/0), arrastos usados, arrastos que sobraram, Passinho (1/0), dia]; guarda as 1500 últimas
const PARTIDAS = () => JSON.parse(localStorage.ptui_partidas||'[]');
function anotaPartida(ok, motivo){
  try{ const a=PARTIDAS(); a.push([S.missao, ok?1:0, S.moves||0, Math.max(0,S.energy||0), S.medalha?1:0, new Date().toISOString().slice(0,10)]);
    localStorage.ptui_partidas=JSON.stringify(a.slice(-1500)); }catch(e){}
}
function dadosPartidas(volta){
  const a=PARTIDAS(), por={};

  const linhas=Object.keys(por).map(Number).sort((x,y)=>x-y).map(n=>{ const p=por[n]; return `Fase ${n}: ${p.v} de ${p.t} vencidas, mediana ${med(p.us)} arrastos (limite ${MISSOES[n-1]?.arrastos??'?'})`; });
  const texto='2048 Astros, partidas da Jornada\n'+(linhas.join('\n')||'nenhuma partida ainda')+'\n\nbruto: '+JSON.stringify(a);
  showOverlay(`<h2>Dados das partidas</h2><p>Ficam só neste aparelho. Copie e mande por mensagem.</p>
    <textarea id="dpTxt" readonly style="width:100%;height:180px;font-size:12px"></textarea>
    <button class="btn b" id="dpCopia">Copiar</button><button class="btn dim" id="dpVolta">Voltar</button>`);
  $('#dpTxt').value=texto;
  $('#dpCopia').onclick=()=>{ const ok=()=>{ $('#dpCopia').textContent='Copiado!'; };
    if(navigator.clipboard) navigator.clipboard.writeText(texto).then(ok,()=>{ $('#dpTxt').select(); document.execCommand('copy'); ok(); });
    else { $('#dpTxt').select(); document.execCommand('copy'); ok(); } };
  $('#dpVolta').onclick=volta;
}

// ---------- fase em andamento: salvar e continuar ----------
const CAMPOS_SAVE = ['tiles','walls','edges','alvos','terraTot','carro','energy','moves','pontos','feitas','coresF','quebras','seqI','combos','soltas','presasTot','maxForm','next','rachados'];
function salvaFase(){
  const st={}; for(const k of CAMPOS_SAVE) st[k]=S[k]; st.terra=[...(S.terra||[])];
  localStorage.mina_cla_save=JSON.stringify({n:S.missao, pass:!!S.medalha, st});
}
const faseSalva = n => { const sv=JSON.parse(localStorage.mina_cla_save||'null'); return sv && sv.n===n ? sv : null; };
function restauraFase(st){
  for(const el of els.values()) el.remove(); els.clear(); limpaMarcas();
  for(const k of CAMPOS_SAVE) if(st[k]!==undefined) S[k]=st[k];
  S.terra=new Set(st.terra||[]);
  // depois de reabrir o app o contador de peças volta a 1: segue depois das peças salvas, senão as novas repetem o id delas
  for(const t of S.tiles){ const k=+String(t.id).slice(1); if(k>=nextId) nextId=k+1; }
}

// ---------- peças do Clássico no tabuleiro ----------
// sorteadas a partir das metas: casa marcada, casa de terra, pedrinha presa e carrinho
function montaPecasMissao(m){
  S.alvos=[]; S.terra=new Set(); S.carro=null; S.presasTot=0; S.terraTot=0;
  const usados=new Set(S.tiles.map(t=>t.x+','+t.y));
  const livres=f=>{ const out=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(!wallAt(x,y) && !usados.has(x+','+y) && (!f||f(x,y))) out.push({x,y}); return shuffle(out); };

      ${e<3?`<p class="metas">${metasEstTxt(m,e)}</p>`:''}
      ${n<MISSOES.length?'<button class="btn g" id="mProx">Próxima fase</button>':'<p>Você terminou todas as fases!</p>'}
      <button class="btn dim" id="mDeNovo">Jogar de novo</button><button class="btn dim" id="mLista">Ver fases</button>`);

// ===================== esfera (mapeamento esférico pixel a pixel) =====================
class SphereBody{
  constructor(tex,o={}){Object.assign(this,{tex,tilt:.35,pitch:.25,speed:.05,emissive:false,clouds:null,cloudSpeed:1.3,rScale:.86},o);this.userSpin=0;}
  prep(S){this.S=S;const R=this.R=S/2*this.rScale,cx=S/2,cy=S/2;const idx=[],row=[],col=[],nx=[],ny=[],nz=[];
    const ct=Math.cos(this.tilt),st=Math.sin(this.tilt),cp=Math.cos(this.pitch),sp=Math.sin(this.pitch);
    for(let j=0;j<S;j++)for(let i=0;i<S;i++){const x=(i+.5-cx)/R,y=(cy-(j+.5))/R,q=x*x+y*y;if(q>1)continue;const z=Math.sqrt(1-q);
      const x1=x*ct+y*st,y1=-x*st+y*ct,y2=y1*cp+z*sp,z2=-y1*sp+z*cp;
      const lat=Math.asin(clamp(y2,-1,1)),lon=Math.atan2(x1,z2);
      idx.push(j*S+i);row.push(Math.min(TH-1,Math.floor((.5-lat/Math.PI)*TH))*TW);col.push((lon/(2*Math.PI)+.5)*TW);nx.push(x);ny.push(y);nz.push(z);}
    this.P={idx:Int32Array.from(idx),row:Int32Array.from(row),col:Float32Array.from(col),nx:Float32Array.from(nx),ny:Float32Array.from(ny),nz:Float32Array.from(nz)};
    if(!this.can||this.can.width!==S){this.can=mk(S,S);this.cx=this.can.getContext('2d');this.img=this.cx.createImageData(S,S);}}
  render(t,L,o={}){const {idx,row,col,nx,ny,nz}=this.P,tp=this.tex.px,d=this.img.data;d.fill(0);
    const off=(-this.speed*t+this.userSpin)*TW,cl=this.clouds?this.clouds.px:null,coff=(-this.speed*this.cloudSpeed*t+this.userSpin)*TW;
    const Lx=L[0],Ly=L[1],Lz=L[2],em=this.emissive,grid=o.grid;
    for(let k=0;k<idx.length;k++){let c=col[k]+off;c=((c%TW)+TW)%TW|0;const ti=(row[k]+c)*4;let r=tp[ti],g=tp[ti+1],b=tp[ti+2];
      if(cl){let c2=col[k]+coff;c2=((c2%TW)+TW)%TW|0;const ci=(row[k]+c2)*4,a=cl[ci+3]/255;r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}
      if(grid&&(c%64<3||(row[k]/TW)%32<2.5)){r=r*.35+165;g=g*.35+165;b=b*.35+165;}
      let s;if(em)s=.72+.36*nz[k];else{const l=nx[k]*Lx+ny[k]*Ly+nz[k]*Lz;s=.26+.56*smooth(-.1,.14,l)+.2*smooth(.45,.95,l);const rim=1-nz[k];s+=.2*rim*rim*rim*smooth(0,.3,l);}
      const p=idx[k]*4;d[p]=r*s;d[p+1]=g*s;d[p+2]=b*s;d[p+3]=255;}

        for(const [,f,lam] of fs){const s=.45+.45*smooth(-.1,.4,lam)+.25*smooth(.6,.95,lam),col=p.col;o.fillStyle=`rgb(${col[0]*s|0},${col[1]*s|0},${col[2]*s|0})`;

          if(op.outline!==false){o.strokeStyle=INK;o.lineWidth=Math.max(.7,S*.006);o.stroke();}}}

  }else if(k==='dust'){
    const r=rng(5),gr=Array.from({length:80},()=>({r:.12+.72*Math.sqrt(r()),th:r()*7,w:(.5+r())*.9,s:.012+.035*r()*r(),c:r()<.5?'#d9c49a':'#b39773',dir:randDir(r)}));
    P.draw=(t,L,op={})=>{o.clearRect(0,0,S,S);const c=S/2,g=o.createRadialGradient(c,c,0,c,c,S*.45);g.addColorStop(0,'rgba(230,210,170,.22)');g.addColorStop(1,'rgba(230,210,170,0)');o.fillStyle=g;o.fillRect(0,0,S,S);
      const ax=vr&&vr.eixo?vr.eixo:[.3,1,.2],Rn=rotAxis(...ax,t*.55*(vr?vr.vel:1)+(vr?vr.fase*6.283:0)),gira=d=>[Rn[0]*d[0]+Rn[1]*d[1]+Rn[2]*d[2],Rn[3]*d[0]+Rn[4]*d[1]+Rn[5]*d[2],Rn[6]*d[0]+Rn[7]*d[1]+Rn[8]*d[2]];
      const sorted=gr.map(p=>{const v=gira(p.dir);return {p,x:v[0]*p.r,y:-v[1]*p.r,z:v[2]*p.r};}).sort((a,b)=>a.z-b.z);

  }

function bnDraw(c,x,y,R,t,col,tilt=-.3){c.save();c.translate(x,y);

  const pinta=l=>{c.globalCompositeOperation='lighter';for(const p of l){const s=R*.1*p.s;c.fillStyle=`rgba(${col},${(.35+.55*p.b).toFixed(2)})`;c.fillRect(p.x-s/2,p.y-s/2,s,s);}c.globalCompositeOperation='source-over';};

function buildFundo(w,h,m,o={}){const D=DPR,g=mk(w,h),c=g.getContext('2d'),r=rng(o.seed||7),big=Math.max(w,h),marco=o.planeta!==false,J=!!o.jogo;

  const bg=c.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#0b0a18');bg.addColorStop(1,'#141026');if(!sn){c.fillStyle=bg;c.fillRect(0,0,w,h);}

  'void main(){vec2 q=c+a*h;gl_Position=vec4(q.x/tela.x*2.-1.,1.-q.y/tela.y*2.,0.,1.);p=vec2(a.x,-a.y)*h/raio;}';

 'if(atmoOn>.5&&r<1.25){float a=.55*clamp(1.-(r-.92)/.33,0.,1.);o=vec4(atmo*a,a);}'+
 'if(glow>.5&&r<glowR){float k=clamp((r-.8)/(glowR-.8),0.,1.);vec3 gc=mix(vec3(1.,.84,.35),vec3(1.,.6,.12),k);float a=.75*pow(1.-k,1.6);o=vec4(gc*a,a);}'+
 'if(r<1.){float z=sqrt(max(0.,1.-r*r));vec3 n=vec3(p,z);float ct=cos(tilt),st=sin(tilt),cp=cos(pitch),sp=sin(pitch);'+
 'float x1=n.x*ct+n.y*st,y1=-n.x*st+n.y*ct,y2=y1*cp+n.z*sp,z2=-y1*sp+n.z*cp;float lat=asin(clamp(y2,-1.,1.)),lon=atan(x1,z2);'+
 'vec2 uv=vec2(lon/6.2831853+.5+giro,.5-lat/3.1415927);vec3 c=texture2D(tx,uv).rgb;'+

 'float banda(float r,vec4 b,float w){return b.z<.5?0.:smoothstep(b.x-w,b.x+w,r)*(1.-smoothstep(b.y-w,b.y+w,r));}'+
 'void main(){vec3 n=vec3(-cos(pitch)*sin(tilt),cos(pitch)*cos(tilt),sin(pitch));if(abs(n.z)<.02)discard;'+

 'vec3 c=vec3(0.);float a=0.,k;k=banda(r,b0,w);c+=c0*k;a+=k;k=banda(r,b1,w);c+=c1*k;a+=k;k=banda(r,b2,w);c+=c2*k;a+=k;k=banda(r,b3,w);c+=c3*k;a+=k;'+

    if(!cv._glOuve){cv._glOuve=true;
      cv.addEventListener('webglcontextlost',e=>{e.preventDefault();GLP.gl=null;GLP.perdido=true;});
      cv.addEventListener('webglcontextrestored',()=>{GLP.perdido=false;});}

  t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,TW,TH,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(px.buffer,px.byteOffset,px.byteLength));

const hex3=h=>hex(h).map(v=>v/255);
// lista: [{n, x, y, u, id}] com x, y, u em px do canvas (u = lado da casa); desenha os redondos, os maiores primeiro
function glDesenha(lista,t,L){
  const gl=GLP.gl,cv=GLP.cv;if(!gl)return false;gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);

// ===================== CLÁSSICO NO ESPAÇO =====================
// Liga com ?espaco no endereço (desliga com ?espaco=0); a escolha fica guardada no aparelho.
// Esta etapa troca o tabuleiro do Clássico: peças viram corpos celestes 3D, e bloco, mureta, terra, torrão,
// presa, carrinho, picareta e cores ganham os equivalentes do espaço. O motor é o src/espaco.js (objeto ESP).
(()=>{ const m=location.search.match(/[?&]espaco(?:=(\d))?/); if(m) localStorage.ptui_espaco = m[1]==='0' ? '0' : '1'; })();
function espacoLigado(){ return localStorage.ptui_espaco!=='0'; }
function noEspaco(){ return espacoLigado() && !!(typeof S!=='undefined' && S && (S.missao || S.infinito)); }
// nome do nível no espaço (null fora do Clássico no espaço)
function nomeEspaco(t){ if(!ESP || t<1 || !espFig()) return null; return nomeNivelEsp(t); }
function nomeNivelEsp(t){ const L=ESP.LADDER; return L[Math.max(1,Math.min(t,L.length))-1].n; }
const kNivel = t => t<1 ? 1 : ESP.kDe(nomeNivelEsp(t));
// cor de cada nível (para o disco do buraco negro, que engole o planeta da mesma cor)
const COR_NIVEL=['#d9c49a','#7fdcf0','#ff7a1e','#909cb2','#bfefff','#e9c3a0','#cfd3dc','#c0342a','#e0805a','#f2d08a','#43a0e6','#4f86ec','#9fdde4','#e8c98a','#d9a07a','#ffd84a','#c08aff','#9a77c9'];
const corNivel = t => COR_NIVEL[Math.max(1,Math.min(t,COR_NIVEL.length))-1];

// cada canvas do espaço no tabuleiro fica num conjunto e é redesenhado a cada quadro
const ESPC = new Set();
let espIniciado=false;
function espInicia(){ if(espIniciado) return; espIniciado=true; ESP.buildTextures(); ESP.preaquece(); requestAnimationFrame(espLoop); }
// canvas centrado no elemento, kx por ky casas de tamanho; desenha(ctx, W, H, u, t), u = lado da casa em px do canvas
function espCanvas(host, kx, ky, desenha){
  let cv=host.querySelector(':scope > canvas.esp');
  if(!cv){ cv=document.createElement('canvas'); cv.className='esp'; host.appendChild(cv); }
  cv.style.setProperty('--kx',kx); cv.style.setProperty('--ky',ky); cv._kx=kx; cv._ky=ky; cv._d=desenha; cv._feito=false; cv._estatico=false; cv._passo=0; ESPC.add(cv); espInicia(); return cv;
}
// medidor de desempenho: abra o jogo com ?fps no endereço para ver quadros por segundo e quanto cada parte custa
const MEDE=/[?&]fps\b/.test(location.search);
let custoMedio=0, malhaVez=false, medidor=null, medAc={q:0,ceu:0,malha:0,pecas:0,gl:0,longos:0,t0:0,ult:0};
function mostraMedidor(ms,a,b,c,d){
  const A=medAc; A.q++; A.ceu+=a; A.malha+=b; A.pecas+=c; A.gl+=d; if(A.ult && ms-A.ult>25) A.longos++; A.ult=ms; if(!A.t0) A.t0=ms;
  if(ms-A.t0<1000) return;
  if(!medidor){ medidor=document.createElement('div'); medidor.style.cssText='position:fixed;left:4px;bottom:4px;z-index:99;font:600 11px monospace;color:#9fe9ff;background:rgba(0,0,0,.6);padding:3px 6px;border-radius:6px;pointer-events:none;white-space:pre'; document.body.appendChild(medidor); }
  const f=x=>(x/A.q).toFixed(1);
  medidor.textContent=`${Math.round(A.q*1000/(ms-A.t0))} fps · travadas ${A.longos}\ncéu ${f(A.ceu)} · malha ${f(A.malha)} · peças ${f(A.pecas)} · planetas ${f(A.gl)} ms`;
  medAc={q:0,ceu:0,malha:0,pecas:0,gl:0,longos:0,t0:ms,ult:ms};
}
function espLoop(ms){
  requestAnimationFrame(espLoop);
  const t=ms/1000, ceu=document.body.classList.contains('espaco'), p0=performance.now(); tQuadro=t;
  // cada camada num try: um erro numa delas não pode travar as outras nem deixar o céu num modo de desenho errado
  if(ceu) try{ ceuDesenha(t); }catch(e){ console.warn('céu',e); anotaErro('céu',e); }
  const p1=performance.now();
  // aparelho apertado (quadro passando de 9 ms em média): a malha passa a 30 quadros por segundo
  malhaVez=!malhaVez;
  const telaJogo=$('#scrGame').classList.contains('on');
  if(ceu && (custoMedio<9 || malhaVez) && document.body.classList.contains('modoCla') && telaJogo) try{ malhaQuadro(t); }catch(e){ console.warn('malha',e); anotaErro('malha',e); }
  const p2=performance.now();
  if(ESPC.size){
    const cel=(typeof cellPx==='function'?cellPx():80)*ESP.DPR;
    for(const cv of ESPC){
      if(!cv.isConnected){ ESPC.delete(cv); continue; }
      if(cv._fw && cv.offsetParent===null) continue;   // canvas fixo escondido (tela fechada): não desenha
      if(!cv._fw && !telaJogo) continue;   // peças do tabuleiro com a tela do jogo fechada (o Clássico deixa o tabuleiro montado ao ir ao menu)
      const W=cv._fw ? Math.round(cv._fw*ESP.DPR) : Math.max(8,Math.round(cel*cv._kx)), H=cv._fh ? Math.round(cv._fh*ESP.DPR) : Math.max(8,Math.round(cel*cv._ky));
      if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; cv._feito=false; }
      if(cv._estatico && cv._feito) continue;   // desenho que não muda com o tempo: o anterior continua valendo
      if(cv._passo && cv._feito && t-cv._tq<cv._passo) continue;   // a pedrinha só muda de quadro a cada _passo: até lá o desenho é o mesmo
      const c=cv.getContext('2d'); c.clearRect(0,0,W,H); cv._d(c,W,H,cv._fw?W:cel,t); cv._feito=true; cv._tq=t;
    }
  }
  const p3=performance.now();
  if(ceu && GLON) glQuadro(t);
  const p4=performance.now();
  custoMedio=custoMedio*.95+(p4-p0)*.05;
  if(MEDE) mostraMedidor(ms,p1-p0,p2-p1,p3-p2,p4-p3);
}
// ---------- botão voltar do celular ----------
// fora do menu há sempre uma entrada a mais no histórico (guardaVolta). Voltar: fecha a janela aberta; na lista de
// fases vai ao menu; dentro de uma fase abre o menu de pausa; no menu principal sai do jogo, como qualquer app.
function guardaVolta(){ if(!(history.state&&history.state.ptui)) history.pushState({ptui:1},''); }
addEventListener('popstate',()=>{
  const menu=$('#scrMenu').classList.contains('on');
  if(overlayOpen()){ hideOverlay(); if(!menu) guardaVolta(); return; }
  if(menu) return;
  if(S && S.phase==='lista'){ showMenu(); return; }
  if($('#scrGame').classList.contains('on') && S && S.phase==='mine'){ pauseMenu(); guardaVolta(); return; }
  showMenu();
});

// ---------- planetas redondos pela placa de vídeo (WebGL) ----------
// uma camada só, dentro do tabuleiro (com uma casa de folga em volta para os anéis e o brilho); se o aparelho
// não tiver WebGL, GLON fica falso e cada planeta volta a ser pintado no canvas da sua peça
let GLON=null;
function glCamada(){ let cv=document.getElementById('glPlan'); if(!cv){ cv=document.createElement('canvas'); cv.id='glPlan';
    // a placa de vídeo perdeu ou devolveu o contexto: decide de novo quem desenha os planetas e repinta as peças paradas
    // (sem contexto a camada fica escondida: o canvas perdido pode aparecer como um retângulo branco)
    const refaz=e=>{ GLON=null; cv.style.display=e.type==='webglcontextlost'?'none':''; for(const c of ESPC) c._feito=false; };
    cv.addEventListener('webglcontextlost',refaz); cv.addEventListener('webglcontextrestored',refaz); }
  if(cv.parentElement!==board) board.prepend(cv); return cv; }
function glAtivo(){ if(GLON===null){ espInicia(); GLON = !/[?&]semgl\b/.test(location.search) && ESP.glPronto(glCamada()); } return GLON; }
function glQuadro(t){
  const cv=glCamada(), gr=cv.getBoundingClientRect(); if(!gr.width) return;
  const W=Math.round(gr.width*ESP.DPR), H=Math.round(gr.height*ESP.DPR); if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; }
  const sx=W/gr.width, lista=[];
  for(const el of board.querySelectorAll('.tile')){ if(!el._gl||!el._t) continue; const fr=el.firstChild.getBoundingClientRect(); if(!fr.width) continue;
    lista.push({n:nomeNivelEsp(el._t.t), x:(fr.left+fr.width/2-gr.left)*sx, y:(fr.top+fr.height/2-gr.top)*sx, u:fr.width*sx, id:el.dataset.id||'x'}); }
  ESP.glDesenha(lista,t,ESP.ST.L);
}
// recorta o disco do planeta (desenhado embaixo, pela placa de vídeo) do que está no canvas da peça
function furaPlaneta(c,x,y,u,T){ const R=u*kNivel(T.t)*ESP.byName(nomeNivelEsp(T.t)).sp.rScale/2; c.save(); c.globalCompositeOperation='destination-out'; c.beginPath(); c.arc(x,y,R,0,7); c.fill(); c.restore(); }

// ícone do planeta no meio do texto (uma foto parada, guardada depois da primeira vez)
const ICO_PL={};
function icoPlaneta(t){ if(ICO_PL[t]) return ICO_PL[t]; espInicia(); return ICO_PL[t]=`<img class="ico" alt="" src="${ESP.pecaImg(nomeNivelEsp(t),0,96).toDataURL()}">`; }

// ---------- peças ----------
function espAura(c,x,y,u,t,cor){
  if(cor!==2){ ESP.SPR.aura(c,x,y,u,t,cor); return; }
  for(const [k,x0] of [[0,0],[1,x]]){ c.save(); c.beginPath(); c.rect(x0,0,x,c.canvas.height); c.clip(); ESP.SPR.aura(c,x,y,u,t,k); c.restore(); }
}
// brilho na cor do nível atrás das peças pequenas (até Plutão), para elas não sumirem no tabuleiro
function espBrilho(c,x,y,u,t){ const cor=corNivel(t), g=c.createRadialGradient(x,y,0,x,y,u*.46);
  g.addColorStop(0,cor+'70'); g.addColorStop(.55,cor+'26'); g.addColorStop(1,cor+'00'); c.fillStyle=g; c.beginPath(); c.arc(x,y,u*.46,0,7); c.fill(); }
const temBrilho = T => T.t>=1 && T.t<=6 && T.k!=='p' && T.c==null;
function espTile(el,t){
  el._t=t;
  const key=[t.t,t.c,t.k,t.presa?1:0].join(':'); if(el.dataset.ek===key) return; el.dataset.ek=key;
  const f=el.firstChild; f.querySelectorAll('svg').forEach(s=>s.remove());
  const k = t.t===0||t.k==='p' ? 1 : kNivel(t.t), kk = Math.max(1.15, k + (t.c!=null ? .1 : 0));
  el.style.zIndex = String(10 + Math.round((2 - Math.min(2,k))*10));   // os pequenos ficam por cima dos anéis dos grandes
  espCanvas(f, kk, kk, (c,W,H,u,tm)=>{ const T=el._t, x=W/2, y=H/2;
    // planeta redondo: vai pela placa de vídeo (camada embaixo); aqui só a aura e a gaiola, com o disco do planeta recortado
    const redondo = T.t>0 && T.k!=='p' && ESP.byName(nomeNivelEsp(T.t)).kind==='sphere' && glAtivo();
    el._gl = redondo; c.canvas._estatico = redondo && T.c==null && !T.presa;   // só o brilho parado: não precisa redesenhar
    if(redondo){ if(temBrilho(T)) espBrilho(c,x,y,u,T.t); if(T.c!=null) espAura(c,x,y,u,tm,T.c); if(T.presa) ESP.SPR.gaiola(c,x,y,u,tm,'back'); if(T.c!=null||T.presa||temBrilho(T)) furaPlaneta(c,x,y,u,T); if(T.presa) ESP.SPR.gaiola(c,x,y,u,tm,'front'); return; }
    // só a pedrinha (sem aura, gaiola, lixo ou buraco): ela troca de quadro a 20 por segundo, o canvas acompanha
    c.canvas._passo = T.c==null && !T.presa && T.t>0 && T.k!=='p' ? ESP.PASSO_VAR : 0;
    if(temBrilho(T)) espBrilho(c,x,y,u,T.t);
    if(T.c!=null) espAura(c,x,y,u,tm,T.c);
    if(T.presa) ESP.SPR.gaiola(c,x,y,u,tm,'back');
    if(T.t===0) ESP.SPR.lixo(c,x,y,u*.86,tm);
    else if(T.k==='p') ESP.SPR.buraco(c,x,y,u,tm,corNivel(T.t));
    else ESP.drawPecaVar(c,nomeNivelEsp(T.t),tm,x,y,u,el.dataset.id||'x');
    if(T.presa) ESP.SPR.gaiola(c,x,y,u,tm,'front'); });
}

// marcas do Clássico: casa marcada, casa de terra, carrinho
function espMarca(el,tipo,a){
  if(tipo==='alvo'){ const k=Math.max(1.1,kNivel(a.t)); espCanvas(el,k,k,(c,W,H,u,tm)=>{
      if(el.classList.contains('ok')){ c.save(); c.strokeStyle='#8fe3a0'; c.lineWidth=u*.035; c.shadowColor='#8fe3a0'; c.shadowBlur=u*.08; c.beginPath(); c.arc(W/2,H/2,u*.42,0,7); c.stroke(); c.restore(); }
      else ESP.SPR.alvo(c,W/2,H/2,u,tm,nomeNivelEsp(a.t)); }); }
  else if(tipo==='terra') espCanvas(el,1,1,(c,W,H,u,tm)=>ESP.SPR.neb(c,W/2,H/2,u,tm,(a.x*3+a.y)||0));
  else if(tipo==='carro') espCanvas(el,1.3,1.3,(c,W,H,u,tm)=>ESP.SPR.nave(c,W/2,H/2,u,tm,nomeNivelEsp(S.carro?S.carro.t:a.t)));
}

// ---------- o céu atrás de tudo ----------
// Fundo vivo (aprovado nos rascunhos fundo.html e malha.html em 2026-11-09):
// - a nebulosa se mexe, desenhada pela placa de vídeo nas duas cores do mundo (sem WebGL, volta o céu pintado);
// - estrelas e o planeta do mundo ficam em camadas que andam com a câmera: ela flutua e dá um tranco a cada arrasto;
// - de tempos em tempos passa algo ao longe (cometa, satélite, chuva de meteoros, nave);
// - cada junção acende uma névoa na cor do planeta formado; o anel só vem quando nasce o maior planeta da partida.
let ceu=null, ceuF=null, ceuChave='', ceuT=0, tQuadro=0, nebT=-1;   // tQuadro: hora do último quadro (o mesmo relógio das animações)
const MARGEM_CEU=26, camE={x:0,y:0,vx:0,vy:0};
let brilhosE=[], aneisE=[], passE=[], proxPass=6, passI=0;
const NEB=(()=>{
  const cv=document.createElement('canvas'); cv.id='neb';
  const gl=!/[?&]semgl\b/.test(location.search) && cv.getContext('webgl',{antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:true});
  if(!gl) return {ok:false};
  try{
    const fs=`precision mediump float;
    uniform vec2 res,off,pp;uniform float t,pu;uniform vec3 c1,c2,pc;
    float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){v+=a*n(p);p=m*p;a*=.5;}return v;}
    void main(){vec2 su=(gl_FragCoord.xy-.5*res)/res.y,uv=su+off,p=uv*1.7;
      vec2 q=vec2(fbm(p+vec2(0.,t*.03)),fbm(p+vec2(5.2,1.3)-vec2(t*.02,0.)));
      vec2 r=vec2(fbm(p+3.*q+vec2(1.7,9.2)+t*.04),fbm(p+3.*q+vec2(8.3,2.8)-t*.035));
      float f=fbm(p+2.6*r),faixa=.35+.65*exp(-pow((uv.x*.7+uv.y*.75)/.55,2.)),neb=smoothstep(.25,.8,f)*faixa;
      vec3 col=vec3(.043,.039,.094);
      col=mix(col,c1*.85,neb*.9);
      col=mix(col,c2*.95,clamp(length(r)-.5,0.,1.)*neb);
      float poe=smoothstep(.48,.78,fbm(p*2.3+q*1.5-t*.01));col*=1.-.45*poe*(1.-neb*.5);
      col+=c2*.35*pow(neb,3.);
      float d=length(su-pp);col+=pc*pu*(.5*exp(-d*3.5)+.07);
      gl_FragColor=vec4(col,1.);}`;
    const U={};
    // compila o programa e prepara o retângulo (de novo quando a placa de vídeo devolve um contexto perdido)
    const prepara=()=>{
      const sh=(tp,src)=>{ const s=gl.createShader(tp); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
      const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}')); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(pr); gl.useProgram(pr);
      const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const lp=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
      for(const k of ['res','off','pp','t','pu','c1','c2','pc']) U[k]=gl.getUniformLocation(pr,k);
      gl.viewport(0,0,cv.width,cv.height); };
    prepara();
    const v=s=>s.split(',').map(x=>x/255);
    // desenha a nebulosa (em meia resolução) na camada própria, de w por h; off = deslocamento da câmera; pul = névoa da junção
    const N={ok:true, desenha(w,h,t,off,neb,pul){ if(!cv.isConnected) document.body.prepend(cv);
      const W=Math.max(8,Math.round(w*.5)), H=Math.max(8,Math.round(h*.5)); if(cv.width!==W||cv.height!==H){ cv.width=W; cv.height=H; gl.viewport(0,0,W,H); }
      gl.uniform2f(U.res,W,H); gl.uniform1f(U.t,t); gl.uniform2f(U.off,-off[0]/h,off[1]/h); gl.uniform3fv(U.c1,v(neb[0])); gl.uniform3fv(U.c2,v(neb[1]));
      gl.uniform1f(U.pu,pul?pul.k:0); gl.uniform3fv(U.pc,pul?v(pul.rgb):[0,0,0]); gl.uniform2f(U.pp,pul?(pul.x-w/2)/h:0,pul?(h/2-pul.y)/h:0);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }};
    // contexto perdido (no Android acontece ao voltar do segundo plano): volta o céu pintado até o contexto voltar
    cv.addEventListener('webglcontextlost',e=>{ e.preventDefault(); N.ok=false; });
    cv.addEventListener('webglcontextrestored',()=>{ try{ prepara(); N.ok=true; }catch(e){ console.warn('nebulosa',e); } });
    return N;
  }catch(e){ console.warn('nebulosa',e); return {ok:false}; }
})();
function ceuDesenha(t){
  if(!ceu){ ceu=document.createElement('canvas'); ceu.id='ceu'; document.body.prepend(ceu); }
  // no menu, céu sem planeta de fundo: os planetas aparecem conforme a pessoa descobre (em volta do nome)
  const menu=!!document.getElementById('scrMenu')?.classList.contains('on'), jogo=!menu && !!(S&&(S.missao||S.infinito)&&S.phase!=='lista');
  const w=innerWidth, h=innerHeight, tema=Math.max(1,(S&&S.missao&&S.tema)||1), mu=ESP.MUNDOS_ESP[(tema-1)%ESP.MUNDOS_ESP.length], M=MARGEM_CEU;
  const chave=w+'x'+h+':'+tema+(menu?':menu':'')+(NEB.ok?':viva':'');
  if(chave!==ceuChave){ ceuChave=chave; ceu.width=w; ceu.height=h; ceuF=ESP.buildFundo(w+2*M,h+2*M,mu,{jogo:true,planeta:!menu,semNebulosa:NEB.ok}); }
  const dt=Math.min(.05,Math.max(0,t-ceuT)); ceuT=t;
  camE.vx+=(-camE.x*32-camE.vx*7)*dt; camE.vy+=(-camE.y*32-camE.vy*7)*dt; camE.x+=camE.vx*dt; camE.y+=camE.vy*dt;
  const cx=camE.x+Math.sin(t*.21)*7, cy=camE.y+Math.cos(t*.17)*6, c=ceu.getContext('2d');
  c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation='source-over'; c.globalAlpha=1;
  // a névoa mais forte do momento (junção ou recorde)
  let pul=null; for(const j of brilhosE){ const u=(t-j.t0)/1.1; if(u<1){ const k=(1-u)*(j.forte?.9:.45); if(!pul||k>pul.k) pul={k,x:j.x,y:j.y,rgb:j.rgb}; } }
  if(NEB.ok && (t-nebT>=1/30 || pul)){ nebT=t; NEB.desenha(w,h,t,[cx*.12,cy*.12],mu.neb,pul); }   // a nebulosa anda devagar: 30 quadros por segundo bastam
  c.clearRect(0,0,w,h);
  c.save(); c.translate(-M+cx*.3,-M+cy*.3); ESP.drawFundo(c,ceuF,t); c.restore();
  if(jogo){ if(t>proxPass) novaPassagem(t,w,h); passagens(c,t,cx*.35,cy*.35); }
  c.save(); c.globalCompositeOperation='lighter';
  for(const j of aneisE){ const u=(t-j.t0)/1.6; if(u<0||u>1) continue; const R=Math.max(0,j.v*(t-j.t0)); c.lineWidth=6*(1-u)+1; c.strokeStyle=`rgba(${j.rgb},${(.22*(1-u)).toFixed(3)})`; c.beginPath(); c.arc(j.x,j.y,R,0,7); c.stroke(); }
  c.restore();
  brilhosE=brilhosE.filter(j=>t-j.t0<1.2); aneisE=aneisE.filter(j=>t-j.t0<1.7);
}
// passagens ao longe: cometa, satélite piscando, chuva de meteoros e nave (uma por vez, a cada 6 a 10 s)
function novaPassagem(t,W,H){ const tipo=['cometa','satelite','chuva','nave'][passI++%4], r=Math.random;
  if(tipo==='cometa') passE.push({tipo,t0:t,dur:7,a:[W*1.15,H*(.06+.16*r())],b:[-W*.15,H*(.22+.2*r())]});
  if(tipo==='satelite') passE.push({tipo,t0:t,dur:14,a:[-W*.05,H*(.1+.3*r())],b:[W*1.05,H*(.05+.2*r())]});
  if(tipo==='chuva') passE.push({tipo,t0:t,dur:2.6,st:Array.from({length:7},(_,i)=>({d:i*.3+r()*.15,x:W*(.25+.75*r()),y:H*(.02+.3*r())}))});
  if(tipo==='nave') passE.push({tipo,t0:t,dur:9,a:[W*1.06,H*(.6+.15*r())],b:[-W*.06,H*(.45+.1*r())]});
  proxPass=t+6+4*r(); }
function passagens(c,t,ox,oy){ c.save(); c.translate(ox,oy); c.globalCompositeOperation='lighter'; const TAU=7;
  for(const e of passE){ const u=(t-e.t0)/e.dur; if(u<0||u>1) continue;
    if(e.tipo==='cometa'){ const x=e.a[0]+(e.b[0]-e.a[0])*u, y=e.a[1]+(e.b[1]-e.a[1])*u-Math.sin(u*Math.PI)*ceu.height*.04, vx=e.b[0]-e.a[0], vy=e.b[1]-e.a[1], L=Math.hypot(vx,vy), tx=-vx/L, ty=-vy/L, cl=150;
      for(const [w,a] of [[12,.1],[3,.6]]){ const g=c.createLinearGradient(x,y,x+tx*cl,y+ty*cl); g.addColorStop(0,`rgba(190,240,255,${a})`); g.addColorStop(1,'rgba(190,240,255,0)');
        c.strokeStyle=g; c.lineWidth=w; c.lineCap='round'; c.beginPath(); c.moveTo(x,y); c.lineTo(x+tx*cl,y+ty*cl); c.stroke(); }
      const g=c.createRadialGradient(x,y,0,x,y,9); g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(1,'rgba(160,230,255,0)'); c.fillStyle=g; c.beginPath(); c.arc(x,y,9,0,TAU); c.fill(); }
    if(e.tipo==='satelite'){ const x=e.a[0]+(e.b[0]-e.a[0])*u, y=e.a[1]+(e.b[1]-e.a[1])*u; c.fillStyle='rgba(235,240,255,.85)'; c.beginPath(); c.arc(x,y,1.3,0,TAU); c.fill();
      if((t*.9)%1<.12){ const g=c.createRadialGradient(x,y,0,x,y,5); g.addColorStop(0,'rgba(255,90,90,.95)'); g.addColorStop(1,'rgba(255,90,90,0)'); c.fillStyle=g; c.beginPath(); c.arc(x,y,5,0,TAU); c.fill(); } }
    if(e.tipo==='chuva') for(const s of e.st){ const v=(t-e.t0-s.d)/.45; if(v<0||v>1) continue; const L=95, x=s.x-.75*L*v*1.6, y=s.y+.55*L*v*1.6, g=c.createLinearGradient(x,y,x+.75*L,y-.55*L);
      g.addColorStop(0,`rgba(255,255,255,${(.9*(1-v)).toFixed(2)})`); g.addColorStop(1,'rgba(255,255,255,0)'); c.strokeStyle=g; c.lineWidth=1.6; c.beginPath(); c.moveTo(x,y); c.lineTo(x+.75*L,y-.55*L); c.stroke(); }
    if(e.tipo==='nave'){ const x=e.a[0]+(e.b[0]-e.a[0])*u, y=e.a[1]+(e.b[1]-e.a[1])*u+Math.sin(t*2)*2, fl=.7+.3*Math.sin(t*31);
      const g=c.createRadialGradient(x+7,y,0,x+7,y,10*fl); g.addColorStop(0,'rgba(120,230,255,.9)'); g.addColorStop(1,'rgba(120,230,255,0)'); c.fillStyle=g; c.beginPath(); c.arc(x+7,y,10*fl,0,TAU); c.fill();
      c.globalCompositeOperation='source-over'; c.fillStyle='rgba(220,226,245,.95)'; c.beginPath(); c.moveTo(x-6,y); c.lineTo(x+5,y-3.4); c.lineTo(x+3,y); c.lineTo(x+5,y+3.4); c.closePath(); c.fill(); c.globalCompositeOperation='lighter'; } }
  c.restore(); passE=passE.filter(e=>t-e.t0<e.dur); }

// ---------- a malha da gravidade (dentro do tabuleiro, atrás das peças) ----------
// Rede na cor do mundo, com molinhas entre os pontos. Cada planeta afunda a rede conforme o peso (a Poeira quase nada,
// a Terra bastante, os gigantes entortam o tabuleiro) e o fundo do poço fica escuro. Cada junção faz a rede tremer de
// leve; quando nasce o maior planeta da partida, uma onda atravessa a rede toda.
const MSUB=4, MBORDA=1, massaE=t=>.12+(t/10)**2;   // MBORDA: quantas casas a malha passa para fora do tabuleiro, sumindo
let malhaCv=null, MN=null, ondasM=[], tremM=[];
function malhaCamada(){ if(!malhaCv){ malhaCv=document.createElement('canvas'); malhaCv.id='malhaCv'; } if(malhaCv.parentElement!==board) board.prepend(malhaCv); return malhaCv; }
// geometria em px do canvas da malha: D = densidade (no máximo 2: linha fina não precisa de mais), P = passo entre casas,
// g0 = onde começa a primeira linha dentro do tabuleiro, O = margem do canvas (uma casa para cada lado do tabuleiro)
function geoTab(){ const r=board.getBoundingClientRect(), D=Math.min(2,ESP.DPR), cel=(typeof cellPx==='function'?cellPx():80), gap=(r.width-W*cel)/(W+1);
  return {r, D, P:(cel+gap)*D, g0:gap*D/2, O:cel*D, cel}; }
const casaOk=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!(S.walls||[]).some(w=>w.v&&w.x===x&&w.y===y);
function campoM(px,py,t,pocos,pa){ let dx=0,dy=0,h=0;
  for(const q of pocos){ const ex=px-q.x, ey=py-q.y, d2=ex*ex+ey*ey, sg=pa*(.32+.13*q.m); if(d2>sg*sg*16) continue;
    const d=Math.sqrt(d2)||1, A=Math.min(pa*.12*q.m,sg*.55), f=A*(d/sg)*Math.exp(.5-d2/(2*sg*sg));
    dx-=ex/d*f; dy-=ey/d*f; h+=q.m*Math.exp(-d2/(2*(sg*1.15)**2)); }
  let w=0;
  for(const o of ondasM){ const ex=px-o.x, ey=py-o.y, d=Math.hypot(ex,ey)||1, u=(d-pa*3.4*(t-o.t0))/(pa*.45), amp=o.a*Math.exp(-(t-o.t0)*1.1)*Math.exp(-u*u)*Math.sin(u*2.4);
    dx+=ex/d*amp; dy+=ey/d*amp; w+=Math.abs(amp)/pa; }
  for(const o of tremM){ const ex=px-o.x, ey=py-o.y, d=Math.hypot(ex,ey)||1, u=(d-pa*2.2*(t-o.t0))/(pa*.3), amp=o.a*Math.exp(-(t-o.t0)*3)*Math.exp(-u*u)*Math.sin(u*2.4);
    dx+=ex/d*amp; dy+=ey/d*amp; }
  const L=Math.hypot(dx,dy), cap=pa*.42; if(L>cap){ dx*=cap/L; dy*=cap/L; }
  return [dx,dy,h,w]; }
// quanto cada ponto da rede aparece: forte no meio do tabuleiro, mais fraco perto da borda, e sumindo aos poucos
// fora dele (e nas casas vazias do formato), para a malha se misturar ao céu
function presencaM(ci,cj,ok){
  let fora=9; for(const [x,y] of ok){ const ex=Math.max(x-ci,0,ci-(x+1)), ey=Math.max(y-cj,0,cj-(y+1)); fora=Math.min(fora,Math.hypot(ex,ey)); }
  if(fora>0) return .5*Math.max(0,1-fora/.9)**1.6;
  let dentro=Math.min(ci,W-ci,cj,H-cj);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(!casaOk(x,y)){ const ex=Math.max(x-ci,0,ci-(x+1)), ey=Math.max(y-cj,0,cj-(y+1)); dentro=Math.min(dentro,Math.hypot(ex,ey)); }
  return .5+.5*Math.min(1,dentro/1.1);
}
