<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Ptui! · propostas de progressão do Clássico</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#f6ecd9;font-family:'Fredoka',system-ui,sans-serif;color:#5a4636;line-height:1.4}
main{max-width:760px;margin:0 auto;padding:18px 14px 60px;display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;color:#7a5a44;line-height:1.1}
h2{font-size:21px;color:#7a5a44;margin-top:6px}
h3{font-size:17px;color:#7a5a44}
p,li{font-size:15px}
.sub{color:#a08a74;font-size:15px}
ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{background:#efe1c6;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 #dcc6a0;display:flex;gap:10px;align-items:flex-start}
.card svg.fig{flex:none;width:52px;height:52px;overflow:visible}
.card b{display:block;font-size:15px}
.card span{display:block;font-size:13px;color:#7a5a44;line-height:1.3}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;margin-top:4px;color:#fff}
.tag.ja{background:#6aa84f}.tag.novo{background:#c48a1e}.tag.facil{background:#6d93a8}
.prog{background:#fff8ea;border-radius:18px;padding:14px;box-shadow:0 4px 0 #e2cfae;display:flex;flex-direction:column;gap:10px}
.prog.rec{box-shadow:0 4px 0 #c48a1e,0 0 0 3px #f2b33d}
.trilha{display:flex;flex-wrap:wrap;gap:6px}
.mundo{background:#efe1c6;border-radius:12px;padding:6px 9px;font-size:13px;line-height:1.2;min-width:100px;flex:1}
.mundo b{display:block;font-size:14px}
.mundo i{font-style:normal;color:#a08a74;font-size:12px}
.mundo.novo{box-shadow:inset 0 0 0 2px #c48a1e}
.pros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pros div{background:#efe1c6;border-radius:12px;padding:8px 10px;font-size:14px}
.pros b{display:block;font-size:13px;color:#a08a74}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid #e2cfae;vertical-align:top}
th{color:#a08a74;font-weight:600}
td.n{font-weight:700;color:#7a5a44;white-space:nowrap}
.longa,tr.hoje{background:#fff3cf}
.ico{display:inline-block;width:20px;height:20px;vertical-align:-5px;overflow:visible}
details{background:#efe1c6;border-radius:14px;padding:0 12px}
details summary{font-weight:700;font-size:16px;padding:10px 0;cursor:pointer;color:#7a5a44}
details > div{padding-bottom:12px;overflow-x:auto}
</style>
</head>

<main id="m"></main>
<script src="src/svg.js"></script>

  <section><h2>Até onde dá para subir</h2>
    <p>Medi com um robô que joga como quem pegou o jeito do 2048 (segura a maior no canto e as fileiras em ordem), sem limite de arrastos, até travar. O jogo nasce Cascalho (2) em 90% das vezes e Pedra (4) em 10%, igual ao 2048.</p>
    <details open style="margin-top:8px"><summary>Arrastos até a primeira de cada pedrinha</summary><div><table><tr><th>Pedrinha</th><th>3x3</th><th>4x4</th><th>5x5</th><th>mínimo</th></tr>${SUB.map(subRow).join('')}</table></div></details>
    <ul style="margin-top:8px">
      <li><b>Hoje as missões ficam no começo</b> (fundo amarelo): vão até o Geodo, que é o arrasto ~20 de uma partida que no 4x4 dura uns 770.</li>
      <li><b>Cada pedrinha nova pede o dobro de arrastos.</b> O Rubi real (o 2048) fica perto de 1.000.</li>
      <li><b>O tamanho do tabuleiro é um teto.</b> O 3x3 trava por volta do Geodo real, o 4x4 vai até a Esmeralda viva (às vezes o Rubi real) e o 5x5 chega no Meteorito e na Estrela.</li>
    </ul>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px"><h2>Progressões só de subida</h2>
    <p class="sub">Mais simples que as de baixo: olham só para chegar mais alto. Dá para usar sozinhas ou junto com uma das três progressões por mundos.</p>
    ${SUBIDAS.map(p=>`<div class="prog"><h3>${p.nome}</h3><p>${p.desc}</p><div class="pros"><div><b>A favor</b>${p.pros}</div><div><b>Contra</b>${p.contra}</div></div></div>`).join('')}
  </section>
  <section><h2>As peças para montar fases</h2>
    <h3 style="margin:8px 0 6px">Tipos de missão</h3><div class="grade">${MISS.map(m=>card(...m)).join('')}</div>
    <h3 style="margin:14px 0 6px">Coisas no mapa (não mudam o jeito de arrastar)</h3><div class="grade">${MAPA.map(m=>card(...m)).join('')}</div>
    <h3 style="margin:14px 0 6px">Regras que mudam o jogo (usar com calma)</h3><div class="grade">${REGRA.map(m=>card(...m)).join('')}</div>
  </section>
  <section style="display:flex;flex-direction:column;gap:12px"><h2>Três progressões</h2>
    ${PROGS.map(p=>`<div class="prog ${p.rec?'rec':''}"><h3>${p.nome}${p.rec?' · minha recomendação':''}</h3><p>${p.desc}</p>
      <div class="trilha">${p.trilha.join('')}</div>
      <div class="pros"><div><b>A favor</b>${p.pros.join('<br>')}</div><div><b>Contra</b>${p.contra.join('<br>')}</div></div></div>`).join('')}
    <p class="sub">Contorno dourado nos mundos: é onde entra algo novo.</p>
  </section>
  <section><h2>Minha recomendação</h2>
    <p>A <b>1 · Pela mina, devagar</b>, somada a três ideias de subida: <b>B</b> (cada mundo fecha uma pedrinha acima do anterior, do Cristalino até a Estrela), <b>C</b> (a partir do mundo 4 nascem pedrinhas maiores, então as fases do meio já pedem Pedra lunar, Âmbar e Esmeralda viva sem ficar enormes) e <b>E</b> (uma Expedição sem fim em cada mundo, para quem quer o 2048 de verdade). Da progressão 3 vem o Passinho como medalha: dá para jogar de novo qualquer fase já cumprida no Passinho, e ele só vira regra obrigatória no último mundo.</p>
    <ul style="margin-top:6px">
      <li>As metas sobem junto com os mundos: o mundo 1 vai da Rocha ao Cristalino; o mundo 8 já pede do Âmbar à Estrela.</li>
      <li>Dois mundos inteiros só com mapa (blocos, formatos, muretas) antes de qualquer regra nova.</li>
      <li>Missões novas entram junto com o mapa que pede por elas: a terra no mundo 4, o carrinho no 5.</li>
      <li>Cada mundo tem 3 fases longas no fim, a última com várias metas juntas.</li>
      <li>Uma fase de quebra-cabeça por mundo, montada no editor, para quebrar o ritmo.</li>
    </ul>
  </section>
  <section style="display:flex;flex-direction:column;gap:8px"><h2>Como ficariam os dois primeiros mundos</h2>
    <details open><summary>Mundo 1 · Entrada (12 fases)</summary><div><table><tr><th>Fase</th><th>Nome e mapa</th><th>Missão</th><th>Arrastos</th></tr>${M1.join('')}</table></div></details>
    <details><summary>Mundo 2 · Blocos (12 fases)</summary><div><table><tr><th>Fase</th><th>Nome e mapa</th><th>Missão</th><th>Arrastos</th></tr>${M2.join('')}</table></div></details>
    <p class="sub">Fundo amarelo: fases longas, que fecham o mundo. Os arrastos são um chute; a calibração com o robô acerta depois.</p>
  </section>
  <section><h2>O que precisa de código novo</h2><ul>
    <li><b>Para subir alto</b>: salvar a fase no meio e continuar depois (fases de centenas de arrastos), nascer pedrinha maior por mundo, e uma coleção das pedrinhas já descobertas, para dar vontade de chegar na próxima.</li>
    <li><b>Fácil</b>: missões em sequência, metas juntas, juntar duas de uma vez, restrição, e fases montadas à mão (o editor já faz).</li>
    <li><b>Médio</b>: casa marcada, casa de terra e pedrinha presa (cada uma é uma camada nova no chão ou na peça).</li>
    <li><b>Maior</b>: o carrinho (saída na borda que recolhe a pedrinha), o mapa que se divide da proposta 3 e o Passinho como medalha.</li>
  </ul></section>`;
</script>
</body>
