<!-- tempo: 60000 -->
<meta charset="utf-8">
<body style="margin:0"><iframe id="f" src="../index.html" width="390" height="760" style="border:0"></iframe><pre id="out" style="position:absolute;left:400px;top:0">x</pre>
<script>
// Clássico: menu, lista, abertura, painel (arrastos, silhuetas, pontos), etiquetas, cumprir a missão, perder,
// recomeçar, próxima fase liberada, sair pela pausa e espaçamento do painel.
const MODE=location.hash.slice(1)||'test';
f.onload=async()=>{const w=f.contentWindow,d=w.document,errs=[],log=[];w.addEventListener('error',e=>errs.push(e.message+' @'+e.lineno));w.addEventListener('unhandledrejection',e=>errs.push('rej '+e.reason));
 const wait=ms=>new Promise(r=>setTimeout(r,ms)); const q=s=>d.querySelector(s);
 const joga=async()=>{ // robô guloso até a fase acabar
   for(let i=0;i<60 && w.eval('S.phase')==='mine';i++){
     const dir=w.eval(`(()=>{ let b=null,bs=-1; for(const [dx,dy] of [[0,1],[-1,0],[1,0],[0,-1]]){ const r=slide(S.tiles,dx,dy); if(!r.moved) continue; const s=r.merges.reduce((a,o)=>a+Math.pow(2,o.t),0)+r.breaks.length*20+Math.random(); if(s>bs){bs=s;b=[dx,dy];} } return b; })()`);
     if(!dir) break; w.eval(`move(${dir[0]},${dir[1]})`); await wait(30);
   }
   for(let i=0;i<20 && !w.eval('overlayOpen()');i++) await wait(150);
 };
 try{ w.eval('sound=false; music=false; localStorage.removeItem("mina_missoes")');
  log.push('menu: '+[...d.querySelectorAll('.menuBtns > button, .menuBtns .labRow button')].map(b=>b.firstChild.textContent.trim()).join(' | '));
  q('#mCla').click(); await wait(100);
  log.push(`lista: grupos=${d.querySelectorAll('.mGrupo').length} fases=${d.querySelectorAll('.mNo').length} travadas=${d.querySelectorAll('.mNo.trava').length} atual=${q('.mNo.atual')?.dataset.m}`);
  q('[data-m="1"]').click(); await wait(50);
  log.push('abertura: '+q('#panel h2').textContent+' · '+(q('.objetivo')||q('.ent .meta')||q('.ent .metasL')).textContent.replace(/\s+/g,' ').trim()+' · '+(q('#panel .metas')||q('.ent .estr3')).textContent.replace(/\s+/g,' ').trim());
  if(MODE==='abertura'){ out.textContent='ok'; return; }
  q('#mJoga').click(); await wait(500);
  const vis=s=>w.getComputedStyle(q(s)).display!=='none';
  log.push(`painel: clássico=${vis('.hudCla')} mineração=${vis('.hud:not(.hudCla)')} arrastos=${q('#cArr').textContent} silhuetas=${d.querySelectorAll('#cMis .fila span').length} pontos=${q('#cPts').textContent} botão=${q('#btnEnd').textContent}`);
  log.push(`etiquetas=${d.querySelectorAll('.tile .etq').length} pedrinhas=${w.eval('S.tiles.filter(t=>t.t>0).length')} texto=${q('.tile .etq')?.textContent}`);
  // espaço entre as partes do painel: igual na horizontal e na vertical
  const R=s=>q(s).getBoundingClientRect(), p1=d.querySelectorAll('.hudCla .pill');
  log.push(`espaços: entre quadros=${Math.round(p1[1].getBoundingClientRect().left-p1[0].getBoundingClientRect().right)} quadros-letreiro=${Math.round(R('.top').top-R('.hudCla').bottom)} letreiro-tabuleiro=${Math.round(R('#board').top-R('.top').bottom)}`);
  if(MODE==='jogando'){ out.textContent='ok'; return; }
  await joga();
  log.push(`fim: arrastos usados=${w.eval('S.moves')} sobraram=${w.eval('S.energy')} pontos=${w.eval('S.pontos')} painel=${q('#panel h2')?.textContent} estrelas=${d.querySelectorAll('#panel .estr.grande i.on').length} salvo=${w.eval('localStorage.mina_missoes')}`);
  if(MODE==='resultado'){ out.textContent='ok'; return; }
  // perder: fase 2 com 1 arrasto e um arrasto que não junta nada
  w.eval('missaoJoga(2); S.energy=1; render()'); await wait(50);
  const dir=w.eval(`[[0,1],[-1,0],[1,0],[0,-1]].find(([dx,dy])=>{ const r=slide(S.tiles,dx,dy); return r.moved && !r.merges.length; })`);
  if(dir){ w.eval(`move(${dir[0]},${dir[1]})`); for(let i=0;i<20 && !w.eval('overlayOpen()');i++) await wait(150);
    log.push('perdeu: '+q('#panel h2').textContent+' | '+[...d.querySelectorAll('#panel p')].map(p=>p.textContent).join(' ')); }
  // recomeçar
  q('#mDeNovo').click(); await wait(80); w.eval('move(1,0); move(0,1)'); await wait(50); const antes=w.eval('S.moves');
  q('#btnEnd').click(); await wait(80); log.push(`recomeçar: arrastos antes=${antes} depois=${w.eval('S.moves')}`);
  // lista: fase 2 liberada; pausa durante a fase volta para a lista
  w.eval('pauseMenu()'); await wait(30); q('#pExit').click(); await wait(80);
  log.push(`lista depois: travadas=${d.querySelectorAll('.mNo.trava').length} atual=${q('.mNo.atual')?.dataset.m} banner=${q('#bSub').textContent}`);
  // na lista o botão do canto volta direto ao menu (sem a janela de pausa)
  w.eval('pauseMenu()'); await wait(50); log.push('menu='+q('#scrMenu').classList.contains('on')+' save mineração='+!!w.eval('localStorage.mina_save'));
  // migração da Jornada 2 (12 fases por mundo) para a 3 (8): progresso de exemplo gravado como na versão 2, o jogo
  // aberto de novo num iframe novo (a migração roda ao carregar) e onde a pessoa fica
  const migra=async(ate, salva, partidas)=>{
    const v2={}; for(let n=1;n<=ate;n++) v2[n]={e:2,t:100+n};
    w.localStorage.ptui_jornada='2'; w.localStorage.mina_missoes=JSON.stringify(v2);
    if(salva) w.localStorage.mina_cla_save=JSON.stringify({n:salva,pass:false,st:{}}); else w.localStorage.removeItem('mina_cla_save');
    if(partidas) w.localStorage.ptui_partidas=JSON.stringify(partidas); else w.localStorage.removeItem('ptui_partidas');
    const g=document.createElement('iframe'); g.width=390; g.height=760; g.style.cssText='position:absolute;left:0;top:0;border:0';
    const pronto=new Promise(r=>g.onload=r); g.src='../index.html'; document.body.appendChild(g); await pronto; await wait(100);
    const v=g.contentWindow, r=JSON.parse(v.localStorage.mina_missoes), tot=v.eval('MISSOES.length'), lib=[];
    for(let n=1;n<=tot;n++) if(v.eval(`liberada(${n})`)) lib.push(n);
    const res={versao:v.localStorage.ptui_jornada, vencidas:Object.keys(r).map(Number), estrelas:Object.values(r).map(x=>x.e).join(''), atual:v.eval('faseAtual()'),
      liberadas:lib.length, ultimaLiberada:lib[lib.length-1], salva:JSON.parse(v.localStorage.mina_cla_save||'null')?.n??null,
      partidas:v.localStorage.ptui_partidas||null, copia:!!v.localStorage.mina_missoes_v2};
    g.remove(); return res; };
  const seq=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i).join(',');
  { const m=await migra(22, 22, [[22,1,30,5,0,'2026-11-09'],[2,1,10,3,0,'2026-11-09']]);   // a 22 (Salão de estações) continuou igual, agora 13; a 2 saiu
    log.push('migração, 1 a 22 vencidas com 2 estrelas: '+JSON.stringify(m));
    if(m.versao!=='3' || m.vencidas.join(',')!==seq(1,14) || m.estrelas!=='2'.repeat(14) || m.atual!==15 || m.ultimaLiberada!==15 || m.salva!==13 || m.partidas!=='[[13,1,30,5,0,"2026-11-09"]]' || !m.copia)
      errs.push('migração 1 a 22 deu errado: '+JSON.stringify(m)); }
  { const m=await migra(7, 19);   // parou na 8 (Pontos no 5x5, que saiu): segue no Primeiro cometa (agora 5); a 19 mudou de meta, a fase pela metade some
    log.push('migração, 1 a 7 vencidas: '+JSON.stringify(m));
    if(m.atual!==5 || m.vencidas.join(',')!==seq(1,4)+',6' || m.salva!==null) errs.push('migração 1 a 7 deu errado: '+JSON.stringify(m)); }
  { const m=await migra(45);   // parou na 46 (Asteroide entre estações), que agora é a 30
    log.push('migração, 1 a 45 vencidas: '+JSON.stringify({atual:m.atual, vencidas:m.vencidas.length, estrelas:m.estrelas}));
    if(m.atual!==30 || m.vencidas.join(',')!==seq(1,29)) errs.push('migração 1 a 45 deu errado: '+JSON.stringify(m)); }
  { const m=await migra(0);   // quem nunca jogou
    if(m.vencidas.length || m.atual!==1 || m.versao!=='3') errs.push('migração sem progresso deu errado: '+JSON.stringify(m)); }
  for(const k of ['mina_missoes','mina_cla_save','ptui_partidas','mina_missoes_v2','ptui_partidas_v2']) w.localStorage.removeItem(k);
 }catch(e){errs.push('EXC '+e.message+' '+(e.stack||'').split('\n')[1])}
 out.textContent=JSON.stringify({log,errs},null,1);};
</script></body>
