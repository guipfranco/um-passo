<!-- tempo: 60000 -->
<body style="margin:0"><iframe id="f" src="../index.html" width="390" height="760" style="border:0"></iframe><pre id="out" style="position:absolute;left:400px;top:0">x</pre>
<script>
// Clássico: menu, lista de fases, abertura da fase, jogar até o fim, estrelas, próxima fase liberada, sair pela pausa.
const MODE=location.hash.slice(1)||'test';
f.onload=async()=>{const w=f.contentWindow,d=w.document,errs=[],log=[];w.addEventListener('error',e=>errs.push(e.message+' @'+e.lineno));w.addEventListener('unhandledrejection',e=>errs.push('rej '+e.reason));
 const wait=ms=>new Promise(r=>setTimeout(r,ms)); const q=s=>d.querySelector(s);
 const joga=async()=>{ // robô guloso até acabar os arrastos ou travar
   for(let i=0;i<120 && w.eval('S.phase')==='mine';i++){
     const dir=w.eval(`(()=>{ let b=null,bs=-1; for(const [dx,dy] of [[0,1],[-1,0],[1,0],[0,-1]]){ const r=slide(S.tiles,dx,dy); if(!r.moved) continue; const s=r.merges.reduce((a,o)=>a+Math.pow(2,o.t),0)+r.breaks.length*20+Math.random(); if(s>bs){bs=s;b=[dx,dy];} } return b; })()`);
     if(!dir) break; w.eval(`move(${dir[0]},${dir[1]})`); await wait(20);
   }
   await wait(600); w.eval('S.skip=true'); for(let i=0;i<40 && q('#btnSell').style.display==='none';i++) await wait(250);
 };
 try{ w.eval('sound=false; music=false; localStorage.removeItem("mina_missoes")');
  log.push('menu: '+[...d.querySelectorAll('.menuBtns > button, .menuBtns .labRow button')].map(b=>b.firstChild.textContent.trim()).join(' | '));
  q('#mCla').click(); await wait(100);
  log.push(`lista: grupos=${d.querySelectorAll('.mGrupo').length} fases=${d.querySelectorAll('.mNo').length} travadas=${d.querySelectorAll('.mNo.trava').length} atual=${q('.mNo.atual')?.dataset.m} caminho=${!!q('.mCaminho polyline')} hud oculto=${w.getComputedStyle(q('.hud')).display==='none'}`);
  if(MODE==='lista'){ out.textContent='ok'; return; }
  q('[data-m="1"]').click(); await wait(50);
  log.push('abertura: '+q('#panel h2').textContent+' · '+q('.objetivo').textContent+' · '+q('#panel .ajuda').textContent);
  if(MODE==='abertura'){ out.textContent='ok'; return; }
  q('#mJoga').click(); await wait(100);
  log.push(`jogando: missao=${w.eval('S.missao')} energia=${w.eval('S.energy')} hud=${q('#hQuota').textContent} ${q('#hQuotaDay').textContent} banner=${q('#bSub').textContent} botão=${q('#btnEnd').textContent}`);
  if(MODE==='jogando'){ out.textContent='ok'; return; }
  await joga();
  log.push(`fim: arrastos=${w.eval('S.moves')} feitas=${w.eval('JSON.stringify(S.feitas)')} linha=${q('#recLine').textContent} botão=${q('#btnSell').textContent} torrões=${w.eval('S.tiles.filter(t=>t.t===0).length')}`);
  if(MODE==='fim'){ out.textContent='ok'; return; }
  q('#btnSell').click(); await wait(100);
  log.push('resultado: '+q('#panel h2').textContent+' estrelas='+d.querySelectorAll('#panel .estr i.on').length+' salvo='+w.eval('localStorage.mina_missoes'));
  if(MODE==='resultado'){ out.textContent='ok'; return; }
  // força uma derrota: a fase 1 sem formar nada
  w.eval('missaoJoga(1); S.energy=1'); await wait(50);
  const dir=w.eval(`[[0,1],[-1,0],[1,0],[0,-1]].find(([dx,dy])=>{ const r=slide(S.tiles,dx,dy); return r.moved && !r.merges.length; })`);
  if(dir){ w.eval(`move(${dir[0]},${dir[1]})`); await wait(700); w.eval('S.skip=true'); for(let i=0;i<40 && q('#btnSell').style.display==='none';i++) await wait(250);
    log.push('derrota: '+q('#recLine').textContent); q('#btnSell').click(); await wait(50); log.push('painel: '+q('#panel h2').textContent+' | '+q('#panel p').textContent); }
  // lista: fase 2 liberada; pausa durante a fase volta para a lista
  q('#mLista').click(); await wait(80);
  log.push(`lista depois: travadas=${d.querySelectorAll('.mNo.trava').length} atual=${q('.mNo.atual')?.dataset.m} estrelas fase 1=${q('[data-m="1"]').querySelectorAll('.estr i.on').length} banner=${q('#bSub').textContent}`);
  q('[data-m="2"]').click(); await wait(30); q('#mJoga').click(); await wait(80);
  w.eval('pauseMenu()'); await wait(30); q('#pExit').click(); await wait(80);
  log.push('pausa > sair: lista='+!!q('.mTrilha')+' | sair da lista: '); w.eval('pauseMenu()'); await wait(30); q('#pExit').click(); await wait(50); log.push('menu='+q('#scrMenu').classList.contains('on')+' save mineração='+!!w.eval('localStorage.mina_save'));
 }catch(e){errs.push('EXC '+e.message+' '+(e.stack||'').split('\n')[1])}
 out.textContent=JSON.stringify({log,errs},null,1);};
</script></body>
