<!-- tempo: 120000 -->
<meta charset="utf-8">
<body style="margin:0"><iframe id="f" src="../index.html" width="390" height="760" style="border:0"></iframe><pre id="out" style="position:absolute;left:400px;top:0">x</pre>
<script src="calibrar/quebra_medidor.js"></script>
<script>
// Jornada de quebra-cabeças (src/quebra_fases.js): cada fase tem solução com min arrastos e nenhuma mais curta
// (busca em largura com o slide() do jogo, calibrar/quebra_medidor.js), e a solução cumpre a fase NO JOGO, no último
// arrasto e não antes: a fase entra em MISSOES, missaoJoga a abre e move() faz os arrastos, com as metas conferidas
// por checaMissao. A solução guardada em calibrar/quebra_medidas.json também é repetida no jogo. Também: cada fase tem um
// id único que bate com o conteúdo dela (calibrar/quebra_id.mjs), QJ_ANTIGA aponta para fases que existem, e a migração
// do progresso da versão 1 (qjMigra em src/quebra.js) leva quem já jogava ao ponto equivalente.
// #qc testa os quebra-cabeças de src/quebracabecas.js (só repete a solução achada).
const DIR={D:[1,0],E:[-1,0],B:[0,1],C:[0,-1]};
f.onload=async()=>{const w=f.contentWindow,errs=[],log=[];w.addEventListener('error',e=>errs.push(e.message+' @'+e.lineno));
 try{ w.eval('sound=false; music=false');
  const qc=location.hash==='#qc';
  const fases=qc ? Object.entries(w.eval('QC')).map(([k,q])=>({...q, g:0, nome:k, min:null})) : w.eval('typeof QJ_FASES!=="undefined"?QJ_FASES:null');
  if(!fases){ errs.push('QJ_FASES não está no index.html'); throw 0; }
  if(!qc){ const mund=w.eval('QJ_MUNDOS'); if(mund.length!==11) errs.push('QJ_MUNDOS com '+mund.length+' mundos');
    if(fases.length<100) errs.push('só '+fases.length+' fases');
    mund.forEach((m,g)=>{ if(!fases.some(q=>q.g===g)) errs.push('mundo sem fase: '+m.nome); });
    // id: o mesmo resumo de calibrar/quebra_id.mjs
    const idFase=f=>{ const k=JSON.stringify([f.mapa, f.pecas, f.muretas||[], f.carroPos||null, f.alvosPos||null, f.terraPos||null, f.presasPos||null, f.objs||[f.obj], f.char||'rola']);
      let h=0x811c9dc5; for(let i=0;i<k.length;i++){ h^=k.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return 'q'+h.toString(36).padStart(7,'0'); };
    const ids=fases.map(q=>q.id); if(new Set(ids).size!==fases.length) errs.push('ids repetidos');
    fases.forEach((q,i)=>{ if(q.id!==idFase(q)) errs.push(`fase ${i+1}: id ${q.id} não bate com o conteúdo (${idFase(q)})`); });
    const A=w.eval('QJ_ANTIGA'), pos=A.filter(v=>v>0);
    if(A.length!==110 || A.some(v=>!v || Math.abs(v)>fases.length) || new Set(pos).size!==pos.length) errs.push('QJ_ANTIGA inválida');
    log.push(`ids: ${new Set(ids).size} únicos; da versão 1 continuam ${pos.length} fases`); }
  // soluções guardadas
  let guard=null; try{ const x=new XMLHttpRequest(); x.open('GET','calibrar/quebra_medidas.json',false); x.send(); guard=JSON.parse(x.responseText).fases; }catch(e){ log.push('sem quebra_medidas.json ('+e.message+')'); }
  // 1) busca com o slide() do jogo (S, W e H do jogo trocados enquanto busca)
  const env=w.eval(`({slide:(t,dx,dy)=>slide(t,dx,dy), ajusta:(w_,h_,walls,edges,ch)=>{ W=w_; H=h_; S={walls,edges,char:ch}; }})`);
  const M=QM.QuebraMedidor(env), sols=[];
  const t0=Date.now();
  fases.forEach((q,i)=>{ const b=M.buscaMin(q, q.min??20, 2000000);
    if(b.problemas) errs.push(`fase ${i+1} ${q.nome}: ${b.problemas.join('; ')}`);
    else if(b.min==null) errs.push(`fase ${i+1} ${q.nome}: sem solução até ${q.min??20}`);
    else if(q.min!=null && b.min!==q.min) errs.push(`fase ${i+1} ${q.nome}: menor solução ${b.min}, a fase diz ${q.min}`);
    if(!qc){ if(q.arrastos!==q.min+4) errs.push(`fase ${i+1}: arrastos ${q.arrastos} ≠ min+4`);
      if(!(q.g>=0 && q.g<=10)) errs.push(`fase ${i+1}: mundo ${q.g}`); if(!q.nome) errs.push(`fase ${i+1} sem nome`);
      if(q.regras?.spawns!==0) errs.push(`fase ${i+1}: nasce peça`); }
    sols.push(b.sol); });
  log.push(`busca: ${fases.length} fases em ${Date.now()-t0} ms`);
  // 2) no jogo de verdade
  // as fases da jornada de quebra-cabeças jogam nela (JA=QUEBRA, pelo número); as de #qc entram na Jornada
  const joga=(q,sol,rot,n)=>{
    if(qc) w.eval(`JA=JORNADA; MISSOES.push(${JSON.stringify({...q, nome:'teste '+q.nome})}); missaoJoga(MISSOES.length)`);
    else w.eval(`JA=QUEBRA; missaoJoga(${n})`);
    let fim=0;
    try{ for(let i=0;i<sol.length;i++){ const [dx,dy]=DIR[sol[i]]; const antes=w.eval('S.moves');
        w.eval(`move(${dx},${dy})`);
        if(w.eval('S.moves')!==antes+1) return `${rot}: arrasto ${i+1} (${sol[i]}) não mexeu`;
        if(w.eval('S.phase')==='fimM'){ fim=i+1; break; } }
      if(fim!==sol.length) return `${rot}: ${fim?'acabou no arrasto '+fim:'não acabou'} (solução de ${sol.length})`;
      if(!w.eval('cumpriu(faseM())')) return `${rot}: acabou sem cumprir (${w.eval('JSON.stringify(violou(faseM())||null)')})`;
      return null;
    } finally { w.eval(`S.phase="teste"; hideOverlay(); ${qc?'MISSOES.pop();':''}`); }   // fora de 'fimM': o resultado atrasado não abre
  };
  let ok=0, okG=0;
  fases.forEach((q,i)=>{ if(!sols[i]) return;
    const e=joga(q,sols[i],`fase ${i+1} ${q.nome} (solução da busca)`,i+1); if(e) errs.push(e); else ok++;
    const g=!qc && guard?.[i]; if(g){ if(g.nome!==q.nome) errs.push(`fase ${i+1}: medidas de outra fase (${g.nome})`);
      const e2=joga(q,g.sol,`fase ${i+1} ${q.nome} (solução guardada)`,i+1); if(e2) errs.push(e2); else okG++; } });
  w.eval('JA=JORNADA');
  log.push(`no jogo: ${ok} de ${fases.length} cumpridas no último arrasto da solução achada; ${okG} com a solução guardada`);
  if(!qc && !guard) errs.push('sem as soluções guardadas (calibrar/quebra_medidas.json)');
  if(!qc && guard && guard.length!==fases.length) errs.push(`quebra_medidas.json tem ${guard.length} fases, quebra_fases.js ${fases.length}`);
  // 3) migração do progresso da versão 1: quem venceu as fases antigas 1 a 3 (e parou na 4, pela metade) e quem venceu
  // até a 30 abrem o jogo de novo (iframe novo: a migração roda ao carregar)
  if(!qc){ const A=w.eval('QJ_ANTIGA'), L=w.localStorage;
    const migra=async(ate, salva)=>{
      const v1={}; for(let n=1;n<=ate;n++) v1[n]={e:3,t:10*n,a:5};
      L.removeItem('ptui_qj_v'); L.ptui_qj=JSON.stringify(v1);
      if(salva) L.ptui_qj_save=JSON.stringify({n:salva,pass:false,st:{},qj:{ini:{},pilha:[],trava:null}}); else L.removeItem('ptui_qj_save');
      const g=document.createElement('iframe'); g.width=390; g.height=760; g.style.cssText='position:absolute;left:0;top:0;border:0';
      const pronto=new Promise(r=>g.onload=r); g.src='../index.html'; document.body.appendChild(g); await pronto;
      const v=g.contentWindow, r=JSON.parse(v.localStorage.ptui_qj||'{}'), sv=JSON.parse(v.localStorage.ptui_qj_save||'null');
      const lib=[]; for(let n=1;n<=fases.length;n++) if(n===1 || r[n-1]?.e>0) lib.push(n);
      const ponto=Math.abs(A[ate]), ultima=lib[lib.length-1];
      const res=`venceu 1-${ate}: versão=${v.localStorage.ptui_qj_v} liberadas até ${ultima} (equivalente da antiga ${ate+1}: ${ponto}) cópia=${!!v.localStorage.ptui_qj_v1} salva=${sv?.n??null}`;
      log.push('migração: '+res);
      if(v.localStorage.ptui_qj_v!=='2' || !v.localStorage.ptui_qj_v1 || ultima<ponto) errs.push('migração: '+res);
      for(let n=1;n<=ate;n++) if(A[n-1]>0 && r[A[n-1]]?.e!==3) errs.push(`migração: a fase antiga ${n} continua como ${A[n-1]} mas perdeu as estrelas`);
      if(salva){ const k=A[salva-1]; if(k>0 ? sv?.n!==k : sv) errs.push(`migração: fase pela metade ${salva} → ${sv?.n} (esperado ${k>0?k:'nenhuma'})`); }
      g.remove(); };
    await migra(3, 4); await migra(30, 0);
    L.removeItem('ptui_qj'); L.removeItem('ptui_qj_save'); L.removeItem('ptui_qj_v1'); L.removeItem('ptui_qj_save_v1'); L.ptui_qj_v='2'; }
 }catch(e){ if(e!==0) errs.push('EXC '+e.message+' | '+(e.stack||'').slice(0,300)); }
 out.textContent=JSON.stringify({log,errs});
};
</script></body>
